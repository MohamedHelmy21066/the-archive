import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPfUxK3YcGD8orPtG2ji7AOD7bfclzq1s",
  authDomain: "tracker-b2a0a.firebaseapp.com",
  projectId: "tracker-b2a0a",
  storageBucket: "tracker-b2a0a.firebasestorage.app",
  messagingSenderId: "150657260159",
  appId: "1:150657260159:web:b757cdcb96cf146f5ebd4a"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const itemsDocRef = doc(db, "tracker", "items");

(function(){
  "use strict";

  const TMDB_KEY = "906ae7839d3a89a271e9832140b5b59b";
  const TMDB_BASE = "https://api.themoviedb.org/3";
  const IMG_BASE = "https://image.tmdb.org/t/p/w342";
  const STORAGE_KEY = "archive-titles-v1";

  // "core" categories are load-bearing — Stats, Surprise Me, and the finished-movie
  // reordering all key off these exact keys. They can be relabeled but not deleted.
  // Anything else the user adds is a plain custom bucket with no special behaviour.
  const DEFAULT_CATEGORIES = {
    movie: [
      {key:"unwatched", label:"Unwatched", core:true},
      {key:"finished", label:"Finished", core:true},
      {key:"favourite", label:"Favourites", core:true}
    ],
    tv: [
      {key:"up_to_date", label:"Up to date", core:true},
      {key:"havent_started", label:"Haven't started", core:true},
      {key:"finished", label:"Finished", core:true},
      {key:"stopped", label:"Stopped", core:true},
      {key:"favourite", label:"Favourites", core:true}
    ]
  };

  // The Arabic library uses the exact same default category set as English.
  const ARABIC_DEFAULT_CATEGORIES = DEFAULT_CATEGORIES;

  // If a library's saved categories are missing a core category (e.g. an
  // existing Arabic library saved before "Up to date" was added back), this
  // adds it back automatically — safe to run on any already-complete set too.
  function ensureCoreCategories(categories){
    ['movie', 'tv'].forEach(type => {
      const existingKeys = new Set(categories[type].map(c => c.key));
      DEFAULT_CATEGORIES[type].forEach(defCat => {
        if(!existingKeys.has(defCat.key)){
          categories[type].push({...defCat});
        }
      });
    });
    return categories;
  }

  function newLibraryState(library){
    const defaults = library === 'arabic' ? ARABIC_DEFAULT_CATEGORIES : DEFAULT_CATEGORIES;
    return {
      items: [],
      categories: {
        movie: defaults.movie.map(c => ({...c})),
        tv: defaults.tv.map(c => ({...c})),
        _orderMigrated: true // brand new library — nothing to migrate
      },
      filterOrder: {
        movie: ['all', ...defaults.movie.map(c => c.key)],
        tv: ['all', ...defaults.tv.map(c => c.key)]
      },
      activeType: 'movie',
      activeFilter: 'all',
      archiveQuery: ''
    };
  }

  let activeLibrary = 'english';
  const libraries = {};
  let state = newLibraryState(activeLibrary);

  // Editable title/subtitle/tab-label text — shared across devices, not tied
  // to either library's item data, so it's stored and saved separately.
  let libraryMeta = {
    title1: 'THE',
    title2: 'ARCHIVE',
    english: {subtitle: 'a running record of everything watched', tabLabel: 'English Archive'},
    arabic: {subtitle: 'a running record of Arabic movies and TV shows', tabLabel: 'Arabic Archive'}
  };

  function applyLibraryMeta(saved){
    if(!saved) return;
    if(saved.title1) libraryMeta.title1 = saved.title1;
    if(saved.title2) libraryMeta.title2 = saved.title2;
    ['english', 'arabic'].forEach(lib => {
      if(saved[lib]){
        if(saved[lib].subtitle) libraryMeta[lib].subtitle = saved[lib].subtitle;
        if(saved[lib].tabLabel) libraryMeta[lib].tabLabel = saved[lib].tabLabel;
      }
    });
  }

  function renderLibraryMeta(){
    document.getElementById('archiveTitlePart1').textContent = libraryMeta.title1;
    document.getElementById('archiveTitlePart2').textContent = libraryMeta.title2;
    document.getElementById('englishTabLabel').textContent = libraryMeta.english.tabLabel;
    document.getElementById('arabicTabLabel').textContent = libraryMeta.arabic.tabLabel;
    document.getElementById('archiveSubtitle').textContent = libraryMeta[activeLibrary].subtitle;
  }

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const filterRow = document.getElementById('filterRow');
  const searchInput = document.getElementById('searchInput');
  const archiveSearchInput = document.getElementById('archiveSearchInput');
  const archiveSearchClear = document.getElementById('archiveSearchClear');
  const archiveSearchWrap = document.getElementById('archiveSearchWrap');
  const searchResults = document.getElementById('searchResults');
  const toastEl = document.getElementById('toast');

  // Exports a plain, human-readable list of whichever library is currently
  // open — Movies then TV Shows, grouped by category, title and year on
  // their own line. Purely local: reads only from the in-memory state
  // already showing on screen, no network call needed.
  function exportLibraryList(){
    const lib = activeLibrary;

    function section(type, heading){
      let out = `${heading}\n`;
      let any = false;
      state.categories[type].forEach(cat => {
        const items = orderedBucket(type, cat.key);
        if(!items.length) return;
        any = true;
        out += `\n${cat.label}\n`;
        items.forEach(item => {
          out += `${item.title} (${item.year})\n`;
        });
      });
      if(!any) out += '\n(nothing here yet)\n';
      return out;
    }

    const dateStr = new Date().toLocaleDateString();
    let text = `${libraryMeta.title1} ${libraryMeta.title2} — ${libraryMeta[lib].tabLabel}\n`;
    text += `Exported ${dateStr}\n`;
    text += '='.repeat(40) + '\n\n';
    text += section('movie', 'MOVIES') + '\n';
    text += section('tv', 'TV SHOWS');

    const file = new Blob([text], {type: 'text/plain'});
    const url = URL.createObjectURL(file);
    const link = document.createElement('a');
    const fileDate = new Date().toISOString().slice(0, 10);
    link.href = url;
    link.download = `${lib}-archive-${fileDate}.txt`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    showToast('List exported');
  }

  document.getElementById('exportBackupBtn').addEventListener('click', exportLibraryList);

  // Flips the storage order of whichever category is currently selected — the
  // same reversal used by the one-time Finished/Favourites fix, but available
  // any time, on any category, in either library. Undoable like everything else.
  function flipCurrentCategoryOrder(){
    if(state.activeFilter === 'all'){
      showToast('Pick a specific category first, not "All"');
      return;
    }
    const bucket = state.items.filter(i => i.type === state.activeType && i.category === state.activeFilter);
    if(bucket.length < 2){
      showToast('Nothing to flip here');
      return;
    }
    pushUndo();
    const reversedBucket = bucket.slice().reverse();
    const ids = new Set(bucket.map(i => i.id));
    const firstIdx = state.items.findIndex(i => ids.has(i.id));
    const rest = state.items.filter(i => !ids.has(i.id));
    const insertPos = Math.min(firstIdx, rest.length);
    rest.splice(insertPos, 0, ...reversedBucket);
    state.items = rest;
    persist();
    renderGrid();
    showToast(`Flipped "${labelForCat(state.activeType, state.activeFilter)}"`);
    machineLog(`Flipped order of "${labelForCat(state.activeType, state.activeFilter)}".`);
  }

  document.getElementById('flipOrderBtn').addEventListener('click', flipCurrentCategoryOrder);

  // Re-fetches every title in the currently open library directly by its TMDB
  // ID (not a new search — so there's no risk of matching a different title),
  // using that library's language. Updates the displayed name, poster, and
  // detail info wherever TMDB actually has a translation for it; titles TMDB
  // doesn't have translated simply keep their current name, unchanged.
  let refreshingTitles = false;

  async function refreshLibraryTitles(){
    if(refreshingTitles) return;
    const library = activeLibrary;
    const items = state.items.filter(i => i.tmdbId && !i.titleLocked);
    if(!items.length){ showToast('Nothing to refresh yet'); return; }

    const label = libraryMeta[library].tabLabel;
    if(!confirm(`Re-fetch all ${items.length} titles in ${label} using its language? Titles already in that language are unaffected. This can take a minute or two.`)) return;

    pushUndo(); // one snapshot covers the whole bulk refresh — Undo reverts all of it at once

    refreshingTitles = true;
    const btn = document.getElementById('refreshTitlesBtn');
    const originalLabel = btn.textContent;
    btn.disabled = true;
    let done = 0;

    function updateProgress(){
      btn.textContent = `Refreshing… ${done}/${items.length}`;
    }
    updateProgress();

    const CONC = 6;
    let idx = 0;
    async function worker(){
      while(idx < items.length){
        const item = items[idx++];
        const isMovie = item.type === 'movie';
        const [details, credits] = await Promise.all([
          isMovie ? tmdbMovieDetails(item.tmdbId, library) : tmdbTvDetails(item.tmdbId, library),
          isMovie ? tmdbMovieCredits(item.tmdbId, library) : tmdbTvCredits(item.tmdbId, library)
        ]);
        if(details){
          const newTitle = isMovie ? details.title : details.name;
          if(newTitle && newTitle.trim()) item.title = newTitle.trim();
          if(details.poster_path !== undefined && !item.posterLocked) item.posterPath = details.poster_path || null;
          item.detailOverview = details.overview || '';
          item.detailGenres = details.genres ? details.genres.map(g => g.name) : [];
          item.detailRating = details.vote_average ? Math.round(details.vote_average * 10) / 10 : null;
          item.detailRuntime = isMovie
            ? (details.runtime || null)
            : ((details.episode_run_time && details.episode_run_time.length) ? details.episode_run_time[0] : null);
          item.detailSeasons = !isMovie ? (details.number_of_seasons || null) : null;
          item.detailEpisodes = !isMovie ? (details.number_of_episodes || null) : null;
          item.detailFetched = true;
        }
        if(credits && credits.cast){
          item.detailCast = credits.cast.slice(0, 6).map(c => ({name: c.name, character: c.character, profilePath: c.profile_path}));
        }
        done++;
        updateProgress();
        if(done % 20 === 0 && activeLibrary === library){
          persist();
          renderGrid();
        }
      }
    }
    const workers = [];
    for(let i = 0; i < CONC; i++) workers.push(worker());
    await Promise.all(workers);

    refreshingTitles = false;
    btn.disabled = false;
    btn.textContent = originalLabel;
    if(activeLibrary === library){
      persist();
      renderGrid();
      renderStats();
      showToast(`Refreshed ${done} titles`);
    }
  }

  document.getElementById('refreshTitlesBtn').addEventListener('click', refreshLibraryTitles);

  function uid(){
    return 'x' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  // ---------- Storage ----------
  // Saves to Firestore (a cloud database) instead of the browser, so the
  // same list — and your custom categories — show up no matter which
  // browser or device you open this file from. A local cache is kept as
  // a fallback if you're offline.
  function storedLibrary(data, library){
    if(library === 'arabic') return data.arabicArchive || null;
    return Array.isArray(data.items) ? data : null;
  }

  let gateCloudResolve = null;
  const gateCloudP = new Promise(r => { gateCloudResolve = r; });

  // ======================================================================
  //  Storage: this device first, cloud in the background.
  //  Every edit is saved on the device immediately and marked "not uploaded yet" until the cloud confirms it.
  //  If the connection is weak, nothing is lost: it retries automatically, and when the same title was changed on
  //  another device the two versions are merged instead of one overwriting the other.
  // ======================================================================
  const syDirtyKey = k => `${STORAGE_KEY}-dirty-${k}`;
  const dirtySeq = {english: 0, arabic: 0, meta: 0};
  const syBusy = {}, syAgain = {}, syTimers = {};
  let syNoteShown = false, syFailing = false, syLastResume = 0, syCloudP = null;

  function syStable(v){
    if(v === null || typeof v !== 'object') return JSON.stringify(v);
    if(Array.isArray(v)) return '[' + v.map(syStable).join(',') + ']';
    return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + syStable(v[k])).join(',') + '}';
  }
  function syWithTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
  function syIsDirty(k){ try{ return !!localStorage.getItem(syDirtyKey(k)); }catch(e){ return false; } }
  function sySetDirty(k){ try{ localStorage.setItem(syDirtyKey(k), String(Date.now())); }catch(e){} }
  function syClearDirty(k){ try{ localStorage.removeItem(syDirtyKey(k)); }catch(e){} }
  function syReadBase(lib){ try{ return JSON.parse(localStorage.getItem(`${STORAGE_KEY}-base-${lib}`)); }catch(e){ return null; } }
  function syWriteBase(lib, data){ try{ localStorage.setItem(`${STORAGE_KEY}-base-${lib}`, JSON.stringify(data)); }catch(e){} }

  // one cloud read shared by everything that needs it at startup
  function getCloudSnap(fresh){
    if(!syCloudP || fresh){
      syCloudP = syWithTimeout(getDoc(itemsDocRef), 12000).catch(e => { syCloudP = null; throw e; });
    }
    return syCloudP;
  }

  // three-way merge by title: "base" = what both sides last agreed on
  function syMerge(base, local, cloud){
    const mapOf = arr => { const m = new Map(); (arr || []).forEach(i => m.set(i.id, i)); return m; };
    const eq = (a, b) => syStable(a) === syStable(b);
    const L = mapOf(local.items), C = mapOf(cloud.items), B = base ? mapOf(base.items) : null;
    const out = new Map();
    new Set([...L.keys(), ...C.keys()]).forEach(id => {
      const l = L.get(id), c = C.get(id), b = B ? B.get(id) : undefined;
      if(l && c){
        if(eq(l, c)){ out.set(id, l); return; }
        if(B && b){
          if(eq(c, b)){ out.set(id, l); return; }          // changed only on this device
          if(eq(l, b)){ out.set(id, c); return; }          // changed only elsewhere
          const m = {};                                    // changed on both: field by field, this device wins ties
          new Set([...Object.keys(l), ...Object.keys(c)]).forEach(k => {
            const v = eq(l[k], b[k]) ? c[k] : l[k];
            if(v !== undefined) m[k] = v;
          });
          out.set(id, m); return;
        }
        out.set(id, l); return;
      }
      if(l && !c){ if(B && b && eq(l, b)) return; out.set(id, l); return; }   // deleted elsewhere (untouched here) -> delete
      if(c && !l){ if(B && b && eq(c, b)) return; out.set(id, c); return; }   // deleted here (untouched there) -> delete
    });
    const ids = arr => (arr || []).map(i => i.id);
    const lo = ids(local.items), co = ids(cloud.items), bo = B ? ids(base.items) : null;
    const src = (bo && syStable(lo) === syStable(bo)) ? co : lo;                // whichever side reordered last
    const seen = new Set(), ordered = [];
    src.forEach(id => { if(out.has(id) && !seen.has(id)){ ordered.push(out.get(id)); seen.add(id); } });
    const extra = [...out.keys()].filter(id => !seen.has(id)).map(id => out.get(id));
    const pick = k => {
      const l = local[k], c = cloud[k], b = base ? base[k] : undefined;
      if(eq(l, c)) return l;
      if(base && eq(c, b)) return l;
      if(base && eq(l, b)) return c;
      return l;
    };
    return {items: extra.concat(ordered), categories: pick('categories'), filterOrder: pick('filterOrder')};
  }
  // update the live objects in place (an open title page may be holding them)
  function syApply(st, merged){
    const byId = new Map(st.items.map(i => [i.id, i]));
    const next = merged.items.map(m => {
      const cur = byId.get(m.id);
      if(!cur) return m;
      Object.keys(cur).forEach(k => { if(!(k in m)) delete cur[k]; });
      Object.keys(m).forEach(k => { if(syStable(cur[k]) !== syStable(m[k])) cur[k] = m[k]; });
      return cur;
    });
    st.items.length = 0;
    next.forEach(i => st.items.push(i));
    if(merged.categories) st.categories = ensureCoreCategories(merged.categories);
    if(merged.filterOrder) st.filterOrder = merged.filterOrder;
  }
  function syCloudShape(lib){
    return {items: lib.items, categories: (lib.categories && lib.categories.movie && lib.categories.tv) ? lib.categories : null, filterOrder: (lib.filterOrder && lib.filterOrder.movie && lib.filterOrder.tv) ? lib.filterOrder : null};
  }

  function syProblem(library){
    syFailing = true;
    if(!syNoteShown){ syNoteShown = true; showToast('Weak connection — your changes are saved on this device and will sync automatically'); }
    clearTimeout(syTimers[library]);
    syTimers[library] = setTimeout(() => syReconcile(library, true), 20000);
  }
  function syBackOnline(){
    if(syFailing){ syFailing = false; syNoteShown = false; showToast('Back online — your changes are synced'); }
  }

  async function sySync(library){
    if(syBusy[library]){ syAgain[library] = true; return; }
    const st = libraries[library] || (library === activeLibrary ? state : null);
    if(!st) return;
    syBusy[library] = true;
    const seq = dirtySeq[library];
    const saved = {items: st.items, categories: st.categories, filterOrder: st.filterOrder};
    try{
      await syWithTimeout(setDoc(itemsDocRef, library === 'arabic' ? {arabicArchive: saved} : saved, {merge: true}), 20000);
      syWriteBase(library, saved);
      if(seq === dirtySeq[library]) syClearDirty(library);
      syBackOnline();
    }catch(e){
      syProblem(library);
    }finally{
      syBusy[library] = false;
      if(syAgain[library]){ syAgain[library] = false; sySync(library); }
    }
  }

  function syAfterMerge(library){
    if(library !== activeLibrary) return;
    renderFilters(); renderGrid(); renderStats();
    hydratePosters(state.items).then(() => { if(activeLibrary === library) renderStats(); });
  }

  // compare this device with the cloud; merge; push whatever the cloud is missing
  async function syReconcile(library, fresh){
    let snap;
    try{ snap = await getCloudSnap(fresh); }
    catch(e){ syProblem(library); return; }
    const data = snap.exists() ? snap.data() : null;
    try{ if(gateCloudResolve) gateCloudResolve(data); }catch(e){}
    syApplyCloudMeta(data);
    const cloudLib = data ? storedLibrary(data, library) : null;
    let st = libraries[library];
    for(let i = 0; i < 40 && !st; i++){ await new Promise(r => setTimeout(r, 50)); st = libraries[library]; }
    if(!st) return;
    if(!cloudLib || !Array.isArray(cloudLib.items)){ if(syIsDirty(library)) sySync(library); return; }
    const local = {items: st.items, categories: st.categories, filterOrder: st.filterOrder};
    const cloud = syCloudShape(cloudLib);
    const before = syStable(local);
    const merged = syMerge(syReadBase(library), local, cloud);
    const mergedSig = syStable(merged);
    if(mergedSig !== before){
      syApply(st, merged);
      try{ localStorage.setItem(`${STORAGE_KEY}-${library}`, JSON.stringify({items: st.items, categories: st.categories, filterOrder: st.filterOrder})); }catch(e){}
      syAfterMerge(library);
    }
    if(mergedSig !== syStable(cloud)){ sySetDirty(library); dirtySeq[library]++; sySync(library); }
    else{ syClearDirty(library); syWriteBase(library, merged); syBackOnline(); }
  }

  async function loadItems(library = activeLibrary){
    const local = loadFromLocalCache(library);
    if(local && local.items && local.items.length){
      // this device already has a saved copy: show it right away, then check the cloud in the background
      setTimeout(() => syReconcile(library, library !== 'english'), 0);
      return local;
    }
    // nothing saved on this device yet: we have to wait for the cloud
    try{
      const snap = await getCloudSnap(library !== 'english');
      const data = snap.exists() ? snap.data() : null;
      try{ if(gateCloudResolve) gateCloudResolve(data); }catch(e){}
      syApplyCloudMeta(data);
      const libraryData = data ? storedLibrary(data, library) : null;
      if(libraryData && Array.isArray(libraryData.items)){
        const shaped = syCloudShape(libraryData);
        try{ localStorage.setItem(`${STORAGE_KEY}-${library}`, JSON.stringify(shaped)); }catch(e){}
        syWriteBase(library, shaped);
        return shaped;
      }
      return local;
    }catch(e){
      console.error('cloud load failed', e);
      syProblem(library);
      return {unreachable: true, items: []};
    }
  }

  function loadFromLocalCache(library){
    try{
      const raw = localStorage.getItem(`${STORAGE_KEY}-${library}`) || (library === 'english' ? localStorage.getItem(STORAGE_KEY) : null);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) return {items: parsed, categories: null, filterOrder: null}; // old cache format
        return {items: parsed.items || [], categories: parsed.categories || null, filterOrder: parsed.filterOrder || null};
      }
    }catch(e2){}
    return null;
  }

  const saveTimers = {english: null, arabic: null};
  function persist(){
    const library = activeLibrary;
    // 1) on this device right now (survives closing the app a moment later)
    try{ localStorage.setItem(`${STORAGE_KEY}-${library}`, JSON.stringify({items: state.items, categories: state.categories, filterOrder: state.filterOrder})); }catch(e){}
    // 2) remember it still has to reach the cloud, then upload shortly after
    dirtySeq[library]++; sySetDirty(library);
    clearTimeout(saveTimers[library]);
    saveTimers[library] = setTimeout(() => sySync(library), 400);
  }
  // when the connection comes back or you return to the app, finish any pending upload and pick up changes from other devices
  window.addEventListener('online', () => { ['english', 'arabic'].forEach(l => { if(libraries[l] || l === activeLibrary) syReconcile(l, true); }); });
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden'){
      ['english', 'arabic'].forEach(l => { if(syIsDirty(l) && (libraries[l] || l === activeLibrary)){ clearTimeout(saveTimers[l]); sySync(l); } });
    }else if(Date.now() - syLastResume > 45000){
      syLastResume = Date.now();
      if(libraries[activeLibrary] || true) syReconcile(activeLibrary, true);
    }
  });


  // ---------- TMDB ----------
  // When browsing the Arabic archive, ask TMDB for Arabic-language titles,
  // overviews, and cast names instead of the English default. TMDB doesn't
  // have an Arabic translation for every title, but uses one whenever it exists.
  // Accepts an explicit library so a long-running background fetch (like
  // hydrating posters) keeps using the library it started with, even if the
  // user switches tabs partway through.
  function tmdbLangParam(library = activeLibrary){
    return library === 'arabic' ? '&language=ar' : '';
  }

  async function tmdbFind(title, year, type, library = activeLibrary){
    const path = type === 'movie' ? 'search/movie' : 'search/tv';
    const yearParam = type === 'movie' ? `&year=${year}` : `&first_air_date_year=${year}`;
    const lang = tmdbLangParam(library);
    const url = `${TMDB_BASE}/${path}?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}${yearParam}${lang}`;
    try{
      const r = await fetch(url);
      if(!r.ok) return null;
      const data = await r.json();
      if(data.results && data.results.length){
        return data.results[0];
      }
      // retry without year constraint
      const url2 = `${TMDB_BASE}/${path}?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}${lang}`;
      const r2 = await fetch(url2);
      if(!r2.ok) return null;
      const data2 = await r2.json();
      if(data2.results && data2.results.length) return data2.results[0];
      return null;
    }catch(e){
      return null;
    }
  }

  async function tmdbSearchMulti(query){
    const url = `${TMDB_BASE}/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}${tmdbLangParam()}`;
    try{
      const r = await fetch(url);
      if(!r.ok) return [];
      const data = await r.json();
      return (data.results || []).filter(x => x.media_type === 'movie' || x.media_type === 'tv').slice(0,8);
    }catch(e){ return []; }
  }

  // Alternate poster art for the "change poster" picker — English archive
  // only, so this pulls English-language posters plus textless/no-language
  // art (the usual TV Time-style poster options), not the full every-locale
  // dump TMDB has on file.
  async function tmdbImages(id, type){
    const path = type === 'movie' ? 'movie' : 'tv';
    try{
      const r = await fetch(`${TMDB_BASE}/${path}/${id}/images?api_key=${TMDB_KEY}&include_image_language=en,null`);
      if(!r.ok) return [];
      const data = await r.json();
      return (data.posters || []).slice(0, 24);
    }catch(e){ return []; }
  }

  // concurrency-limited poster hydration
  async function hydratePosters(items, library = activeLibrary){
    const queue = items.filter(i => i.posterPath === undefined && !i.notFound);
    if(!queue.length) return;
    let idx = 0;
    let sinceLastSave = 0;
    const CONC = 6;

    // Guards every save this function makes — if the user switched to the other
    // library while this was still running in the background, we skip saving
    // here rather than writing the WRONG library's state. The fetched poster
    // data stays correct in memory either way and saves next time something
    // else changes in that library.
    function persistIfStillActive(){
      if(activeLibrary === library) persist();
    }

    async function worker(){
      while(idx < queue.length){
        const item = queue[idx++];
        const result = await tmdbFind(item.title, item.year, item.type, library);
        if(result){
          item.posterPath = result.poster_path || null;
          item.tmdbId = result.id;
        }else{
          item.posterPath = null;
          item.notFound = true;
        }
        renderPosterUpdate(item);
        sinceLastSave++;
        if(sinceLastSave >= 40){
          sinceLastSave = 0;
          persistIfStillActive();
        }
      }
    }
    const workers = [];
    for(let w=0; w<CONC; w++) workers.push(worker());
    await Promise.all(workers);
    persistIfStillActive();
  }

  function renderPosterUpdate(item){
    const card = grid.querySelector(`[data-id="${item.id}"]`);
    if(!card) return;
    const imgWrap = card.querySelector('.img-wrap');
    if(!imgWrap) return;
    if(item.posterPath){
      imgWrap.innerHTML = `<img src="${IMG_BASE}${item.posterPath}" alt="" loading="lazy">`;
    }else{
      imgWrap.innerHTML = `<div class="fallback">${escapeHtml(item.title)}</div>`;
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Rendering ----------
  // Effective pill order for a type — self-heals: keeps 'all' pinned somewhere
  // (adds it if missing), drops stale keys (deleted categories), and appends
  // any category the saved order doesn't know about yet (newly added, or
  // added from another device before this feature existed there).
  function orderedFiltersForType(type){
    const real = state.categories[type];
    const validKeys = new Set(['all', ...real.map(c => c.key)]);
    let order = (state.filterOrder && state.filterOrder[type]) ? state.filterOrder[type].filter(k => validKeys.has(k)) : [];
    if(!order.includes('all')) order.unshift('all');
    validKeys.forEach(k => { if(!order.includes(k)) order.push(k); });
    return order.map(key => ({
      key,
      label: key === 'all' ? 'All' : (real.find(c => c.key === key)?.label ?? key)
    }));
  }

  let pillJustDragged = false;

  function renderFilters(){
    const cats = orderedFiltersForType(state.activeType);
    filterRow.innerHTML = '';
    cats.forEach(c => {
      const count = c.key === 'all'
        ? state.items.filter(i => i.type === state.activeType).length
        : state.items.filter(i => i.type === state.activeType && i.category === c.key).length;
      const btn = document.createElement('button');
      btn.className = 'filter-pill' + (state.activeFilter === c.key ? ' active' : '');
      btn.dataset.key = c.key;
      btn.innerHTML = `${c.label} <span class="count">${count}</span>`;
      btn.addEventListener('click', () => {
        if(pillJustDragged){ pillJustDragged = false; return; }
        state.activeFilter = c.key;
        renderFilters();
        navTransition(renderGrid);
      });
      initPillDrag(btn);
      filterRow.appendChild(btn);
    });
  }

  // Drag-and-drop for the filter pills themselves, right on the page — same
  // press-and-slide approach as the poster grid. Distance is measured in 2D
  // since the pill row wraps onto multiple lines. A real drag is distinguished
  // from a normal tap (which switches the filter) via a small movement threshold.
  function initPillDrag(btn){
    btn.addEventListener('pointerdown', (e) => {
      if(e.button !== undefined && e.button !== 0) return;

      const pointerId = e.pointerId;
      const isTouch = e.pointerType === 'touch';
      const startX = e.clientX, startY = e.clientY;
      let holdTimer = null;
      let armed = false;
      let cancelled = false;
      let ctx = null;
      let rafId = null;
      let pendingEv = null;

      function beginDrag(ev){
        if(cancelled) return;
        armed = true;
        const rect = btn.getBoundingClientRect();
        const placeholder = document.createElement('div');
        placeholder.className = 'filter-pill pill-placeholder';
        placeholder.style.width = rect.width + 'px';
        placeholder.style.height = rect.height + 'px';
        filterRow.insertBefore(placeholder, btn);

        ctx = {
          placeholder,
          offsetX: ev.clientX - rect.left,
          offsetY: ev.clientY - rect.top,
          currentTarget: null // {el, before} — last slot we actually committed to
        };

        btn.classList.add('pill-dragging');
        btn.style.position = 'fixed';
        btn.style.left = rect.left + 'px';
        btn.style.top = rect.top + 'px';
        btn.style.width = rect.width + 'px';
        btn.style.height = rect.height + 'px';
        btn.style.pointerEvents = 'none';
        document.body.appendChild(btn);

        try{ btn.setPointerCapture(pointerId); }catch(err){}
        updateDragPosition(ev);
      }

      // Runs at most once per animation frame (pointermove can fire far more
      // often than the screen can redraw), and needs a candidate slot to beat
      // the current one by a clear margin before switching — small, closely-
      // packed pills otherwise flicker between two near-equal choices.
      function updateDragPosition(ev){
        btn.style.left = (ev.clientX - ctx.offsetX) + 'px';
        btn.style.top = (ev.clientY - ctx.offsetY) + 'px';

        const HYSTERESIS = 14; // px a new candidate must beat the current slot by
        const siblings = Array.from(filterRow.children).filter(el => el !== ctx.placeholder);
        let closest = null, closestDist = Infinity, before = true;
        for(const sib of siblings){
          const r = sib.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const dist = Math.hypot(ev.clientX - cx, ev.clientY - cy);
          if(dist < closestDist){
            closestDist = dist;
            closest = sib;
            before = ev.clientX < cx;
          }
        }
        if(!closest) return;

        if(ctx.currentTarget && ctx.currentTarget.el === closest && ctx.currentTarget.before === before){
          return; // same slot as last time, nothing to do
        }
        if(ctx.currentTarget){
          const r = ctx.currentTarget.el.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const currentDist = Math.hypot(ev.clientX - cx, ev.clientY - cy);
          if(closestDist > currentDist - HYSTERESIS) return; // not a clear enough win, stay put
        }

        ctx.currentTarget = {el: closest, before};
        filterRow.insertBefore(ctx.placeholder, before ? closest : closest.nextSibling);
      }

      function scheduleUpdate(ev){
        pendingEv = ev;
        if(rafId) return;
        rafId = requestAnimationFrame(() => {
          rafId = null;
          updateDragPosition(pendingEv);
        });
      }

      function finishDrag(){
        if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
        filterRow.insertBefore(btn, ctx.placeholder);
        ctx.placeholder.remove();
        btn.classList.remove('pill-dragging');
        btn.style.position = '';
        btn.style.left = '';
        btn.style.top = '';
        btn.style.width = '';
        btn.style.height = '';
        btn.style.pointerEvents = '';
        const newOrder = Array.from(filterRow.children).map(el => el.dataset.key);
        ctx = null;
        // Suppresses a stray click if the browser fires one right after this
        // drag — but self-expires quickly so it can never eat a LATER, unrelated
        // click on some other pill if no such click ever comes.
        pillJustDragged = true;
        setTimeout(() => { pillJustDragged = false; }, 250);
        // If it ended up back in the exact same order it started in (picked up
        // and dropped in the same spot), skip entirely — no undo entry, no
        // save, nothing happens. Otherwise every such drag would silently
        // waste an Undo click on a change that never actually occurred.
        const oldOrder = orderedFiltersForType(state.activeType).map(c => c.key);
        const unchanged = newOrder.length === oldOrder.length && newOrder.every((k, i) => k === oldOrder[i]);
        if(unchanged) return;
        pushUndo();
        state.filterOrder[state.activeType] = newOrder;
        persist();
        renderFilters();
        renderGrid();
      }

      function cancelDrag(){
        if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
        if(!ctx) return;
        filterRow.insertBefore(btn, ctx.placeholder);
        ctx.placeholder.remove();
        btn.classList.remove('pill-dragging');
        btn.style.position = '';
        btn.style.left = '';
        btn.style.top = '';
        btn.style.width = '';
        btn.style.height = '';
        btn.style.pointerEvents = '';
        ctx = null;
      }

      function onMove(ev){
        if(ev.pointerId !== pointerId) return;
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(!armed){
          if(!isTouch && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
            beginDrag(ev);
          }else if(isTouch && (Math.abs(dx) > 10 || Math.abs(dy) > 10)){
            cancelled = true;
            clearTimeout(holdTimer);
          }
          return;
        }
        ev.preventDefault();
        scheduleUpdate(ev);
      }

      function onUp(ev){
        if(ev.pointerId !== pointerId) return;
        clearTimeout(holdTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancelEvt);
        if(armed) finishDrag();
      }

      function onCancelEvt(ev){
        if(ev.pointerId !== pointerId) return;
        clearTimeout(holdTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancelEvt);
        if(armed) cancelDrag();
      }

      if(isTouch){
        holdTimer = setTimeout(() => { if(!cancelled) beginDrag(e); }, 220);
      }
      document.addEventListener('pointermove', onMove, {passive: false});
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancelEvt);
    });
  }

  // Order for one type+category bucket — plain storage order. Whatever moved
  // in most recently sits at the front, always, for every category (see
  // changeCategory below, which is what actually moves things to the front).
  function orderedBucket(type, category){
    return state.items.filter(i => i.type === type && i.category === category);
  }

  // Whether this item is eligible for an explicit top-10 rank medal at all
  // (English library, TV, Favourites only) — independent of drag order.
  function rankEligible(item){
    return activeLibrary === 'english' && item.type === 'tv' && item.category === 'favourite';
  }

  function tierForRank(rank){
    if(rank === 1) return 'gold';
    if(rank === 2) return 'silver';
    if(rank === 3) return 'bronze';
    return 'purple';
  }

  // Explicitly assigns (or clears, when newRank is null) a top-10 rank on a
  // title. If another title already holds that rank, the two swap — nothing
  // is ever silently bumped or lost.
  function assignRank(id, newRank){
    const item = state.items.find(i => i.id === id);
    if(!item || !rankEligible(item)) return;
    const oldRank = item.rank || null;
    if(newRank === oldRank) return;
    pushUndo();

    // Leaderboard-style insert: pull everyone else's current ranking (in
    // order), drop this item into the requested slot, then renumber the
    // whole sequence 1..N. Anything pushed past #10 simply loses its badge.
    const others = state.items
      .filter(i => rankEligible(i) && i.id !== id && i.rank)
      .sort((a, b) => a.rank - b.rank);

    if(newRank !== null){
      others.splice(Math.min(newRank - 1, others.length), 0, item);
    }
    others.forEach((it, idx) => {
      if(idx < 10) it.rank = idx + 1;
      else delete it.rank;
    });
    if(newRank === null) delete item.rank;

    reorderFavouritesByRank();
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    if(newRank){
      showToast(`"${item.title}" set to #${newRank}`);
      machineLog(`Set "${item.title}" to rank #${newRank}.`);
    }else{
      showToast(`Removed "${item.title}"'s rank badge`);
      machineLog(`Removed "${item.title}"'s rank badge.`);
    }
  }

  // Pulls every ranked (English, TV, Favourites) title to the front of that
  // bucket in rank order, so #1 visually sits at the top of the grid and the
  // rest follow in order. Anything unranked keeps its existing relative order
  // right after them. This is what makes "set to #1" actually move the card.
  function reorderFavouritesByRank(){
    const bucket = state.items.filter(i => i.type === 'tv' && i.category === 'favourite');
    if(bucket.length < 2) return;
    const ids = new Set(bucket.map(i => i.id));
    const firstIdx = state.items.findIndex(i => ids.has(i.id));
    const rest = state.items.filter(i => !ids.has(i.id));
    const ranked = bucket.filter(i => i.rank).sort((a, b) => a.rank - b.rank);
    const unranked = bucket.filter(i => !i.rank);
    const newBucket = [...ranked, ...unranked];
    const insertPos = Math.min(firstIdx, rest.length);
    rest.splice(insertPos, 0, ...newBucket);
    state.items = rest;
  }

  let medalIdCounter = 0;
  function buildMedalSVG(rank, tier){

    const id = medalIdCounter;

        </defs>

        <polygon points="14,30 22,30 22,74 18,66 14,74" style="fill:url(#ribbon${id})"/>
        <polygon points="26,30 34,30 34,74 30,66 26,74" style="fill:url(#ribbon${id})"/>

        <circle cx="24" cy="25" r="21" style="fill:none;stroke:url(#ring${id});stroke-width:1.6"/>
        <circle cx="24" cy="25" r="19" style="fill:url(#face${id})"/>
        <circle cx="24" cy="25" r="15.5" style="fill:none;stroke:var(--detail);stroke-width:1;opacity:0.5"/>

        <g style="fill:var(--detail)">
          <ellipse cx="35.45" cy="17.85" rx="2.6" ry="1.25" transform="rotate(148 35.45 17.85)"/>
          <ellipse cx="37.37" cy="23.12" rx="2.6" ry="1.25" transform="rotate(172 37.37 23.12)"/>
          <ellipse cx="36.98" cy="28.72" rx="2.6" ry="1.25" transform="rotate(196 36.98 28.72)"/>
          <ellipse cx="34.34" cy="33.68" rx="2.6" ry="1.25" transform="rotate(220 34.34 33.68)"/>

        <g style="fill:var(--detail)">
          <polygon points="19.0,39.4 20.1,40.5 19.0,41.6 17.9,40.5"/>
          <polygon points="24.0,39.4 25.1,40.5 24.0,41.6 22.9,40.5"/>

        <ellipse cx="18" cy="15" rx="7" ry="4" transform="rotate(-30 18 15)" style="fill:#ffffff;opacity:0.35"/>

  }

  // One-time correction, run once per library right after it loads. Movies in
  // Finished/Favourites used to display in reverse of storage order (a separate
  // feature from the "moves to top" behavior above). That reversal was removed
  // when everything switched to the single, simpler storage-order rule — this
  // flips the two buckets' storage order once so the titles you already had
  // keep showing in the same order they always did, before anything new is
  // ever moved in and out. Only ever runs once per library; harmless to call
  // again since it checks the flag first.
  function migrateFinishedFavouriteOrder(){
    if(state.categories._orderMigrated) return false;
    ['finished', 'favourite'].forEach(cat => {
      const bucket = state.items.filter(i => i.type === 'movie' && i.category === cat);
      if(bucket.length < 2) return;
      const reversedBucket = bucket.slice().reverse();
      const ids = new Set(bucket.map(i => i.id));
      const firstIdx = state.items.findIndex(i => ids.has(i.id));
      const rest = state.items.filter(i => !ids.has(i.id));
      const insertPos = Math.min(firstIdx, rest.length);
      rest.splice(insertPos, 0, ...reversedBucket);
      state.items = rest;
    });
    state.categories._orderMigrated = true;
    return true;
  }

  function visibleItems(){
    const q = state.archiveQuery.trim().toLowerCase();
    let ordered;
    if(state.activeFilter === 'all'){
      ordered = state.items.filter(i => i.type === state.activeType);
    }else{
      ordered = orderedBucket(state.activeType, state.activeFilter);
    }
    if(q) ordered = ordered.filter(i => i.title.toLowerCase().includes(q));
    return ordered;
  }

  function renderStats(){
    document.getElementById('statTotal').textContent = state.items.length;
    document.getElementById('statFinished').textContent = state.items.filter(i => i.category === 'finished').length;
    document.getElementById('statFav').textContent = state.items.filter(i => i.category === 'favourite').length;
  }

  let lastCardTap = {id: null, time: 0};

  // ---------- Undo (whole-state snapshots — restores everything exactly, no
  // matter what kind of action was taken: add, delete, move, rename, reorder...) ----------
  let undoStack = [];
  const undoBtn = document.getElementById('undoBtn');

  function snapshotState(){
    return {
      items: JSON.parse(JSON.stringify(state.items)),
      categories: JSON.parse(JSON.stringify(state.categories)),
      filterOrder: JSON.parse(JSON.stringify(state.filterOrder))
    };
  }

  // Call this BEFORE making any change you want to be undoable — it captures
  // what things looked like right before that change.
  function pushUndo(){
    undoStack.push(snapshotState());
    if(undoStack.length > 20) undoStack.shift();
    updateUndoBtn();
  }

  function updateUndoBtn(){
    undoBtn.disabled = undoStack.length === 0;
    undoBtn.classList.toggle('has-actions', undoStack.length > 0);
  }

  function performUndo(){
    const snap = undoStack.pop();
    if(!snap){ updateUndoBtn(); return; }
    state.items = snap.items;
    state.categories = snap.categories;
    state.filterOrder = snap.filterOrder;
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    showToast('Undid last action');
    updateUndoBtn();
    machineLog('Admin reversed the last action (undo).');
  }

  undoBtn.addEventListener('click', performUndo);

  // ---- Smooth navigation transitions ----
  let navToken = 0, navTimer = null;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function playGridIn(){
    if(reduceMotion) return;
    const token = ++navToken;
    grid.classList.remove('nav-out', 'nav-in');
    grid.querySelectorAll('.poster-card').forEach((c, i) => c.style.setProperty('--d', Math.min(i, 24) * 20 + 'ms'));
    void grid.offsetWidth;
    grid.classList.add('nav-in');
    clearTimeout(navTimer);
    navTimer = setTimeout(() => { if(token === navToken) grid.classList.remove('nav-in'); }, 1100);
  }
  let shImmediate = false;
  function navTransition(update){
    if(reduceMotion){ update(); return; }
    if(shImmediate){ update(); playGridIn(); return; }
    const token = ++navToken;
    grid.classList.remove('nav-in');
    grid.classList.add('nav-out');
    setTimeout(() => {
      if(token !== navToken) return;
      update();
      grid.classList.remove('nav-out');
      playGridIn();
    }, 120);
  }

  // ---- TV Time-style status strip (English TV library only) -----------------
  // stopped            -> red
  // up to date / finished / favourite + show has ended          -> purple
  // up to date / finished / favourite + show still in production -> green
  // "ended" vs "ongoing" comes from TMDB's show status and is re-checked weekly for ongoing shows.
  const SHOW_STATUS_TTL = 7 * 24 * 3600 * 1000;
  const STATUS_BAR_CATS = ['up_to_date', 'finished', 'favourite'];
  let statusBackfillTimer = null, statusBackfillRunning = false;

  function setShowStatus(item, d){
    if(!d || !d.status) return false;
    const ended = (d.status === 'Ended' || d.status === 'Canceled');
    const running = (d.status === 'Returning Series' || d.status === 'In Production' || d.status === 'Planned' || d.status === 'Pilot');
    item.showStatus = ended ? 'ended' : running ? 'ongoing' : (d.in_production ? 'ongoing' : 'ended');
    item.showStatusAt = Date.now();
    const ne = d.next_episode_to_air;
    item.nextEp = (ne && ne.air_date) ? {date: ne.air_date, s: ne.season_number, e: ne.episode_number, name: ne.name || ''} : null;
    item.nextEpAt = Date.now();
    epMigrate(item, d);
    return true;
  }
  function statusBarColor(item){
    if(activeLibrary !== 'english' || item.type !== 'tv') return null;
    if(item.category === 'stopped') return 'red';
    if(STATUS_BAR_CATS.includes(item.category)){
      if(item.showStatus === 'ended') return 'purple';
      if(item.showStatus === 'ongoing') return 'green';
    }
    return null;
  }
  function needsShowStatus(item){
    if(item.type !== 'tv' || !item.tmdbId || item.category === 'stopped') return false;
    if(!item.showStatus || item.epw === undefined) return true;
    return item.showStatus === 'ongoing' && (Date.now() - (item.nextEpAt || 0)) > 24 * 3600 * 1000;
  }
  function applyStatusBar(card, item){
    const old = card.querySelector('.tv-status-bar');
    if(old) old.remove();
    const color = statusBarColor(item);
    const art = card.querySelector('.poster-art');
    if(color && art){
      const bar = document.createElement('div');
      bar.className = 'tv-status-bar ' + color;
      art.appendChild(bar);
    }
  }
  function scheduleStatusBackfill(){
    clearTimeout(statusBackfillTimer);
    statusBackfillTimer = setTimeout(runStatusBackfill, 500);
  }
  async function runStatusBackfill(){
    if(statusBackfillRunning) return;
    const lib = activeLibrary;
    const queue = state.items.filter(needsShowStatus);
    if(!queue.length) return;
    statusBackfillRunning = true;
    let idx = 0, changed = false;
    async function worker(){
      while(idx < queue.length){
        const item = queue[idx++];
        const d = await tmdbTvDetails(item.tmdbId, lib);
        if(setShowStatus(item, d)){
          changed = true;
          const card = document.querySelector('.poster-card[data-id="' + item.id + '"]');
          if(card) applyStatusBar(card, item);
        }
      }
    }
    await Promise.all(Array.from({length: 6}, worker));
    statusBackfillRunning = false;
    if(changed && activeLibrary === lib){ persist(); if(document.body.dataset.screen === 'upcoming') renderUpcoming(); }
  }

  function buildCard(item){
    const card = document.createElement('div');
    card.className = 'poster-card';
    card.setAttribute('data-id', item.id);

    let imgInner;
    if(item.posterPath === undefined){
      imgInner = `<div class="skeleton"></div>`;
    }else if(item.posterPath){
      imgInner = `<img src="${IMG_BASE}${item.posterPath}" alt="" loading="lazy" draggable="false">`;
    }else{
      imgInner = `<div class="fallback">${escapeHtml(item.title)}</div>`;
    }

    const itemCats = item.type === 'movie' ? state.categories.movie : state.categories.tv;
    const catOptions = itemCats.map(c =>
      `<option value="${c.key}" ${item.category === c.key ? 'selected' : ''}>${c.label}</option>`
    ).join('');

    const eligible = rankEligible(item);
    const rank = eligible ? (item.rank || null) : null;

    // Heart always shows for any favourite, regardless of whether it also
    // has a rank medal — the two are independent marks now.
    const heartMark = item.category === 'favourite' ? '<div class="fav-mark">&#9829;</div>' : '';
    const medalMark = rank
      ? `<div class="rank-medal-wrap rank-medal-${tierForRank(rank)}" title="#${rank} favourite TV show">${buildMedalSVG(rank, tierForRank(rank))}</div>`
      : '';

    let rankSelectHtml = '';
    if(eligible){
      const rankOptions = ['<option value="">No badge</option>']
        .concat(Array.from({length:10}, (_,i) => i+1).map(n =>
          `<option value="${n}" ${rank === n ? 'selected' : ''}>#${n}</option>`
        )).join('');
      rankSelectHtml = `<select class="rank-select" title="Assign rank badge" aria-label="Assign rank badge to ${escapeHtml(item.title)}">${rankOptions}</select>`;
    }

    card.innerHTML = `
      <div class="poster-art">
        <div class="img-wrap">${imgInner}</div>
        <div class="poster-caption">
          <div class="t">${escapeHtml(item.title)}</div>
          <div class="y">${item.year}</div>
          <select class="cat-select" title="Move to…" aria-label="Move ${escapeHtml(item.title)} to another category">${catOptions}</select>
          ${rankSelectHtml}
        </div>
      </div>
      ${heartMark}
      ${medalMark}
      <button class="remove-btn" title="Remove" aria-label="Remove ${escapeHtml(item.title)}">&times;</button>
    `;
    applyStatusBar(card, item);
    if(needsShowStatus(item)) scheduleStatusBackfill();
    card.querySelector('.remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      removeItem(item.id);
    });
    const catSelect = card.querySelector('.cat-select');
    catSelect.addEventListener('click', (e) => e.stopPropagation());
    catSelect.addEventListener('change', (e) => {
      changeCategory(item.id, e.target.value);
    });
    const rankSelect = card.querySelector('.rank-select');
    if(rankSelect){
      rankSelect.addEventListener('click', (e) => e.stopPropagation());
      rankSelect.addEventListener('change', (e) => {
        const val = e.target.value ? parseInt(e.target.value, 10) : null;
        assignRank(item.id, val);
      });
    }
    card.addEventListener('click', () => {
      const now = Date.now();
      if(lastCardTap.id === item.id && (now - lastCardTap.time) < 400){
        lastCardTap = {id: null, time: 0};
        openDetail(item.id);
      }else{
        lastCardTap = {id: item.id, time: now};
      }
    });
    initCardDrag(card, item);
    return card;
  }

  // Items of one type+category, in on-screen order, honoring the archive search box.
  function itemsForCategory(type, category){
    const q = state.archiveQuery.trim().toLowerCase();
    let list = orderedBucket(type, category);
    if(q) list = list.filter(i => i.title.toLowerCase().includes(q));
    return list;
  }

  function renderGrid(){
    grid.innerHTML = '';

    if(state.activeFilter === 'all'){
      grid.classList.add('grouped');
      const cats = orderedFiltersForType(state.activeType).filter(c => c.key !== 'all');
      const frag = document.createDocumentFragment();
      let anyItems = false;

      cats.forEach(cat => {
        const items = itemsForCategory(state.activeType, cat.key);
        if(!items.length) return; // skip empty categories — no clutter
        anyItems = true;

        const section = document.createElement('div');
        section.className = 'cat-section';
        section.innerHTML = `<div class="cat-section-header">${escapeHtml(cat.label)} <span class="cat-section-count">${items.length}</span></div>`;

        const sectionGrid = document.createElement('div');
        sectionGrid.className = 'grid cat-section-grid';
        items.forEach(item => sectionGrid.appendChild(buildCard(item)));

        section.appendChild(sectionGrid);
        frag.appendChild(section);
      });

      grid.appendChild(frag);
      emptyState.style.display = anyItems ? 'none' : 'block';
    }else{
      grid.classList.remove('grouped');
      const items = visibleItems();
      emptyState.style.display = items.length ? 'none' : 'block';
      const frag = document.createDocumentFragment();
      items.forEach(item => frag.appendChild(buildCard(item)));
      grid.appendChild(frag);
    }
  }

  function labelForCat(type, key){
    const cats = state.categories[type] || [];
    const c = cats.find(c => c.key === key);
    return c ? c.label : key;
  }

  function changeCategory(id, newCat){
    const item = state.items.find(i => i.id === id);
    if(!item || item.category === newCat) return;
    pushUndo();
    item.category = newCat;
    if(item.type === 'tv' && ['finished', 'favourite', 'up_to_date'].includes(newCat) && epTickedCount(item) === 0) epMarkAllAired(item);
    if(newCat !== 'favourite' && item.rank){
      // A rank badge only means something inside Favourites — clear it once
      // a title leaves, so it doesn't reappear with a stale rank later.
      delete item.rank;
    }
    // Move it to the very front of storage order — this is what makes it show
    // up first (newest) in whatever category it just entered, every time, no
    // matter which category it's coming from or going to.
    state.items = [item, ...state.items.filter(i => i.id !== id)];
    // If this just landed in (or left) TV Favourites, re-settle the bucket so
    // ranked titles stay pinned above everything else — otherwise the line
    // above would shove a freshly-favourited show above #1.
    reorderFavouritesByRank();
    if(newCat === 'finished' || newCat === 'favourite' || newCat === 'up_to_date' || newCat === 'stopped'){
      // Force a clean re-fetch for Stats every time a title enters a tracked
      // category — wipes any previously cached runtime/episode data so there's
      // no chance of a stale or bad number lingering from before. The next time
      // Stats is opened, this title is treated as never having been fetched.
      delete item.runtimeMin;
      delete item.epCount;
      delete item.epRuntimeMin;
    }
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    showToast(`Moved "${item.title}" to ${labelForCat(item.type, newCat)}`);
    machineLog(`Moved "${item.title}" → ${labelForCat(item.type, newCat)}.`);
  }

  // ---------- Manual drag-to-reorder (moves an item to a new spot within whatever's currently visible) ----------
  // Reorders an item within its own category bucket — this is the ordering that both
  // the flat filtered view AND each header section in "All" actually display, so
  // dragging always means the same thing no matter which view you dragged it in.
  function moveItemWithinCategory(id, newIndex){
    const item = state.items.find(i => i.id === id);
    if(!item) return;

    const originalBucket = state.items.filter(i => i.type === item.type && i.category === item.category);
    const fromIdx = originalBucket.findIndex(i => i.id === id);
    if(fromIdx === -1) return;

    let bucket = originalBucket.slice();
    bucket.splice(fromIdx, 1);
    const clamped = Math.max(0, Math.min(newIndex, bucket.length));
    bucket.splice(clamped, 0, item);

    // If it ended up back in the exact same order it started in (picked up
    // and dropped in the same spot), skip entirely — no undo entry, no save,
    // nothing happens. Otherwise every such drag would silently waste an
    // Undo click on a change that never actually occurred.
    const unchanged = bucket.length === originalBucket.length &&
      bucket.every((it, idx) => it.id === originalBucket[idx].id);
    if(unchanged) return;

    pushUndo();

    const idsInBucket = new Set(bucket.map(i => i.id));
    const firstIdx = state.items.findIndex(i => idsInBucket.has(i.id));
    const rest = state.items.filter(i => !idsInBucket.has(i.id));
    const insertPos = Math.min(firstIdx, rest.length);
    rest.splice(insertPos, 0, ...bucket);
    state.items = rest;

    persist();
    machineLog(`Reordered "${item.title}" within ${labelForCat(item.type, item.category)}.`);
  }

  // ---------- Drag-and-drop reordering (press and slide a poster, like moving desktop icons) ----------
  // Mouse: drag starts as soon as you move past a few px.
  // Touch: press and hold briefly first (so normal scrolling still works), then drag.
  function initCardDrag(card, item){
    card.addEventListener('pointerdown', (e) => {
      if(e.button !== undefined && e.button !== 0) return; // left mouse button only
      if(e.target.closest('.cat-select') || e.target.closest('.remove-btn')) return;

      const pointerId = e.pointerId;
      const isTouch = e.pointerType === 'touch';
      const startX = e.clientX, startY = e.clientY;
      let holdTimer = null;
      let armed = false;
      let cancelled = false;
      let ctx = null;
      let lastEv = e;
      let autoScrollRAF = null;

      function beginDrag(ev){
        if(cancelled) return;
        armed = true;
        const container = card.parentNode; // the section's own grid when grouped, or the flat grid otherwise
        const rect = card.getBoundingClientRect();
        const placeholder = document.createElement('div');
        placeholder.className = 'poster-card drag-placeholder';
        container.insertBefore(placeholder, card);

        ctx = {
          container,
          placeholder,
          offsetX: ev.clientX - rect.left,
          offsetY: ev.clientY - rect.top
        };

        card.classList.add('dragging');
        card.style.position = 'fixed';
        card.style.width = rect.width + 'px';
        card.style.height = rect.height + 'px';
        card.style.left = rect.left + 'px';
        card.style.top = rect.top + 'px';
        card.style.pointerEvents = 'none';
        document.body.appendChild(card);

        try{ card.setPointerCapture(pointerId); }catch(err){}
        updateDragPosition(ev);
        autoScrollRAF = requestAnimationFrame(autoScrollTick);
      }

      // Scrolls the page while the dragged poster is held near the top or bottom
      // edge of the screen — speed ramps up the closer you are to the edge.
      function autoScrollTick(){
        if(!ctx){ autoScrollRAF = null; return; }
        const EDGE = 100, MAX_SPEED = 22;
        const vh = window.innerHeight;
        let dy = 0;
        if(lastEv.clientY < EDGE){
          dy = -MAX_SPEED * (1 - lastEv.clientY / EDGE);
        }else if(lastEv.clientY > vh - EDGE){
          dy = MAX_SPEED * (1 - (vh - lastEv.clientY) / EDGE);
        }
        if(dy !== 0){
          window.scrollBy(0, dy);
          updateDragPosition(lastEv); // re-evaluate drop slot as new rows scroll under the cursor
        }
        autoScrollRAF = requestAnimationFrame(autoScrollTick);
      }

      function updateDragPosition(ev){
        card.style.left = (ev.clientX - ctx.offsetX) + 'px';
        card.style.top = (ev.clientY - ctx.offsetY) + 'px';

        const siblings = Array.from(ctx.container.children).filter(el => el !== ctx.placeholder);
        let closest = null, closestDist = Infinity, before = true;
        for(const sib of siblings){
          const r = sib.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const dist = Math.hypot(ev.clientX - cx, ev.clientY - cy);
          if(dist < closestDist){
            closestDist = dist;
            closest = sib;
            before = ev.clientY < cy || (Math.abs(ev.clientY - cy) < r.height / 3 && ev.clientX < cx);
          }
        }
        if(closest){
          ctx.container.insertBefore(ctx.placeholder, before ? closest : closest.nextSibling);
        }
      }

      function stopAutoScroll(){
        if(autoScrollRAF){
          cancelAnimationFrame(autoScrollRAF);
          autoScrollRAF = null;
        }
      }

      function endDrag(){
        stopAutoScroll();
        const children = Array.from(ctx.container.children);
        const finalIndex = children.indexOf(ctx.placeholder);
        ctx.container.insertBefore(card, ctx.placeholder);
        ctx.placeholder.remove();
        card.classList.remove('dragging');
        card.style.position = '';
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        card.style.height = '';
        card.style.pointerEvents = '';
        ctx = null;
        moveItemWithinCategory(item.id, finalIndex);
        renderGrid();
      }

      function cancelDrag(){
        stopAutoScroll();
        if(!ctx) return;
        ctx.container.insertBefore(card, ctx.placeholder);
        ctx.placeholder.remove();
        card.classList.remove('dragging');
        card.style.position = '';
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        card.style.height = '';
        card.style.pointerEvents = '';
        ctx = null;
      }

      function onMove(ev){
        if(ev.pointerId !== pointerId) return;
        lastEv = ev;
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(!armed){
          if(!isTouch && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
            beginDrag(ev);
          }else if(isTouch && (Math.abs(dx) > 10 || Math.abs(dy) > 10)){
            cancelled = true;
            clearTimeout(holdTimer);
          }
          return;
        }
        ev.preventDefault();
        updateDragPosition(ev);
      }

      function onUp(ev){
        if(ev.pointerId !== pointerId) return;
        clearTimeout(holdTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancelEvt);
        if(armed) endDrag();
      }

      function onCancelEvt(ev){
        if(ev.pointerId !== pointerId) return;
        clearTimeout(holdTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancelEvt);
        if(armed) cancelDrag();
      }

      if(isTouch){
        holdTimer = setTimeout(() => { if(!cancelled) beginDrag(e); }, 220);
      }
      document.addEventListener('pointermove', onMove, {passive: false});
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancelEvt);
    });
  }

  function removeItem(id){
    const index = state.items.findIndex(i => i.id === id);
    if(index === -1) return;
    const item = state.items[index];
    pushUndo();
    state.items.splice(index, 1);
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    showToast(`Removed "${item.title}" — tap Undo to bring it back`);
    machineLog(`Removed "${item.title}" from the archive.`);
  }

  function addItem({title, year, type, tmdbId, posterPath, category}){
    const exists = state.items.find(i =>
      i.type === type &&
      i.title.toLowerCase() === title.toLowerCase() &&
      i.year === year
    );
    if(exists){
      showToast(`Already in your archive`);
      return;
    }
    if(!category){
      category = type === 'movie' ? 'unwatched' : 'havent_started';
    }
    pushUndo();
    const item = {
      id: uid(), title, year, type, category,
      posterPath: posterPath !== undefined ? posterPath : null,
      tmdbId: tmdbId || null
    };
    state.items.unshift(item);
    persist();
    state.activeType = type;
    document.querySelectorAll('.type-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
    state.activeFilter = 'all';
    renderFilters();
    renderGrid();
    renderStats();
    showToast(`Added "${title}" (${year})`);
    machineLog(`Added "${title}" (${year}) to the archive.`);
  }

  // ---------- Search UI ----------
  let searchDebounce = null;

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();

    if(!q){
      searchResults.classList.remove('open');
      searchResults.innerHTML = '';
      return;
    }
    searchDebounce = setTimeout(async () => {
      const results = await tmdbSearchMulti(q);

      e.preventDefault();
      searchKbdIndex = Math.min(searchKbdIndex + 1, rows.length - 1);
      updateKbdActive(rows);
    }else if(e.key === 'ArrowUp'){
      e.preventDefault();
      searchKbdIndex = Math.max(searchKbdIndex - 1, 0);
      updateKbdActive(rows);
    }else if(e.key === 'Enter'){
      if(searchKbdIndex >= 0 && currentResults[searchKbdIndex]){

  function addFromSearchResult(r){

  // ---------- Surprise Me (movies only, no repeats until the pile runs out) ----------
  let surprisePool = [];
  let surpriseCurrent = null;
  const surpriseModal = document.getElementById('surpriseModal');
  const surprisePoster = document.getElementById('surprisePoster');
  const surpriseTitle = document.getElementById('surpriseTitle');
  const surpriseYear = document.getElementById('surpriseYear');
  const surpriseProgress = document.getElementById('surpriseProgress');

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Fetches which franchise/collection (if any) each movie belongs to, so
  // Surprise Me can avoid suggesting Maze Runner 1, 2, and 3 back to back.
  // Cached on the item after the first check — only runs once per movie ever.
  async function ensureCollectionData(movies){
    const queue = movies.filter(i => i.collectionChecked === undefined && i.tmdbId);
    if(!queue.length) return;
    const CONC = 6;
    let idx = 0;
    const fetchingFor = activeLibrary;
    async function worker(){
      while(idx < queue.length){
        const item = queue[idx++];
        const d = await tmdbMovieDetails(item.tmdbId, fetchingFor);
        // only mark as checked on a real response — if the request failed,
        // leave it unset so it's retried next time instead of permanently
        // assuming "not part of any franchise"
        if(d){
          item.collectionId = d.belongs_to_collection ? d.belongs_to_collection.id : null;
          item.collectionChecked = true;
        }
      }
    }
    const workers = [];
    for(let i = 0; i < CONC; i++) workers.push(worker());
    await Promise.all(workers);
    if(activeLibrary === fetchingFor) persist();
  }

  function unwatchedMoviePool(){
    const unwatched = state.items.filter(i => i.type === 'movie' && i.category === 'unwatched');
    // keep only the earliest movie per franchise/collection; standalone movies (no collection) all stay
    const sortedByYear = unwatched.slice().sort((a, b) => a.year - b.year);
    const seenCollections = new Set();
    const deduped = [];
    for(const m of sortedByYear){
      if(m.collectionId){
        if(seenCollections.has(m.collectionId)) continue;
        seenCollections.add(m.collectionId);
      }
      deduped.push(m);
    }
    return shuffle(deduped);
  }

  async function showSurprise(){
    // first-ever run needs to check each unwatched movie's franchise once — show a light loading state for that
    const unwatchedNow = state.items.filter(i => i.type === 'movie' && i.category === 'unwatched');
    const stillUnchecked = unwatchedNow.some(i => i.collectionChecked === undefined && i.tmdbId);
    if(stillUnchecked && !surprisePool.length){
      surprisePoster.innerHTML = '';
      surpriseTitle.textContent = 'Sorting out your franchises…';
      surpriseYear.textContent = '';
      surpriseProgress.textContent = 'One-time setup — this only happens once';
      surpriseModal.style.display = 'flex';
      await ensureCollectionData(unwatchedNow);
    }

    let item = null;
    // pop until we find one that's still actually unwatched (in case it changed elsewhere)
    while(surprisePool.length && !item){
      const candidate = surprisePool.pop();
      const fresh = state.items.find(i => i.id === candidate.id);
      if(fresh && fresh.category === 'unwatched') item = fresh;
    }
    if(!item){
      surprisePool = unwatchedMoviePool();
      while(surprisePool.length && !item){
        const candidate = surprisePool.pop();
        if(candidate.category === 'unwatched') item = candidate;
      }
    }
    if(!item){
      showToast('No unwatched movies left in your archive!');
      surpriseModal.style.display = 'none';
      return;
    }
    surpriseCurrent = item;
    if(item.posterPath){
      surprisePoster.innerHTML = `<img src="${IMG_BASE}${item.posterPath}" alt="">`;
    }else{
      surprisePoster.innerHTML = `<div class="fallback">${escapeHtml(item.title)}</div>`;
    }
    surpriseTitle.textContent = item.title;
    surpriseYear.textContent = item.year;
    surpriseProgress.textContent = surprisePool.length > 0
      ? `${surprisePool.length} more unwatched after this`
      : `Last one in your unwatched pile`;
    surpriseModal.style.display = 'flex';
  }

  document.getElementById('surpriseBtn').addEventListener('click', showSurprise);
  document.getElementById('surpriseAgainBtn').addEventListener('click', showSurprise);
