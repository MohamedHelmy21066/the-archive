<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Archive">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141c;
    --bg-raise:#181b26;
    --card:#1d2130;
    --card-hover:#242938;
    --gold:#d4a73d;
    --gold-dim:#8a712f;
    --brick:#c2452d;
    --ink:#ede7da;
    --ink-dim:#9296a6;
    --ink-faint:#5c6070;
    --line:#2a2f42;
    --radius:6px;
    --shadow: 0 12px 28px -12px rgba(0,0,0,0.65);
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Source Sans 3', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* keep the scrollbar space reserved so the page never shifts sideways between short and long categories */
  html{ scrollbar-gutter:stable; }
  @supports not (scrollbar-gutter:stable){ html{ overflow-y:scroll; } }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--gold); color:#12141c;}

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  /* ========================================================
     THE MACHINE — admin gate, floating access point, panel
     ======================================================== */
  :root{
    --m-bg: #040806;
    --m-panel: #060f0a;
    --m-green: #6fffb0;
    --m-green-bright: #b8ffd9;
    --m-green-dim: #275a3f;
    --m-amber: #e8c15a;
    --m-line: #16362578;
    --m-font: 'IBM Plex Mono', monospace;
  }

  /* ===== SAMARITAN GATE ===== */
  .machine-gate{
    position:fixed; inset:0; z-index:9000; overflow:hidden;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.045) 0px, rgba(0,0,0,0.045) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% 45%, #f4f6f4 0%, #e4e7e4 45%, #c9cdca 100%);
    color:#0a0a0a; font-family:'Montserrat','Questrial','Helvetica Neue',Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; transition:opacity .6s ease; cursor:text;
  }
  .machine-gate.dismissed{ opacity:0; pointer-events:none; }
  .sam-icon{ position:absolute; top:22px; width:22px; height:22px; color:#8a8d8b; }
  .sam-icon.left{ left:24px; } .sam-icon.right{ right:24px; }
  .machine-gate-skip{
    position:absolute; top:16px; right:18px; z-index:2;
    background:none; border:none; color:#8a8d8b; cursor:pointer;
    font-size:26px; line-height:1; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; transition:color .2s;
  }
  .machine-gate-skip:hover{ color:#0a0a0a; }
  .sam-stage{ display:flex; flex-direction:column; align-items:center; gap:22px; }
  .machine-banner{
    display:inline-block; box-sizing:border-box; width:150px; text-align:center;
    transition:width .15s ease, color .18s ease, border-color .18s ease;
    font-weight:500; font-size:clamp(20px,2.7vw,34px); letter-spacing:.15em; text-indent:.15em;
    white-space:nowrap; max-width:94vw;
    padding:0 6px 8px; border-bottom:3px solid #0a0a0a;
    text-shadow:0 0 1px rgba(0,0,0,.4);
    box-shadow:0 18px 26px -18px rgba(0,0,0,.28);
    min-height:1.3em; line-height:1.3;
  }
  .machine-banner.out{ color:transparent; text-shadow:none; }
  .machine-banner.hide{ visibility:hidden; }
  .machine-banner .g{ opacity:.4; }
  .machine-banner.denied{ color:#d90f0f; border-color:#d90f0f; }
  .sam-stage{ position:relative; }
  .sam-slot{ position:relative; width:30px; height:26px; }
  .sam-tri{
    position:absolute; left:2px; top:0; width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent; border-bottom:25px solid #e10d0d;
  }
  .sam-tri.blink{ animation:sam-blink .8s ease-in-out infinite; }
  @keyframes sam-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.28; } }
  .machine-gate.alert .sam-tri{ animation:sam-alert .3s steps(1) infinite; }
  @keyframes sam-alert{ 50%{ opacity:.15; } }
  .sam-dots{ position:absolute; left:50%; top:5px; transform:translateX(-50%); display:flex; gap:7px; opacity:0; }
  .sam-dots i{ width:4px; height:4px; border-radius:50%; background:#222; animation:sam-dot 1s ease-in-out infinite; }
  .sam-dots i:nth-child(2){ animation-delay:.5s; }
  @keyframes sam-dot{ 0%,100%{ opacity:.2; } 50%{ opacity:1; } }
  .sam-marq{
    position:absolute; left:50%; top:0; width:100vw; transform:translateX(-50%); display:none; overflow:hidden;
    border-bottom:3px solid #0a0a0a; padding:0 0 8px; line-height:1.3;
    font-weight:500; font-size:clamp(20px,2.7vw,34px); letter-spacing:.15em; white-space:nowrap;
    box-shadow:0 18px 26px -18px rgba(0,0,0,.28);
  }
  .sam-marq.on{ display:block; }
  .sam-marq span{ display:inline-block; animation:sam-scroll 14s linear infinite; }
  @keyframes sam-scroll{ to{ transform:translateX(-50%); } }
  .machine-gate-inner{
    position:absolute; left:50%; bottom:28px; transform:translateX(-50%);
    width:min(92vw,420px); height:34px; box-sizing:border-box;
    display:flex; align-items:center; gap:10px; padding:0 10px;
    border:1.5px solid #6c6f6d; border-radius:6px; background:rgba(238,240,238,.7);
  }
  .machine-gate-inner svg{ width:16px; height:16px; flex:none; color:#555; }
  .machine-gate-inner svg.dim{ color:#a43a3a; }
  .machine-password-input{
    flex:1; min-width:0; background:transparent; border:none; outline:none; text-align:center;
    font-family:inherit; font-weight:600; font-size:13px; letter-spacing:.14em; color:#0a0a0a; text-transform:uppercase;
  }
  .machine-password-input::placeholder{ color:#a9acaa; }
  .machine-gate-inner.shake{ animation:sam-shake .4s; }
  @keyframes sam-shake{ 20%,60%{ transform:translateX(calc(-50% - 7px)); } 40%,80%{ transform:translateX(calc(-50% + 7px)); } }
  .machine-status{ display:none; }
  .machine-ascii,.machine-boot-lines{ display:none; }

  .machine-fab{
    position:fixed; right:20px; bottom:20px; z-index:850;
    width:52px; height:52px; border-radius:50%;
    background:var(--m-panel); border:1px solid var(--m-green-dim);
    color:var(--m-green); font-family:var(--m-font); font-size:20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 0 0 0 rgba(111,255,176,0.35);
    animation:m-pulse 3.2s ease-in-out infinite;
  }
  .machine-fab:hover{ border-color:var(--m-green); }
  @keyframes m-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(111,255,176,0.25); }
    50%{ box-shadow:0 0 0 8px rgba(111,255,176,0); }
  }
  .machine-fab .dot{
    width:9px; height:9px; border-radius:50%; background:var(--m-green);
  }

  .machine-panel{
    position:fixed; right:16px; bottom:84px; z-index:900;
    width:min(380px, calc(100vw - 32px)); height:min(560px, calc(100vh - 120px));
    background:var(--m-panel); border:1px solid var(--m-green-dim);
    color:var(--m-green); font-family:var(--m-font);
    display:flex; flex-direction:column;
    transform:translateY(12px) scale(0.98); opacity:0; pointer-events:none;
    transition:transform .2s ease, opacity .2s ease;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
  }
  .machine-panel.open{ transform:none; opacity:1; pointer-events:auto; }
  .machine-panel-header{
    display:flex; align-items:center; gap:10px;
    padding:12px 12px 10px; border-bottom:1px solid var(--m-green-dim);
  }
  .machine-panel-title{ font-size:12px; letter-spacing:2px; color:var(--m-green-bright); flex:1; }
  .machine-panel-clear{
    background:none; border:1px solid var(--m-green-dim); color:var(--m-green-dim);
    font-family:var(--m-font); font-size:10px; letter-spacing:1px;
    padding:4px 8px; cursor:pointer;
  }
  .machine-panel-clear:hover{ color:var(--m-green); border-color:var(--m-green); }
  .machine-panel-close{
    background:none; border:none; color:var(--m-green-dim); font-size:18px;
    cursor:pointer; line-height:1; padding:2px 4px;
  }
  .machine-panel-close:hover{ color:var(--m-green); }
  .machine-panel-body{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .machine-view{ display:none; flex:1; min-height:0; flex-direction:column; }
  .machine-view.active{ display:flex; }

  .machine-feed-log{
    flex:1; overflow-y:auto; padding:10px 12px; font-size:11.5px; line-height:1.7;
    color:var(--m-green-dim);
  }
  .machine-feed-log .row{ opacity:0; animation:m-fadein .4s ease forwards; }
  .machine-feed-log .row .ts{ color:var(--m-green-dim); }
  .machine-feed-log .row .tx{ color:var(--m-green); }
  @keyframes m-fadein{ from{opacity:0; transform:translateY(-2px);} to{opacity:1; transform:none;} }
  .machine-feed-empty{ color:var(--m-green-dim); padding:14px 4px; font-size:12px; }

  @media (max-width:520px){
    .machine-panel{ right:10px; left:10px; width:auto; bottom:78px; height:min(70vh, 520px); }
    .machine-fab{ right:14px; bottom:14px; }
  }

  /* ---------- Sprocket strip (signature element) ---------- */
  .sprockets{
    height:14px;
    background-image: radial-gradient(circle, var(--bg) 3.5px, transparent 3.6px);
    background-size: 22px 14px;
    background-position: 8px center;
    background-color: var(--gold-dim);
    opacity:0.55;
  }

  /* ---------- Header / marquee ---------- */
  header.marquee{
    background: linear-gradient(180deg, var(--bg-raise), var(--bg));
    padding: 30px 28px 22px;
    border-bottom: 1px solid var(--line);
  }
  .marquee-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .marquee-title{
    font-family:var(--font-display);
    font-size:clamp(36px, 5vw, 56px);
    letter-spacing:0.03em;
    line-height:0.9;
    color:var(--ink);
    margin:0;
  }
  #archiveTitlePart2{ color:var(--gold); }
  .marquee-sub{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:6px;
  }
  .library-tabs{
    display:inline-flex;
    margin-top:14px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
    background:var(--bg);
  }
  .library-tab{
    border:0;
    border-radius:999px;
    padding:6px 13px;
    background:transparent;
    color:var(--ink-dim);
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .library-tab.active{ background:var(--brick); color:#fff7ec; }
  .edit-branding-btn{
    display:block; margin-top:10px; background:transparent; border:none;
    color:var(--ink-faint); font-family:var(--font-mono); font-size:10px;
    letter-spacing:0.04em; cursor:pointer; padding:2px 0;
  }
  .edit-branding-btn:hover{ color:var(--gold-dim); }
  .branding-modal-card{ max-width:420px; text-align:left; }
  .branding-field{ margin-bottom:14px; }
  .branding-field label{
    display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--gold-dim); margin-bottom:6px;
  }
  .branding-field input{
    width:100%; background:var(--card); border:1px solid var(--line); border-radius:4px;
    color:var(--ink); font-family:var(--font-body); font-size:13px; padding:8px 10px;
    box-sizing:border-box;
  }
  .branding-field input:focus{ outline:none; border-color:var(--gold-dim); }
  .branding-section-title{
    font-family:var(--font-display); font-size:16px; color:var(--gold);
    margin:18px 0 10px;
  }
  .branding-section-title:first-child{ margin-top:0; }
  .branding-save-btn{
    width:100%; margin-top:6px; background:var(--gold); color:var(--bg); border:none;
    border-radius:4px; padding:10px; font-family:var(--font-mono); font-size:12px;
    letter-spacing:0.05em; text-transform:uppercase; font-weight:600; cursor:pointer;
  }
  .branding-save-btn:hover{ opacity:0.9; }
  .stat-strip{
    display:flex;
    gap:22px;
    font-family:var(--font-mono);
  }
  .stat{
    text-align:right;
  }
  .stat-num{
    font-size:22px;
    color:var(--gold);
    line-height:1;
  }
  .stat-label{
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:4px;
  }

  /* ---------- Controls ---------- */
  .controls{
    max-width:1180px;
    margin:24px auto 0;
    padding:0 28px;
  }

  .type-tabs{
    display:inline-flex;
    background:var(--bg-raise);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
    margin-bottom:16px;
  }
  .type-tab{
    border:none;
    background:transparent;
    color:var(--ink-dim);
    font-family:var(--font-display);
    letter-spacing:0.04em;
    font-size:16px;
    padding:8px 22px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .type-tab.active{
    background:var(--gold);
    color:#181205;
  }

  /* ticket-window search */
  .ticket-window{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg-raise);
    border:1px dashed var(--gold-dim);
    border-radius:var(--radius);
    padding:12px 16px;
    margin-bottom:16px;
  }
  .ticket-window::before{
    content:"BOX OFFICE";
    position:absolute;
    top:-9px;
    left:14px;
    background:var(--bg);
    padding:0 8px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.14em;
    color:var(--gold-dim);
  }
  .ticket-window input{
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    padding:6px 4px;
  }
  .ticket-window input::placeholder{ color:var(--ink-faint); }
  .ticket-window input:focus{ outline:none; }
  .archive-search{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; margin-bottom:10px;
  }
  .archive-search .icon{ color:var(--gold-dim); font-size:14px; }
  .archive-search input{
    flex:1; background:transparent; border:none; color:var(--ink);
    font-family:var(--font-body); font-size:14px;
  }
  .archive-search input::placeholder{ color:var(--ink-faint); }
  .archive-search input:focus{ outline:none; }
  .archive-search .clear-btn{
    display:none; background:transparent; border:none; color:var(--ink-faint);
    font-size:16px; cursor:pointer; line-height:1; padding:0 2px;
  }
  .archive-search.has-text .clear-btn{ display:block; }

  .search-results{
    position:relative;
    margin:-10px 0 16px;
    background:var(--bg-raise);
    border:1px solid var(--line);
    border-radius:var(--radius);
    max-height:340px;
    overflow-y:auto;
    display:none;
  }
  .search-results.open{ display:block; }
  .search-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 14px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .search-row:last-child{ border-bottom:none; }
  .search-row:hover, .search-row.kbd-active{ background:var(--card-hover); }
  .search-row img{
    width:32px; height:48px; object-fit:cover; border-radius:3px; background:var(--card);
    flex-shrink:0;
  }
  .search-row .meta{ flex:1; min-width:0; }
  .search-row .meta .t{ font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .search-row .meta .y{ font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); }
  .search-row .add-badge{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em;
    color:var(--gold); border:1px solid var(--gold-dim); border-radius:4px; padding:3px 8px;
    flex-shrink:0;
  }
  .search-empty{ padding:16px; color:var(--ink-faint); font-size:13px; text-align:center; }

  .cat-chooser{ padding:10px 14px; }
  .cat-chooser-label{ font-size:12px; color:var(--ink-dim); margin-bottom:8px; }
  .cat-chooser-opts{ display:flex; flex-wrap:wrap; gap:6px; }
  .cat-chip{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--gold); background:transparent; border:1px solid var(--gold-dim); border-radius:999px;
    padding:6px 11px; cursor:pointer; transition:all 0.15s ease;
  }
  .cat-chip:hover{ background:var(--gold); color:var(--bg); border-color:var(--gold); }

  .filter-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .filter-pill{
    border:1px solid var(--line);
    background:var(--bg-raise);
    color:var(--ink-dim);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition: all 0.15s ease;
    white-space:nowrap;
  }
  .filter-pill:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .filter-pill.active{ background:var(--brick); border-color:var(--brick); color:#fff; }
  .filter-pill .count{ opacity:0.65; margin-left:4px; }
  .filter-pill{ touch-action:pan-y; user-select:none; }
  .filter-pill.pill-dragging{
    z-index:500; box-shadow:0 12px 26px rgba(0,0,0,0.45); cursor:grabbing;
    transition:none !important;
  }
  .pill-placeholder{
    background:transparent; border:2px dashed var(--gold-dim); box-shadow:none;
  }

  /* ---------- Grid ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:20px 28px 80px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap:16px 14px;
  }
  .grid.grouped{ display:block; }
  .cat-section{ margin-bottom:32px; }
  .cat-section-header{
    font-family:var(--font-display); font-size:20px; letter-spacing:0.02em; color:var(--gold);
    padding-bottom:9px; margin-bottom:14px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:8px;
  }
  .cat-section-count{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); font-weight:400;
  }
  .cat-section-grid{ margin-bottom:0; }
  .poster-card{
    position:relative;
    border-radius:var(--radius);
    aspect-ratio:2/3;
    cursor:pointer;
    transition: transform 0.18s ease;
  }
  .poster-card:hover{ transform:translateY(-3px); }
  /* smooth transitions when moving between tabs / categories */
  #grid{ transition:opacity .12s ease, transform .12s ease, filter .12s ease; }
  #grid.nav-out{ opacity:0; transform:translateY(8px); filter:blur(3px); }
  #grid.nav-in .poster-card{ animation:nav-card .45s cubic-bezier(.2,.7,.2,1) both; animation-delay:var(--d,0ms); }
  #grid.nav-in .cat-section-header{ animation:nav-fade .4s ease both; }
  @keyframes nav-card{ from{ opacity:0; transform:translateY(16px) scale(.97); } to{ opacity:1; transform:none; } }
  @keyframes nav-fade{ from{ opacity:0; transform:translateX(-8px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    #grid, #grid.nav-out{ transition:none; transform:none; filter:none; }
    #grid.nav-in .poster-card, #grid.nav-in .cat-section-header{ animation:none; }
  }
  /* TV Time-style status strip under the poster (English TV only):
     purple = finished & show ended, green = finished & still running, red = stopped */
  .tv-status-bar{ position:absolute; left:0; right:0; bottom:0; height:8px; z-index:6; pointer-events:none; }
  .tv-status-bar.purple{ background:#8a2be2; }
  .tv-status-bar.green{ background:#6cc22a; }
  .tv-status-bar.red{ background:#e0392b; }
  .poster-card.dragging{
    z-index:500; box-shadow:0 20px 40px rgba(0,0,0,0.5);
    transform:scale(1.06) rotate(-1.5deg); transition:none; cursor:grabbing;
  }
  .drag-placeholder{
    background:transparent; border:2px dashed var(--gold-dim); box-shadow:none;
  }
  /* Everything that needs rounded-corner clipping (art, caption gradient)
     lives in here — poster-card itself stays overflow:visible so the rank
     medal can hang off the corner instead of being cut off at the edge. */
  .poster-art{
    position:absolute; inset:0;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
  }
  .poster-card img{
    width:100%; height:100%; object-fit:cover; display:block;
    background:var(--card);
    -webkit-user-drag:none; user-drag:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  .poster-card{ touch-action:pan-y; }
  .poster-card .fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:10px;
    font-family:var(--font-display);
    font-size:15px;
    letter-spacing:0.02em;
    color:var(--ink-dim);
    background:linear-gradient(160deg, var(--card), var(--bg-raise));
  }
  .poster-card .skeleton{
    position:absolute; inset:0;
    background: linear-gradient(100deg, var(--card) 30%, var(--card-hover) 50%, var(--card) 70%);
    background-size:200% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
  }
  .poster-caption{
    position:absolute; left:0; right:0; bottom:0;
    padding:20px 8px 8px;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.88));
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .poster-card:hover .poster-caption, .poster-card:focus-within .poster-caption{ opacity:1; }
  .poster-caption .t{ font-size:12px; color:var(--ink); line-height:1.25; }
  .poster-caption .y{ font-size:10px; color:var(--gold); font-family:var(--font-mono); margin-top:2px; }

  .cat-select{
    margin-top:6px;
    width:100%;
    background:var(--bg-raise);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:4px;
    font-family:var(--font-mono);
    font-size:10px;
    padding:3px 4px;
    cursor:pointer;
  }
  .cat-select:hover{ border-color:var(--gold-dim); }
  .cat-select:focus{ outline:none; border-color:var(--gold); }

  .rank-select{
    margin-top:5px;
    width:100%;
    background:var(--bg-raise);
    color:var(--ink);
    border:1px solid var(--gold-dim);
    border-radius:4px;
    font-family:var(--font-mono);
    font-size:10px;
    padding:3px 4px;
    cursor:pointer;
  }
  .rank-select:hover{ border-color:var(--gold); }
  .rank-select:focus{ outline:none; border-color:var(--gold); }

  .fav-mark{
    position:absolute; top:6px; left:6px;
    color:var(--brick);
    font-size:14px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.8));
  }

  /* Top-10 favourite TV rank medal (English library only). Explicitly
     assigned per-title via the rank-select control — sits pinned to the
     top-right corner, tilted, and genuinely overlapping the poster's edge
     now that .poster-card allows overflow. Heart mark stays put at
     top-left regardless of whether a medal is present. */
  .rank-medal-wrap{
    position:absolute; top:-8px; right:-9px;
    width:26px;
    transform: rotate(18deg);
    transform-origin: top right;
    filter: drop-shadow(0 1.5px 2px rgba(0,0,0,0.7));
    z-index:3;
    pointer-events:none;
  }
  .rank-medal-wrap svg{ display:block; width:100%; height:auto; overflow:visible; }
  .rank-medal-gold{ --f1:#fdf0b0; --f2:#e0ab3a; --f3:#a8791f; --detail:#7a5211; --ring1:#fff3c4; --ring2:#a8791f; }
  .rank-medal-silver{ --f1:#ffffff; --f2:#cdd2d8; --f3:#969ba3; --detail:#4c5158; --ring1:#ffffff; --ring2:#8b9096; }
  .rank-medal-bronze{ --f1:#f0c497; --f2:#c07f42; --f3:#8a5423; --detail:#552d10; --ring1:#f6d3ac; --ring2:#8a5423; }
  .rank-medal-purple{ --f1:#ddd0fa; --f2:#8b74d1; --f3:#5c4a9e; --detail:#2e2354; --ring1:#e9defe; --ring2:#5c4a9e; }

  .remove-btn{
    position:absolute; top:4px; right:4px;
    width:22px; height:22px;
    border-radius:50%;
    background:rgba(10,10,14,0.75);
    color:var(--ink);
    border:none;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    opacity:0;
    transition:opacity 0.15s ease, background 0.15s ease;
  }
  .poster-card:hover .remove-btn, .poster-card:focus-within .remove-btn{ opacity:1; }
  .remove-btn:hover{ background:var(--brick); }

  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-faint);
  }
  .empty-state .big{
    font-family:var(--font-display);
    font-size:28px;
    color:var(--ink-dim);
    letter-spacing:0.03em;
    margin-bottom:8px;
  }

  .toast{
    position:fixed;
    bottom:22px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--bg-raise);
    border:1px solid var(--gold-dim);
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.04em;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index:50;
    box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{
    text-align:center;
    padding:26px 20px 40px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }

  @media (max-width:520px){
    header.marquee{ padding:22px 16px 18px; }
    .marquee-inner{ flex-direction:column; align-items:flex-start; }
    .stat-strip{ gap:16px; }
    .controls{ padding:0 16px; }
    main{ padding:16px 16px 60px; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap:12px 10px; }
  }

  /* ---------- Utility bar (Surprise Me / Stats) ---------- */
  .util-bar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .util-btn{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; cursor:pointer; transition:all 0.15s ease; display:flex; align-items:center; gap:6px;
  }
  .util-btn:hover{ border-color:var(--gold-dim); background:var(--card-hover); }
  .util-btn:disabled{ opacity:0.35; cursor:default; }
  .util-btn:disabled:hover{ border-color:var(--line); background:var(--card); }
  .util-btn.has-actions{ border-color:var(--gold-dim); color:var(--gold); }

  /* ---------- Modal overlay (shared) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,11,16,0.78); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-card{
    background:var(--bg-raise); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); max-width:360px; width:100%; padding:24px 22px; position:relative;
    text-align:center;
  }
  .modal-close{
    position:absolute; top:10px; right:12px; background:transparent; border:none;
    color:var(--ink-faint); font-size:22px; cursor:pointer; line-height:1;
  }
  .modal-close:hover{ color:var(--ink); }

  /* ---------- Surprise Me ---------- */
  .surprise-poster{
    width:150px; height:225px; margin:6px auto 14px; border-radius:4px; overflow:hidden;
    background:var(--card); display:flex; align-items:center; justify-content:center;
  }
  .surprise-poster img{ width:100%; height:100%; object-fit:cover; }
  .surprise-poster .fallback{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); padding:10px; }
  .surprise-title{ font-family:var(--font-display); font-size:26px; letter-spacing:0.02em; color:var(--ink); line-height:1.1; }
  .surprise-year{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); margin-top:4px; }
  .surprise-progress{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:14px; text-transform:uppercase; letter-spacing:0.05em; }
  .surprise-actions{ display:flex; gap:10px; margin-top:16px; justify-content:center; flex-wrap:wrap; }
  .surprise-action{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    border-radius:999px; padding:9px 16px; cursor:pointer; border:1px solid var(--line);
    background:transparent; color:var(--ink-dim); transition:all 0.15s ease;
  }
  .surprise-action:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .surprise-action.primary{ background:var(--gold); border-color:var(--gold); color:var(--bg); font-weight:600; }
  .surprise-action.primary:hover{ background:var(--gold); opacity:0.9; }

  /* ---------- Stats ---------- */
  .stats-modal-card{ max-width:640px; }
  .stats-loading{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); padding:40px 0; }
  .stats-row{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .flip-card{ width:230px; height:180px; perspective:1000px; cursor:pointer; }
  .flip-card-inner{
    position:relative; width:100%; height:100%; transition:transform 0.5s;
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-card-inner{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:12px;
  }
  .flip-face .num{ font-family:var(--font-display); font-size:44px; color:var(--gold); line-height:1; }
  .flip-face .lbl{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-dim); }
  .flip-face .sub{ font-family:var(--font-mono); font-size:9px; color:var(--ink-faint); margin-top:6px; }
  .flip-back{ transform:rotateY(180deg); }
  .stats-hint{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:16px; }

  /* ---------- Detail modal ---------- */
  .detail-modal-card{ max-width:640px; text-align:left; padding:0; overflow:hidden; max-height:88vh; overflow-y:auto; }
  .detail-modal-card .modal-close{ z-index:5; background:rgba(10,11,16,0.5); border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
  .detail-hero{ display:flex; gap:18px; padding:22px; background:var(--bg-raise); }
  .detail-poster{ position:relative; width:130px; min-width:130px; aspect-ratio:2/3; border-radius:4px; overflow:hidden; background:var(--card); }
  .detail-poster img{ width:100%; height:100%; object-fit:cover; display:block; }
  .detail-poster .fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); text-align:center; padding:8px; }
  .detail-poster-edit{
    position:absolute; bottom:5px; right:5px;
    width:24px; height:24px;
    border-radius:50%;
    background:rgba(10,11,16,0.75);
    border:1px solid var(--gold-dim);
    color:var(--ink);
    font-size:12px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-poster-edit:hover{ background:var(--gold); color:#181205; border-color:var(--gold); }

  /* ---------- Poster picker (English archive only) ---------- */
  .poster-picker{ padding:22px; }
  .poster-picker-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .poster-picker-title{ font-family:var(--font-display); font-size:20px; color:var(--ink); letter-spacing:0.02em; }
  .poster-picker-cancel{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .poster-picker-cancel:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .poster-picker-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap:12px;
  }
  .poster-picker-item{
    position:relative;
    aspect-ratio:2/3;
    border-radius:4px;
    overflow:hidden;
    background:var(--card);
    cursor:pointer;
    border:2px solid transparent;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .poster-picker-item:hover{ transform:translateY(-2px); border-color:var(--gold-dim); }
  .poster-picker-item.current{ border-color:var(--gold); }
  .poster-picker-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .poster-picker-item .current-tag{
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(212,167,61,0.92); color:#181205;
    font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; text-transform:uppercase;
    text-align:center; padding:3px 0;
  }
  .poster-picker-empty, .poster-picker-loading{
    padding:40px 20px; text-align:center; color:var(--ink-faint); font-family:var(--font-mono); font-size:12px;
  }
  .detail-headline{ display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .detail-title{ font-family:var(--font-display); font-size:28px; color:var(--ink); line-height:1.05; }
  .detail-title-row{ display:flex; align-items:baseline; gap:8px; }
  .detail-title-edit{
    background:transparent; border:none; color:var(--ink-faint); font-size:14px;
    cursor:pointer; padding:2px 4px; flex-shrink:0;
  }
  .detail-title-edit:hover{ color:var(--gold-dim); }
  .detail-meta{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); letter-spacing:0.03em; }
  .detail-rating{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:12px; color:var(--gold); margin-top:2px; }
  .detail-genres{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .detail-genre-chip{
    font-family:var(--font-mono); font-size:9px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--ink-dim); border:1px solid var(--line); border-radius:999px; padding:3px 9px;
  }
  .detail-body{ padding:20px 22px 24px; }
  .detail-section-lbl{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:6px; }
  .detail-overview{ font-family:var(--font-body); font-size:14px; line-height:1.55; color:var(--ink); margin-bottom:18px; }
  .detail-cast-row{ display:flex; gap:14px; overflow-x:auto; padding-bottom:4px; }
  .detail-cast-item{ min-width:74px; text-align:center; }
  .detail-cast-photo{
    width:66px; height:66px; border-radius:50%; overflow:hidden; margin:0 auto 6px;
    background:var(--card); display:flex; align-items:center; justify-content:center;
  }
  .detail-cast-photo img{ width:100%; height:100%; object-fit:cover; }
  .detail-cast-photo .initial{ font-family:var(--font-display); font-size:20px; color:var(--ink-faint); }
  .detail-cast-name{ font-family:var(--font-mono); font-size:9px; color:var(--ink-dim); line-height:1.3; }
  .detail-cast-char{ font-family:var(--font-mono); font-size:8px; color:var(--ink-faint); }
  .detail-loading{ padding:60px 20px; text-align:center; font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); }
  .detail-status-row{ margin-top:16px; }
  .detail-status-row select{
    background:var(--bg-raise); color:var(--ink); border:1px solid var(--line); border-radius:4px;
    font-family:var(--font-mono); font-size:11px; padding:6px 8px; cursor:pointer;
  }
  .detail-seasons-btn{
    background:var(--bg-raise); color:var(--ink); border:1px solid var(--line); border-radius:4px;
    font-family:var(--font-mono); font-size:11px; padding:6px 10px; cursor:pointer; text-align:left;
  }
  .detail-seasons-btn:hover{ border-color:var(--gold-dim); }

  /* ---------- Season manager (choose which seasons count toward Stats) ---------- */
  .season-manager{ padding:22px; }
  .season-manager-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; gap:12px; }
  .season-manager-title{ font-family:var(--font-display); font-size:19px; color:var(--ink); letter-spacing:0.02em; }
  .season-manager-cancel{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    padding:6px 12px; border-radius:999px; cursor:pointer; flex-shrink:0;
  }
  .season-manager-cancel:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .season-manager-note{
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-bottom:14px; line-height:1.5;
  }
  .season-manager-actions{ display:flex; gap:8px; margin-bottom:14px; }
  .season-manager-actions button{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase;
    padding:6px 10px; border-radius:4px; cursor:pointer;
  }
  .season-manager-actions button:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .season-manager-list{ display:flex; flex-direction:column; gap:2px; max-height:340px; overflow-y:auto; }
  .season-row{
    display:flex; align-items:center; gap:10px; padding:9px 4px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .season-row:last-child{ border-bottom:none; }
  .season-row input{ flex-shrink:0; width:16px; height:16px; accent-color:var(--gold); cursor:pointer; }
  .season-name{ flex:1; font-family:var(--font-body); font-size:13.5px; color:var(--ink); }
  .season-eps{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); flex-shrink:0; }
  .season-manager-empty, .season-manager-loading{
    padding:40px 20px; text-align:center; color:var(--ink-faint); font-family:var(--font-mono); font-size:12px;
  }

  /* ---------- Category manager ---------- */
  .cat-modal-card{ max-width:460px; text-align:left; }
  .cat-modal-card .modal-close{ top:14px; right:14px; }
  .cat-section-title{
    font-family:var(--font-display); font-size:18px; color:var(--gold);
    margin:18px 0 10px; letter-spacing:0.02em;
  }
  .cat-section-title:first-child{ margin-top:4px; }
  .cat-row{
    display:flex; align-items:center; gap:8px; padding:7px 0;
    border-bottom:1px solid var(--line);
  }
  .cat-row input[type="text"]{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:4px;
    color:var(--ink); font-family:var(--font-body); font-size:13px; padding:7px 9px;
  }
  .cat-row input[type="text"]:focus{ outline:none; border-color:var(--gold-dim); }
  .cat-all-label{
    flex:1; font-family:var(--font-body); font-size:13px; color:var(--ink); padding:7px 9px;
  }
  .cat-core-tag{
    font-family:var(--font-mono); font-size:8px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-faint); border:1px solid var(--line); border-radius:999px; padding:3px 7px;
    white-space:nowrap;
  }
  .cat-delete-btn{
    background:transparent; border:none; color:var(--ink-faint); font-size:15px;
    cursor:pointer; padding:4px 6px; line-height:1;
  }
  .cat-delete-btn:hover{ color:var(--brick); }
  .cat-add-row{ display:flex; gap:8px; margin-top:10px; }
  .cat-add-row input[type="text"]{
    flex:1; background:var(--card); border:1px dashed var(--line); border-radius:4px;
    color:var(--ink); font-family:var(--font-body); font-size:13px; padding:8px 10px;
  }
  .cat-add-row input[type="text"]:focus{ outline:none; border-color:var(--gold-dim); }
  .cat-add-btn{
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    background:var(--gold); color:var(--bg); border:none; border-radius:4px; padding:0 14px;
    cursor:pointer; font-weight:600;
  }
  .cat-add-btn:hover{ opacity:0.9; }
  .cat-manager-hint{
    font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:16px; line-height:1.5;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPfUxK3YcGD8orPtG2ji7AOD7bfclzq1s",
  authDomain: "tracker-b2a0a.firebaseapp.com",
  projectId: "tracker-b2a0a",
  storageBucket: "tracker-b2a0a.firebasestorage.app",
  messagingSenderId: "150657260159",
  appId: "1:150657260159:web:b757cdcb96cf146f5ebd4a"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const itemsDocRef = doc(db, "tracker", "items");

(function(){
  "use strict";

  const TMDB_KEY = "906ae7839d3a89a271e9832140b5b59b";
  const TMDB_BASE = "https://api.themoviedb.org/3";
  const IMG_BASE = "https://image.tmdb.org/t/p/w342";
  const STORAGE_KEY = "archive-titles-v1";

  // "core" categories are load-bearing — Stats, Surprise Me, and the finished-movie
  // reordering all key off these exact keys. They can be relabeled but not deleted.
  // Anything else the user adds is a plain custom bucket with no special behaviour.
  const DEFAULT_CATEGORIES = {
    movie: [
      {key:"unwatched", label:"Unwatched", core:true},
      {key:"finished", label:"Finished", core:true},
      {key:"favourite", label:"Favourites", core:true}
    ],
    tv: [
      {key:"up_to_date", label:"Up to date", core:true},
      {key:"havent_started", label:"Haven't started", core:true},
      {key:"finished", label:"Finished", core:true},
      {key:"stopped", label:"Stopped", core:true},
      {key:"favourite", label:"Favourites", core:true}
    ]
  };

  // The Arabic library uses the exact same default category set as English.
  const ARABIC_DEFAULT_CATEGORIES = DEFAULT_CATEGORIES;

  // If a library's saved categories are missing a core category (e.g. an
  // existing Arabic library saved before "Up to date" was added back), this
  // adds it back automatically — safe to run on any already-complete set too.
  function ensureCoreCategories(categories){
    ['movie', 'tv'].forEach(type => {
      const existingKeys = new Set(categories[type].map(c => c.key));
      DEFAULT_CATEGORIES[type].forEach(defCat => {
        if(!existingKeys.has(defCat.key)){
          categories[type].push({...defCat});
        }
      });
    });
    return categories;
  }

  function newLibraryState(library){
    const defaults = library === 'arabic' ? ARABIC_DEFAULT_CATEGORIES : DEFAULT_CATEGORIES;
    return {
      items: [],
      categories: {
        movie: defaults.movie.map(c => ({...c})),
        tv: defaults.tv.map(c => ({...c})),
        _orderMigrated: true // brand new library — nothing to migrate
      },
      filterOrder: {
        movie: ['all', ...defaults.movie.map(c => c.key)],
        tv: ['all', ...defaults.tv.map(c => c.key)]
      },
      activeType: 'movie',
      activeFilter: 'all',
      archiveQuery: ''
    };
  }

  let activeLibrary = 'english';
  const libraries = {};
  let state = newLibraryState(activeLibrary);

  // Editable title/subtitle/tab-label text — shared across devices, not tied
  // to either library's item data, so it's stored and saved separately.
  let libraryMeta = {
    title1: 'THE',
    title2: 'ARCHIVE',
    english: {subtitle: 'a running record of everything watched', tabLabel: 'English Archive'},
    arabic: {subtitle: 'a running record of Arabic movies and TV shows', tabLabel: 'Arabic Archive'}
  };

  function applyLibraryMeta(saved){
    if(!saved) return;
    if(saved.title1) libraryMeta.title1 = saved.title1;
    if(saved.title2) libraryMeta.title2 = saved.title2;
    ['english', 'arabic'].forEach(lib => {
      if(saved[lib]){
        if(saved[lib].subtitle) libraryMeta[lib].subtitle = saved[lib].subtitle;
        if(saved[lib].tabLabel) libraryMeta[lib].tabLabel = saved[lib].tabLabel;
      }
    });
  }

  function renderLibraryMeta(){
    document.getElementById('archiveTitlePart1').textContent = libraryMeta.title1;
    document.getElementById('archiveTitlePart2').textContent = libraryMeta.title2;
    document.getElementById('englishTabLabel').textContent = libraryMeta.english.tabLabel;
    document.getElementById('arabicTabLabel').textContent = libraryMeta.arabic.tabLabel;
    document.getElementById('archiveSubtitle').textContent = libraryMeta[activeLibrary].subtitle;
  }

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const filterRow = document.getElementById('filterRow');
  const searchInput = document.getElementById('searchInput');
  const archiveSearchInput = document.getElementById('archiveSearchInput');
  const archiveSearchClear = document.getElementById('archiveSearchClear');
  const archiveSearchWrap = document.getElementById('archiveSearchWrap');
  const searchResults = document.getElementById('searchResults');
  const toastEl = document.getElementById('toast');

  // Exports a plain, human-readable list of whichever library is currently
  // open — Movies then TV Shows, grouped by category, title and year on
  // their own line. Purely local: reads only from the in-memory state
  // already showing on screen, no network call needed.
  function exportLibraryList(){
    const lib = activeLibrary;

    function section(type, heading){
      let out = `${heading}\n`;
      let any = false;
      state.categories[type].forEach(cat => {
        const items = orderedBucket(type, cat.key);
        if(!items.length) return;
        any = true;
        out += `\n${cat.label}\n`;
        items.forEach(item => {
          out += `${item.title} (${item.year})\n`;
        });
      });
      if(!any) out += '\n(nothing here yet)\n';
      return out;
    }

    const dateStr = new Date().toLocaleDateString();
    let text = `${libraryMeta.title1} ${libraryMeta.title2} — ${libraryMeta[lib].tabLabel}\n`;
    text += `Exported ${dateStr}\n`;
    text += '='.repeat(40) + '\n\n';
    text += section('movie', 'MOVIES') + '\n';
    text += section('tv', 'TV SHOWS');

    const file = new Blob([text], {type: 'text/plain'});
    const url = URL.createObjectURL(file);
    const link = document.createElement('a');
    const fileDate = new Date().toISOString().slice(0, 10);
    link.href = url;
    link.download = `${lib}-archive-${fileDate}.txt`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    showToast('List exported');
  }

  document.getElementById('exportBackupBtn').addEventListener('click', exportLibraryList);

  // Flips the storage order of whichever category is currently selected — the
  // same reversal used by the one-time Finished/Favourites fix, but available
  // any time, on any category, in either library. Undoable like everything else.
  function flipCurrentCategoryOrder(){
    if(state.activeFilter === 'all'){
      showToast('Pick a specific category first, not "All"');
      return;
    }
    const bucket = state.items.filter(i => i.type === state.activeType && i.category === state.activeFilter);
    if(bucket.length < 2){
      showToast('Nothing to flip here');
      return;
    }
    pushUndo();
    const reversedBucket = bucket.slice().reverse();
    const ids = new Set(bucket.map(i => i.id));
    const firstIdx = state.items.findIndex(i => ids.has(i.id));
    const rest = state.items.filter(i => !ids.has(i.id));
    const insertPos = Math.min(firstIdx, rest.length);
    rest.splice(insertPos, 0, ...reversedBucket);
    state.items = rest;
    persist();
    renderGrid();
    showToast(`Flipped "${labelForCat(state.activeType, state.activeFilter)}"`);
    machineLog(`Flipped order of "${labelForCat(state.activeType, state.activeFilter)}".`);
  }

  document.getElementById('flipOrderBtn').addEventListener('click', flipCurrentCategoryOrder);

  // Re-fetches every title in the currently open library directly by its TMDB
  // ID (not a new search — so there's no risk of matching a different title),
  // using that library's language. Updates the displayed name, poster, and
  // detail info wherever TMDB actually has a translation for it; titles TMDB
  // doesn't have translated simply keep their current name, unchanged.
  let refreshingTitles = false;

  async function refreshLibraryTitles(){
    if(refreshingTitles) return;
    const library = activeLibrary;
    const items = state.items.filter(i => i.tmdbId && !i.titleLocked);
    if(!items.length){ showToast('Nothing to refresh yet'); return; }

    const label = libraryMeta[library].tabLabel;
    if(!confirm(`Re-fetch all ${items.length} titles in ${label} using its language? Titles already in that language are unaffected. This can take a minute or two.`)) return;

    pushUndo(); // one snapshot covers the whole bulk refresh — Undo reverts all of it at once

    refreshingTitles = true;
    const btn = document.getElementById('refreshTitlesBtn');
    const originalLabel = btn.textContent;
    btn.disabled = true;
    let done = 0;

    function updateProgress(){
      btn.textContent = `Refreshing… ${done}/${items.length}`;
    }
    updateProgress();

    const CONC = 6;
    let idx = 0;
    async function worker(){
      while(idx < items.length){
        const item = items[idx++];
        const isMovie = item.type === 'movie';
        const [details, credits] = await Promise.all([
          isMovie ? tmdbMovieDetails(item.tmdbId, library) : tmdbTvDetails(item.tmdbId, library),
          isMovie ? tmdbMovieCredits(item.tmdbId, library) : tmdbTvCredits(item.tmdbId, library)
        ]);
        if(details){
          const newTitle = isMovie ? details.title : details.name;
          if(newTitle && newTitle.trim()) item.title = newTitle.trim();
          if(details.poster_path !== undefined && !item.posterLocked) item.posterPath = details.poster_path || null;
          item.detailOverview = details.overview || '';
          item.detailGenres = details.genres ? details.genres.map(g => g.name) : [];
          item.detailRating = details.vote_average ? Math.round(details.vote_average * 10) / 10 : null;
          item.detailRuntime = isMovie
            ? (details.runtime || null)
            : ((details.episode_run_time && details.episode_run_time.length) ? details.episode_run_time[0] : null);
          item.detailSeasons = !isMovie ? (details.number_of_seasons || null) : null;
          item.detailEpisodes = !isMovie ? (details.number_of_episodes || null) : null;
          item.detailFetched = true;
        }
        if(credits && credits.cast){
          item.detailCast = credits.cast.slice(0, 6).map(c => ({name: c.name, character: c.character, profilePath: c.profile_path}));
        }
        done++;
        updateProgress();
        if(done % 20 === 0 && activeLibrary === library){
          persist();
          renderGrid();
        }
      }
    }
    const workers = [];
    for(let i = 0; i < CONC; i++) workers.push(worker());
    await Promise.all(workers);

    refreshingTitles = false;
    btn.disabled = false;
    btn.textContent = originalLabel;
    if(activeLibrary === library){
      persist();
      renderGrid();
      renderStats();
      showToast(`Refreshed ${done} titles`);
    }
  }

  document.getElementById('refreshTitlesBtn').addEventListener('click', refreshLibraryTitles);

  function uid(){
    return 'x' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  // ---------- Storage ----------
  // Saves to Firestore (a cloud database) instead of the browser, so the
  // same list — and your custom categories — show up no matter which
  // browser or device you open this file from. A local cache is kept as
  // a fallback if you're offline.
  function storedLibrary(data, library){
    if(library === 'arabic') return data.arabicArchive || null;
    return Array.isArray(data.items) ? data : null;
  }

  async function loadItems(library = activeLibrary){
    try{
      const snap = await getDoc(itemsDocRef);
      const libraryData = snap.exists() ? storedLibrary(snap.data(), library) : null;
      if(libraryData && Array.isArray(libraryData.items)){
        const items = libraryData.items;
        const categories = (libraryData.categories && libraryData.categories.movie && libraryData.categories.tv) ? libraryData.categories : null;
        const filterOrder = (libraryData.filterOrder && libraryData.filterOrder.movie && libraryData.filterOrder.tv) ? libraryData.filterOrder : null;
        try{ localStorage.setItem(`${STORAGE_KEY}-${library}`, JSON.stringify({items, categories, filterOrder})); }catch(e){}
        return {items, categories, filterOrder};
      }
      // Cloud fetch succeeded but had no valid data for this library — before
      // treating it as a genuinely empty/new library, check the local backup.
      // This is what prevents a stale or incomplete cloud read from being
      // mistaken for "nothing here" and later silently overwriting real data.
      const cached = loadFromLocalCache(library);
      if(cached) showToast('Could not confirm the latest cloud data — showing your last saved copy');
      return cached;
    }catch(e){
      console.error('cloud load failed', e);
      showToast(`Could not reach the cloud (${e?.code || e?.message || 'unknown error'})`);
      return loadFromLocalCache(library);
    }
  }

  function loadFromLocalCache(library){
    try{
      const raw = localStorage.getItem(`${STORAGE_KEY}-${library}`) || (library === 'english' ? localStorage.getItem(STORAGE_KEY) : null);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) return {items: parsed, categories: null, filterOrder: null}; // old cache format
        return {items: parsed.items || [], categories: parsed.categories || null, filterOrder: parsed.filterOrder || null};
      }
    }catch(e2){}
    return null;
  }

  const saveTimers = {english: null, arabic: null};
  function persist(){
    const library = activeLibrary;
    const saved = {items: state.items, categories: state.categories, filterOrder: state.filterOrder};
    clearTimeout(saveTimers[library]);
    saveTimers[library] = setTimeout(async ()=>{
      try{ localStorage.setItem(`${STORAGE_KEY}-${library}`, JSON.stringify(saved)); }catch(e){}
      try{
        const cloudUpdate = library === 'arabic' ? {arabicArchive: saved} : saved;
        await setDoc(itemsDocRef, cloudUpdate, {merge: true});
      }catch(e){
        console.error('cloud save failed', e);
        showToast(`Could not save to the cloud (${e?.code || e?.message || 'unknown error'})`);
      }
    }, 400);
  }

  // ---------- TMDB ----------
  // When browsing the Arabic archive, ask TMDB for Arabic-language titles,
  // overviews, and cast names instead of the English default. TMDB doesn't
  // have an Arabic translation for every title, but uses one whenever it exists.
  // Accepts an explicit library so a long-running background fetch (like
  // hydrating posters) keeps using the library it started with, even if the
  // user switches tabs partway through.
  function tmdbLangParam(library = activeLibrary){
    return library === 'arabic' ? '&language=ar' : '';
  }

  async function tmdbFind(title, year, type, library = activeLibrary){
    const path = type === 'movie' ? 'search/movie' : 'search/tv';
    const yearParam = type === 'movie' ? `&year=${year}` : `&first_air_date_year=${year}`;
    const lang = tmdbLangParam(library);
    const url = `${TMDB_BASE}/${path}?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}${yearParam}${lang}`;
    try{
      const r = await fetch(url);
      if(!r.ok) return null;
      const data = await r.json();
      if(data.results && data.results.length){
        return data.results[0];
      }
      // retry without year constraint
      const url2 = `${TMDB_BASE}/${path}?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}${lang}`;
      const r2 = await fetch(url2);
      if(!r2.ok) return null;
      const data2 = await r2.json();
      if(data2.results && data2.results.length) return data2.results[0];
      return null;
    }catch(e){
      return null;
    }
  }

  async function tmdbSearchMulti(query){
    const url = `${TMDB_BASE}/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}${tmdbLangParam()}`;

      const r = await fetch(url);
      if(!r.ok) return [];
      const data = await r.json();
      return (data.results || []).filter(x => x.media_type === 'movie' || x.media_type === 'tv').slice(0,8);

  // Alternate poster art for the "change poster" picker — English archive
  // only, so this pulls English-language posters plus textless/no-language
  // art (the usual TV Time-style poster options), not the full every-locale
  // dump TMDB has on file.
  async function tmdbImages(id, type){

    try{

  // concurrency-limited poster hydration
  async function hydratePosters(items, library = activeLibrary){
    const queue = items.filter(i => i.posterPath === undefined && !i.notFound);
    if(!queue.length) return;
    let idx = 0;
    let sinceLastSave = 0;
    const CONC = 6;

    // Guards every save this function makes — if the user switched to the other
    // library while this was still running in the background, we skip saving
    // here rather than writing the WRONG library's state. The fetched poster
    // data stays correct in memory either way and saves next time something
    // else changes in that library.
    function persistIfStillActive(){
      if(activeLibrary === library) persist();
    }

    async function worker(){
      while(idx < queue.length){
        const item = queue[idx++];
        const result = await tmdbFind(item.title, item.year, item.type, library);
        if(result){
          item.posterPath = result.poster_path || null;
          item.tmdbId = result.id;
        }else{
          item.posterPath = null;
          item.notFound = true;
        }
        renderPosterUpdate(item);
        sinceLastSave++;
        if(sinceLastSave >= 40){
          sinceLastSave = 0;
          persistIfStillActive();
        }
      }
    }
    const workers = [];
    for(let w=0; w<CONC; w++) workers.push(worker());
    await Promise.all(workers);
    persistIfStillActive();
  }

  function renderPosterUpdate(item){
    const card = grid.querySelector(`[data-id="${item.id}"]`);
    if(!card) return;
    const imgWrap = card.querySelector('.img-wrap');
    if(!imgWrap) return;
    if(item.posterPath){
      imgWrap.innerHTML = `<img src="${IMG_BASE}${item.posterPath}" alt="" loading="lazy">`;
    }else{
      imgWrap.innerHTML = `<div class="fallback">${escapeHtml(item.title)}</div>`;
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Rendering ----------
  // Effective pill order for a type — self-heals: keeps 'all' pinned somewhere
  // (adds it if missing), drops stale keys (deleted categories), and appends
  // any category the saved order doesn't know about yet (newly added, or
  // added from another device before this feature existed there).
  function orderedFiltersForType(type){
    const real = state.categories[type];
    const validKeys = new Set(['all', ...real.map(c => c.key)]);
    let order = (state.filterOrder && state.filterOrder[type]) ? state.filterOrder[type].filter(k => validKeys.has(k)) : [];
    if(!order.includes('all')) order.unshift('all');
    validKeys.forEach(k => { if(!order.includes(k)) order.push(k); });
    return order.map(key => ({
      key,
      label: key === 'all' ? 'All' : (real.find(c => c.key === key)?.label ?? key)
    }));
  }

  let pillJustDragged = false;

  function renderFilters(){
    const cats = orderedFiltersForType(state.activeType);
    filterRow.innerHTML = '';
    cats.forEach(c => {
      const count = c.key === 'all'
        ? state.items.filter(i => i.type === state.activeType).length
        : state.items.filter(i => i.type === state.activeType && i.category === c.key).length;
      const btn = document.createElement('button');
      btn.className = 'filter-pill' + (state.activeFilter === c.key ? ' active' : '');
      btn.dataset.key = c.key;
      btn.innerHTML = `${c.label} <span class="count">${count}</span>`;
      btn.addEventListener('click', () => {
        if(pillJustDragged){ pillJustDragged = false; return; }
        state.activeFilter = c.key;
        renderFilters();
        navTransition(renderGrid);
      });
      initPillDrag(btn);
      filterRow.appendChild(btn);
    });
  }

  // Drag-and-drop for the filter pills themselves, right on the page — same
  // press-and-slide approach as the poster grid. Distance is measured in 2D
  // since the pill row wraps onto multiple lines. A real drag is distinguished
  // from a normal tap (which switches the filter) via a small movement threshold.
  function initPillDrag(btn){
    btn.addEventListener('pointerdown', (e) => {
      if(e.button !== undefined && e.button !== 0) return;

      const pointerId = e.pointerId;
      const isTouch = e.pointerType === 'touch';
      const startX = e.clientX, startY = e.clientY;
      let holdTimer = null;
      let armed = false;
      let cancelled = false;
      let ctx = null;
      let rafId = null;
      let pendingEv = null;

      function beginDrag(ev){
        if(cancelled) return;
        armed = true;
        const rect = btn.getBoundingClientRect();
        const placeholder = document.createElement('div');
        placeholder.className = 'filter-pill pill-placeholder';
        placeholder.style.width = rect.width + 'px';
        placeholder.style.height = rect.height + 'px';
        filterRow.insertBefore(placeholder, btn);

        ctx = {
          placeholder,
          offsetX: ev.clientX - rect.left,
          offsetY: ev.clientY - rect.top,
          currentTarget: null // {el, before} — last slot we actually committed to
        };

        btn.classList.add('pill-dragging');
        btn.style.position = 'fixed';
        btn.style.left = rect.left + 'px';
        btn.style.top = rect.top + 'px';
        btn.style.width = rect.width + 'px';
        btn.style.height = rect.height + 'px';
        btn.style.pointerEvents = 'none';
        document.body.appendChild(btn);

        try{ btn.setPointerCapture(pointerId); }catch(err){}
        updateDragPosition(ev);
      }

      // Runs at most once per animation frame (pointermove can fire far more
      // often than the screen can redraw), and needs a candidate slot to beat
      // the current one by a clear margin before switching — small, closely-
      // packed pills otherwise flicker between two near-equal choices.
      function updateDragPosition(ev){
        btn.style.left = (ev.clientX - ctx.offsetX) + 'px';
        btn.style.top = (ev.clientY - ctx.offsetY) + 'px';

        const HYSTERESIS = 14; // px a new candidate must beat the current slot by
        const siblings = Array.from(filterRow.children).filter(el => el !== ctx.placeholder);
        let closest = null, closestDist = Infinity, before = true;
        for(const sib of siblings){
          const r = sib.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const dist = Math.hypot(ev.clientX - cx, ev.clientY - cy);
          if(dist < closestDist){
            closestDist = dist;
            closest = sib;
            before = ev.clientX < cx;
          }
        }
        if(!closest) return;

        if(ctx.currentTarget && ctx.currentTarget.el === closest && ctx.currentTarget.before === before){
          return; // same slot as last time, nothing to do
        }
        if(ctx.currentTarget){
          const r = ctx.currentTarget.el.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const currentDist = Math.hypot(ev.clientX - cx, ev.clientY - cy);
          if(closestDist > currentDist - HYSTERESIS) return; // not a clear enough win, stay put
        }

        ctx.currentTarget = {el: closest, before};
        filterRow.insertBefore(ctx.placeholder, before ? closest : closest.nextSibling);
      }

      function scheduleUpdate(ev){
        pendingEv = ev;
        if(rafId) return;
        rafId = requestAnimationFrame(() => {
          rafId = null;
          updateDragPosition(pendingEv);
        });
      }

      function finishDrag(){
        if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
        filterRow.insertBefore(btn, ctx.placeholder);
        ctx.placeholder.remove();
        btn.classList.remove('pill-dragging');
        btn.style.position = '';
        btn.style.left = '';
        btn.style.top = '';
        btn.style.width = '';
        btn.style.height = '';
        btn.style.pointerEvents = '';
        const newOrder = Array.from(filterRow.children).map(el => el.dataset.key);
        ctx = null;
        // Suppresses a stray click if the browser fires one right after this
        // drag — but self-expires quickly so it can never eat a LATER, unrelated
        // click on some other pill if no such click ever comes.
        pillJustDragged = true;
        setTimeout(() => { pillJustDragged = false; }, 250);
        // If it ended up back in the exact same order it started in (picked up
        // and dropped in the same spot), skip entirely — no undo entry, no
        // save, nothing happens. Otherwise every such drag would silently
        // waste an Undo click on a change that never actually occurred.
        const oldOrder = orderedFiltersForType(state.activeType).map(c => c.key);
        const unchanged = newOrder.length === oldOrder.length && newOrder.every((k, i) => k === oldOrder[i]);
        if(unchanged) return;
        pushUndo();
        state.filterOrder[state.activeType] = newOrder;
        persist();
        renderFilters();
        renderGrid();
      }

      function cancelDrag(){
        if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
        if(!ctx) return;
        filterRow.insertBefore(btn, ctx.placeholder);
        ctx.placeholder.remove();
        btn.classList.remove('pill-dragging');
        btn.style.position = '';
        btn.style.left = '';
        btn.style.top = '';
        btn.style.width = '';
        btn.style.height = '';
        btn.style.pointerEvents = '';
        ctx = null;
      }

      function onMove(ev){
        if(ev.pointerId !== pointerId) return;
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(!armed){
          if(!isTouch && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
            beginDrag(ev);
          }else if(isTouch && (Math.abs(dx) > 10 || Math.abs(dy) > 10)){
            cancelled = true;
            clearTimeout(holdTimer);
          }
          return;
        }
        ev.preventDefault();
        scheduleUpdate(ev);
      }

      function onUp(ev){
        if(ev.pointerId !== pointerId) return;
        clearTimeout(holdTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancelEvt);
        if(armed) finishDrag();
      }

      function onCancelEvt(ev){
        if(ev.pointerId !== pointerId) return;
        clearTimeout(holdTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancelEvt);
        if(armed) cancelDrag();
      }

      if(isTouch){
        holdTimer = setTimeout(() => { if(!cancelled) beginDrag(e); }, 220);
      }
      document.addEventListener('pointermove', onMove, {passive: false});
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancelEvt);
    });
  }

  // Order for one type+category bucket — plain storage order. Whatever moved
  // in most recently sits at the front, always, for every category (see
  // changeCategory below, which is what actually moves things to the front).
  function orderedBucket(type, category){
    return state.items.filter(i => i.type === type && i.category === category);
  }

  // Whether this item is eligible for an explicit top-10 rank medal at all
  // (English library, TV, Favourites only) — independent of drag order.
  function rankEligible(item){
    return activeLibrary === 'english' && item.type === 'tv' && item.category === 'favourite';
  }

  function tierForRank(rank){
    if(rank === 1) return 'gold';
    if(rank === 2) return 'silver';
    if(rank === 3) return 'bronze';
    return 'purple';
  }

  // Explicitly assigns (or clears, when newRank is null) a top-10 rank on a
  // title. If another title already holds that rank, the two swap — nothing
  // is ever silently bumped or lost.
  function assignRank(id, newRank){
    const item = state.items.find(i => i.id === id);
    if(!item || !rankEligible(item)) return;
    const oldRank = item.rank || null;
    if(newRank === oldRank) return;
    pushUndo();

    // Leaderboard-style insert: pull everyone else's current ranking (in
    // order), drop this item into the requested slot, then renumber the
    // whole sequence 1..N. Anything pushed past #10 simply loses its badge.
    const others = state.items
      .filter(i => rankEligible(i) && i.id !== id && i.rank)
      .sort((a, b) => a.rank - b.rank);

    if(newRank !== null){
      others.splice(Math.min(newRank - 1, others.length), 0, item);
    }
    others.forEach((it, idx) => {
      if(idx < 10) it.rank = idx + 1;
      else delete it.rank;
    });
    if(newRank === null) delete item.rank;

    reorderFavouritesByRank();
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    if(newRank){
      showToast(`"${item.title}" set to #${newRank}`);
      machineLog(`Set "${item.title}" to rank #${newRank}.`);
    }else{
      showToast(`Removed "${item.title}"'s rank badge`);
      machineLog(`Removed "${item.title}"'s rank badge.`);
    }
  }

  // Pulls every ranked (English, TV, Favourites) title to the front of that
  // bucket in rank order, so #1 visually sits at the top of the grid and the
  // rest follow in order. Anything unranked keeps its existing relative order
  // right after them. This is what makes "set to #1" actually move the card.
  function reorderFavouritesByRank(){
    const bucket = state.items.filter(i => i.type === 'tv' && i.category === 'favourite');
    if(bucket.length < 2) return;
    const ids = new Set(bucket.map(i => i.id));
    const firstIdx = state.items.findIndex(i => ids.has(i.id));
    const rest = state.items.filter(i => !ids.has(i.id));
    const ranked = bucket.filter(i => i.rank).sort((a, b) => a.rank - b.rank);
    const unranked = bucket.filter(i => !i.rank);
    const newBucket = [...ranked, ...unranked];
    const insertPos = Math.min(firstIdx, rest.length);
    rest.splice(insertPos, 0, ...newBucket);
    state.items = rest;
  }
