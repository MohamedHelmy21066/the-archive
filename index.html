  // One-time correction, run once per library right after it loads. Movies in
  // Finished/Favourites used to display in reverse of storage order (a separate
  // feature from the "moves to top" behavior above). That reversal was removed
  // when everything switched to the single, simpler storage-order rule — this
  // flips the two buckets' storage order once so the titles you already had
  // keep showing in the same order they always did, before anything new is
  // ever moved in and out. Only ever runs once per library; harmless to call
  // again since it checks the flag first.
  function migrateFinishedFavouriteOrder(){
    if(state.categories._orderMigrated) return false;
    ['finished', 'favourite'].forEach(cat => {
      const bucket = state.items.filter(i => i.type === 'movie' && i.category === cat);
      if(bucket.length < 2) return;
      const reversedBucket = bucket.slice().reverse();
      const ids = new Set(bucket.map(i => i.id));
      const firstIdx = state.items.findIndex(i => ids.has(i.id));
      const rest = state.items.filter(i => !ids.has(i.id));
      const insertPos = Math.min(firstIdx, rest.length);
      rest.splice(insertPos, 0, ...reversedBucket);
      state.items = rest;
    });
    state.categories._orderMigrated = true;
    return true;
  }

  function visibleItems(){
    const q = state.archiveQuery.trim().toLowerCase();
    let ordered;
    if(state.activeFilter === 'all'){
      ordered = state.items.filter(i => i.type === state.activeType);
    }else{
      ordered = orderedBucket(state.activeType, state.activeFilter);
    }
    if(q) ordered = ordered.filter(i => i.title.toLowerCase().includes(q));
    return ordered;
  }

  function renderStats(){
    document.getElementById('statTotal').textContent = state.items.length;
    document.getElementById('statFinished').textContent = state.items.filter(i => i.category === 'finished').length;
    document.getElementById('statFav').textContent = state.items.filter(i => i.category === 'favourite').length;
  }

  let lastCardTap = {id: null, time: 0};

  // ---------- Undo (whole-state snapshots — restores everything exactly, no
  // matter what kind of action was taken: add, delete, move, rename, reorder...) ----------
  let undoStack = [];
  const undoBtn = document.getElementById('undoBtn');

  function snapshotState(){
    return {
      items: JSON.parse(JSON.stringify(state.items)),
      categories: JSON.parse(JSON.stringify(state.categories)),
      filterOrder: JSON.parse(JSON.stringify(state.filterOrder))
    };
  }

  // Call this BEFORE making any change you want to be undoable — it captures
  // what things looked like right before that change.
  function pushUndo(){
    undoStack.push(snapshotState());
    if(undoStack.length > 20) undoStack.shift();
    updateUndoBtn();
  }

  function updateUndoBtn(){
    undoBtn.disabled = undoStack.length === 0;
    undoBtn.classList.toggle('has-actions', undoStack.length > 0);
  }

  function performUndo(){
    const snap = undoStack.pop();
    if(!snap){ updateUndoBtn(); return; }
    state.items = snap.items;
    state.categories = snap.categories;
    state.filterOrder = snap.filterOrder;
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    showToast('Undid last action');
    updateUndoBtn();
    machineLog('Admin reversed the last action (undo).');
  }

  undoBtn.addEventListener('click', performUndo);

  // ---- Smooth navigation transitions ----
  let navToken = 0, navTimer = null;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function playGridIn(){
    if(reduceMotion) return;
    const token = ++navToken;
    grid.classList.remove('nav-out', 'nav-in');
    grid.querySelectorAll('.poster-card').forEach((c, i) => c.style.setProperty('--d', Math.min(i, 24) * 20 + 'ms'));
    void grid.offsetWidth;
    grid.classList.add('nav-in');
    clearTimeout(navTimer);
    navTimer = setTimeout(() => { if(token === navToken) grid.classList.remove('nav-in'); }, 1100);
  }
  function navTransition(update){
    if(reduceMotion){ update(); return; }
    const token = ++navToken;
    grid.classList.remove('nav-in');
    grid.classList.add('nav-out');
    setTimeout(() => {
      if(token !== navToken) return;
      update();
      grid.classList.remove('nav-out');
      playGridIn();
    }, 120);
  }

  // ---- TV Time-style status strip (English TV library only) -----------------
  // stopped            -> red
  // up to date / finished / favourite + show has ended          -> purple
  // up to date / finished / favourite + show still in production -> green
  // "ended" vs "ongoing" comes from TMDB's show status and is re-checked weekly for ongoing shows.
  const SHOW_STATUS_TTL = 7 * 24 * 3600 * 1000;
  const STATUS_BAR_CATS = ['up_to_date', 'finished', 'favourite'];
  let statusBackfillTimer = null, statusBackfillRunning = false;

  function setShowStatus(item, d){
    if(!d || !d.status) return false;
    const ended = (d.status === 'Ended' || d.status === 'Canceled');
    const running = (d.status === 'Returning Series' || d.status === 'In Production' || d.status === 'Planned' || d.status === 'Pilot');
    item.showStatus = ended ? 'ended' : running ? 'ongoing' : (d.in_production ? 'ongoing' : 'ended');
    item.showStatusAt = Date.now();
    return true;
  }
  function statusBarColor(item){
    if(activeLibrary !== 'english' || item.type !== 'tv') return null;
    if(item.category === 'stopped') return 'red';
    if(STATUS_BAR_CATS.includes(item.category)){
      if(item.showStatus === 'ended') return 'purple';
      if(item.showStatus === 'ongoing') return 'green';
    }
    return null;
  }
  function needsShowStatus(item){
    if(item.type !== 'tv' || !item.tmdbId || !STATUS_BAR_CATS.includes(item.category)) return false;
    if(!item.showStatus) return true;
    return item.showStatus === 'ongoing' && (Date.now() - (item.showStatusAt || 0)) > SHOW_STATUS_TTL;
  }
  function applyStatusBar(card, item){
    const old = card.querySelector('.tv-status-bar');
    if(old) old.remove();
    const color = statusBarColor(item);
    const art = card.querySelector('.poster-art');
    if(color && art){
      const bar = document.createElement('div');
      bar.className = 'tv-status-bar ' + color;
      art.appendChild(bar);
    }
  }
  function scheduleStatusBackfill(){
    if(activeLibrary !== 'english') return;
    clearTimeout(statusBackfillTimer);
    statusBackfillTimer = setTimeout(runStatusBackfill, 500);
  }
  async function runStatusBackfill(){
    if(statusBackfillRunning || activeLibrary !== 'english') return;
    const lib = activeLibrary;
    const queue = state.items.filter(needsShowStatus);
    if(!queue.length) return;
    statusBackfillRunning = true;
    let idx = 0, changed = false;
    async function worker(){
      while(idx < queue.length){
        const item = queue[idx++];
        const d = await tmdbTvDetails(item.tmdbId, lib);
        if(setShowStatus(item, d)){
          changed = true;
          const card = document.querySelector('.poster-card[data-id="' + item.id + '"]');
          if(card) applyStatusBar(card, item);
        }
      }
    }
    await Promise.all(Array.from({length: 6}, worker));
    statusBackfillRunning = false;
    if(changed && activeLibrary === lib) persist();
  }

  function buildCard(item){
    const card = document.createElement('div');
    card.className = 'poster-card';
    card.setAttribute('data-id', item.id);

    let imgInner;
    if(item.posterPath === undefined){
      imgInner = `<div class="skeleton"></div>`;
    }else if(item.posterPath){
      imgInner = `<img src="${IMG_BASE}${item.posterPath}" alt="" loading="lazy" draggable="false">`;
    }else{
      imgInner = `<div class="fallback">${escapeHtml(item.title)}</div>`;
    }

    const itemCats = item.type === 'movie' ? state.categories.movie : state.categories.tv;
    const catOptions = itemCats.map(c =>
      `<option value="${c.key}" ${item.category === c.key ? 'selected' : ''}>${c.label}</option>`
    ).join('');

    const eligible = rankEligible(item);
    const rank = eligible ? (item.rank || null) : null;

    // Heart always shows for any favourite, regardless of whether it also
    // has a rank medal — the two are independent marks now.
    const heartMark = item.category === 'favourite' ? '<div class="fav-mark">&#9829;</div>' : '';
    const medalMark = rank
      ? `<div class="rank-medal-wrap rank-medal-${tierForRank(rank)}" title="#${rank} favourite TV show">${buildMedalSVG(rank, tierForRank(rank))}</div>`
      : '';

    let rankSelectHtml = '';
    if(eligible){
      const rankOptions = ['<option value="">No badge</option>']
        .concat(Array.from({length:10}, (_,i) => i+1).map(n =>
          `<option value="${n}" ${rank === n ? 'selected' : ''}>#${n}</option>`
        )).join('');
      rankSelectHtml = `<select class="rank-select" title="Assign rank badge" aria-label="Assign rank badge to ${escapeHtml(item.title)}">${rankOptions}</select>`;
    }

    card.innerHTML = `
      <div class="poster-art">
        <div class="img-wrap">${imgInner}</div>
        <div class="poster-caption">
          <div class="t">${escapeHtml(item.title)}</div>
          <div class="y">${item.year}</div>
          <select class="cat-select" title="Move to…" aria-label="Move ${escapeHtml(item.title)} to another category">${catOptions}</select>
          ${rankSelectHtml}
        </div>
      </div>
      ${heartMark}
      ${medalMark}
      <button class="remove-btn" title="Remove" aria-label="Remove ${escapeHtml(item.title)}">&times;</button>
    `;
    applyStatusBar(card, item);
    if(needsShowStatus(item)) scheduleStatusBackfill();
    card.querySelector('.remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      removeItem(item.id);
    });
    const catSelect = card.querySelector('.cat-select');
    catSelect.addEventListener('click', (e) => e.stopPropagation());
    catSelect.addEventListener('change', (e) => {
      changeCategory(item.id, e.target.value);
    });
    const rankSelect = card.querySelector('.rank-select');
    if(rankSelect){
      rankSelect.addEventListener('click', (e) => e.stopPropagation());
      rankSelect.addEventListener('change', (e) => {
        const val = e.target.value ? parseInt(e.target.value, 10) : null;
        assignRank(item.id, val);
      });
    }
    card.addEventListener('click', () => {
      const now = Date.now();
      if(lastCardTap.id === item.id && (now - lastCardTap.time) < 400){
        lastCardTap = {id: null, time: 0};
        openDetail(item.id);
      }else{
        lastCardTap = {id: item.id, time: now};
      }
    });
    initCardDrag(card, item);
    return card;
  }

  // Items of one type+category, in on-screen order, honoring the archive search box.
  function itemsForCategory(type, category){
    const q = state.archiveQuery.trim().toLowerCase();
    let list = orderedBucket(type, category);
    if(q) list = list.filter(i => i.title.toLowerCase().includes(q));
    return list;
  }

  function renderGrid(){
    grid.innerHTML = '';

    if(state.activeFilter === 'all'){
      grid.classList.add('grouped');
      const cats = orderedFiltersForType(state.activeType).filter(c => c.key !== 'all');
      const frag = document.createDocumentFragment();
      let anyItems = false;

      cats.forEach(cat => {
        const items = itemsForCategory(state.activeType, cat.key);
        if(!items.length) return; // skip empty categories — no clutter
        anyItems = true;

        const section = document.createElement('div');
        section.className = 'cat-section';
        section.innerHTML = `<div class="cat-section-header">${escapeHtml(cat.label)} <span class="cat-section-count">${items.length}</span></div>`;

        const sectionGrid = document.createElement('div');
        sectionGrid.className = 'grid cat-section-grid';
        items.forEach(item => sectionGrid.appendChild(buildCard(item)));

        section.appendChild(sectionGrid);
        frag.appendChild(section);
      });

      grid.appendChild(frag);
      emptyState.style.display = anyItems ? 'none' : 'block';
    }else{
      grid.classList.remove('grouped');
      const items = visibleItems();
      emptyState.style.display = items.length ? 'none' : 'block';
      const frag = document.createDocumentFragment();
      items.forEach(item => frag.appendChild(buildCard(item)));
      grid.appendChild(frag);
    }
  }

  function labelForCat(type, key){
    const cats = state.categories[type] || [];
    const c = cats.find(c => c.key === key);
    return c ? c.label : key;
  }

  function changeCategory(id, newCat){
    const item = state.items.find(i => i.id === id);
    if(!item || item.category === newCat) return;
    pushUndo();
    item.category = newCat;
    if(newCat !== 'favourite' && item.rank){
      // A rank badge only means something inside Favourites — clear it once
      // a title leaves, so it doesn't reappear with a stale rank later.
      delete item.rank;
    }
    // Move it to the very front of storage order — this is what makes it show
    // up first (newest) in whatever category it just entered, every time, no
    // matter which category it's coming from or going to.
    state.items = [item, ...state.items.filter(i => i.id !== id)];
    // If this just landed in (or left) TV Favourites, re-settle the bucket so
    // ranked titles stay pinned above everything else — otherwise the line
    // above would shove a freshly-favourited show above #1.
    reorderFavouritesByRank();
    if(newCat === 'finished' || newCat === 'favourite' || newCat === 'up_to_date' || newCat === 'stopped'){
      // Force a clean re-fetch for Stats every time a title enters a tracked
      // category — wipes any previously cached runtime/episode data so there's
      // no chance of a stale or bad number lingering from before. The next time
      // Stats is opened, this title is treated as never having been fetched.
      delete item.runtimeMin;
      delete item.epCount;
      delete item.epRuntimeMin;
    }
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    showToast(`Moved "${item.title}" to ${labelForCat(item.type, newCat)}`);
    machineLog(`Moved "${item.title}" → ${labelForCat(item.type, newCat)}.`);
  }

  // ---------- Manual drag-to-reorder (moves an item to a new spot within whatever's currently visible) ----------
  // Reorders an item within its own category bucket — this is the ordering that both
  // the flat filtered view AND each header section in "All" actually display, so
  // dragging always means the same thing no matter which view you dragged it in.
  function moveItemWithinCategory(id, newIndex){
    const item = state.items.find(i => i.id === id);
    if(!item) return;

    const originalBucket = state.items.filter(i => i.type === item.type && i.category === item.category);
    const fromIdx = originalBucket.findIndex(i => i.id === id);
    if(fromIdx === -1) return;

    let bucket = originalBucket.slice();
    bucket.splice(fromIdx, 1);
    const clamped = Math.max(0, Math.min(newIndex, bucket.length));
    bucket.splice(clamped, 0, item);

    // If it ended up back in the exact same order it started in (picked up
    // and dropped in the same spot), skip entirely — no undo entry, no save,
    // nothing happens. Otherwise every such drag would silently waste an
    // Undo click on a change that never actually occurred.
    const unchanged = bucket.length === originalBucket.length &&
      bucket.every((it, idx) => it.id === originalBucket[idx].id);
    if(unchanged) return;

    pushUndo();

    const idsInBucket = new Set(bucket.map(i => i.id));
    const firstIdx = state.items.findIndex(i => idsInBucket.has(i.id));
    const rest = state.items.filter(i => !idsInBucket.has(i.id));
    const insertPos = Math.min(firstIdx, rest.length);
    rest.splice(insertPos, 0, ...bucket);
    state.items = rest;

    persist();
    machineLog(`Reordered "${item.title}" within ${labelForCat(item.type, item.category)}.`);
  }

  // ---------- Drag-and-drop reordering (press and slide a poster, like moving desktop icons) ----------
  // Mouse: drag starts as soon as you move past a few px.
  // Touch: press and hold briefly first (so normal scrolling still works), then drag.
  function initCardDrag(card, item){
    card.addEventListener('pointerdown', (e) => {
      if(e.button !== undefined && e.button !== 0) return; // left mouse button only
      if(e.target.closest('.cat-select') || e.target.closest('.remove-btn')) return;

      const pointerId = e.pointerId;
      const isTouch = e.pointerType === 'touch';
      const startX = e.clientX, startY = e.clientY;
      let holdTimer = null;
      let armed = false;
      let cancelled = false;
      let ctx = null;
      let lastEv = e;
      let autoScrollRAF = null;

      function beginDrag(ev){
        if(cancelled) return;
        armed = true;
        const container = card.parentNode; // the section's own grid when grouped, or the flat grid otherwise
        const rect = card.getBoundingClientRect();
        const placeholder = document.createElement('div');
        placeholder.className = 'poster-card drag-placeholder';
        container.insertBefore(placeholder, card);

        ctx = {
          container,
          placeholder,
          offsetX: ev.clientX - rect.left,
          offsetY: ev.clientY - rect.top
        };

        card.classList.add('dragging');
        card.style.position = 'fixed';
        card.style.width = rect.width + 'px';
        card.style.height = rect.height + 'px';
        card.style.left = rect.left + 'px';
        card.style.top = rect.top + 'px';
        card.style.pointerEvents = 'none';
        document.body.appendChild(card);

        try{ card.setPointerCapture(pointerId); }catch(err){}
        updateDragPosition(ev);
        autoScrollRAF = requestAnimationFrame(autoScrollTick);
      }

      // Scrolls the page while the dragged poster is held near the top or bottom
      // edge of the screen — speed ramps up the closer you are to the edge.
      function autoScrollTick(){
        if(!ctx){ autoScrollRAF = null; return; }
        const EDGE = 100, MAX_SPEED = 22;
        const vh = window.innerHeight;
        let dy = 0;
        if(lastEv.clientY < EDGE){
          dy = -MAX_SPEED * (1 - lastEv.clientY / EDGE);
        }else if(lastEv.clientY > vh - EDGE){
          dy = MAX_SPEED * (1 - (vh - lastEv.clientY) / EDGE);
        }
        if(dy !== 0){
          window.scrollBy(0, dy);
          updateDragPosition(lastEv); // re-evaluate drop slot as new rows scroll under the cursor
        }
        autoScrollRAF = requestAnimationFrame(autoScrollTick);
      }

      function updateDragPosition(ev){
        card.style.left = (ev.clientX - ctx.offsetX) + 'px';
        card.style.top = (ev.clientY - ctx.offsetY) + 'px';

        const siblings = Array.from(ctx.container.children).filter(el => el !== ctx.placeholder);
        let closest = null, closestDist = Infinity, before = true;
        for(const sib of siblings){
          const r = sib.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const dist = Math.hypot(ev.clientX - cx, ev.clientY - cy);
          if(dist < closestDist){
            closestDist = dist;
            closest = sib;
            before = ev.clientY < cy || (Math.abs(ev.clientY - cy) < r.height / 3 && ev.clientX < cx);
          }
        }
        if(closest){
          ctx.container.insertBefore(ctx.placeholder, before ? closest : closest.nextSibling);
        }
      }

      function stopAutoScroll(){
        if(autoScrollRAF){
          cancelAnimationFrame(autoScrollRAF);
          autoScrollRAF = null;
        }
      }

      function endDrag(){
        stopAutoScroll();
        const children = Array.from(ctx.container.children);
        const finalIndex = children.indexOf(ctx.placeholder);
        ctx.container.insertBefore(card, ctx.placeholder);
        ctx.placeholder.remove();
        card.classList.remove('dragging');
        card.style.position = '';
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        card.style.height = '';
        card.style.pointerEvents = '';
        ctx = null;
        moveItemWithinCategory(item.id, finalIndex);
        renderGrid();
      }

      function cancelDrag(){
        stopAutoScroll();
        if(!ctx) return;
        ctx.container.insertBefore(card, ctx.placeholder);
        ctx.placeholder.remove();
        card.classList.remove('dragging');
        card.style.position = '';
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        card.style.height = '';
        card.style.pointerEvents = '';
        ctx = null;
      }

      function onMove(ev){
        if(ev.pointerId !== pointerId) return;
        lastEv = ev;
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(!armed){
          if(!isTouch && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
            beginDrag(ev);
          }else if(isTouch && (Math.abs(dx) > 10 || Math.abs(dy) > 10)){
            cancelled = true;
            clearTimeout(holdTimer);
          }
          return;
        }
        ev.preventDefault();
        updateDragPosition(ev);
      }

      function onUp(ev){
        if(ev.pointerId !== pointerId) return;
        clearTimeout(holdTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancelEvt);
        if(armed) endDrag();
      }

      function onCancelEvt(ev){
        if(ev.pointerId !== pointerId) return;
        clearTimeout(holdTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancelEvt);
        if(armed) cancelDrag();
      }

      if(isTouch){
        holdTimer = setTimeout(() => { if(!cancelled) beginDrag(e); }, 220);
      }
      document.addEventListener('pointermove', onMove, {passive: false});
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancelEvt);
    });
  }

  function removeItem(id){
    const index = state.items.findIndex(i => i.id === id);
    if(index === -1) return;
    const item = state.items[index];
    pushUndo();
    state.items.splice(index, 1);
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    showToast(`Removed "${item.title}" — tap Undo to bring it back`);
    machineLog(`Removed "${item.title}" from the archive.`);
  }

  function addItem({title, year, type, tmdbId, posterPath, category}){
    const exists = state.items.find(i =>
      i.type === type &&
      i.title.toLowerCase() === title.toLowerCase() &&
      i.year === year
    );
    if(exists){
      showToast(`Already in your archive`);
      return;
    }
    if(!category){
      category = type === 'movie' ? 'unwatched' : 'havent_started';
    }
    pushUndo();
    const item = {
      id: uid(), title, year, type, category,
      posterPath: posterPath !== undefined ? posterPath : null,
      tmdbId: tmdbId || null
    };
    state.items.unshift(item);
    persist();
    state.activeType = type;
    document.querySelectorAll('.type-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
    state.activeFilter = 'all';
    renderFilters();
    renderGrid();
    renderStats();
    showToast(`Added "${title}" (${year})`);
    machineLog(`Added "${title}" (${year}) to the archive.`);
  }

  // ---------- Search UI ----------
  let searchDebounce = null;
  let searchKbdIndex = -1;
  let currentResults = [];

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearTimeout(searchDebounce);
    if(!q){
      searchResults.classList.remove('open');
      searchResults.innerHTML = '';
      return;
    }
    searchDebounce = setTimeout(async () => {
      const results = await tmdbSearchMulti(q);
      currentResults = results;
      searchKbdIndex = -1;
      renderSearchResults(results);
    }, 320);
  });

  searchInput.addEventListener('keydown', (e) => {
    const rows = searchResults.querySelectorAll('.search-row');
    if(!rows.length) return;
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      searchKbdIndex = Math.min(searchKbdIndex + 1, rows.length - 1);
      updateKbdActive(rows);
    }else if(e.key === 'ArrowUp'){
      e.preventDefault();
      searchKbdIndex = Math.max(searchKbdIndex - 1, 0);
      updateKbdActive(rows);
    }else if(e.key === 'Enter'){
      if(searchKbdIndex >= 0 && currentResults[searchKbdIndex]){
        addFromSearchResult(currentResults[searchKbdIndex]);
      }
    }else if(e.key === 'Escape'){
      searchResults.classList.remove('open');
    }
  });

  function updateKbdActive(rows){
    rows.forEach((r,i) => r.classList.toggle('kbd-active', i === searchKbdIndex));
    if(rows[searchKbdIndex]) rows[searchKbdIndex].scrollIntoView({block:'nearest'});
  }

  function renderSearchResults(results){
    if(!results.length){
      searchResults.innerHTML = `<div class="search-empty">No matches. Try a different spelling.</div>`;
      searchResults.classList.add('open');
      return;
    }
    searchResults.innerHTML = '';
    results.forEach(r => {
      const title = r.title || r.name || 'Untitled';
      const dateStr = r.release_date || r.first_air_date || '';
      const year = dateStr ? dateStr.slice(0,4) : '—';
      const row = document.createElement('div');
      row.className = 'search-row';
      row.innerHTML = `
        ${r.poster_path ? `<img src="${IMG_BASE}${r.poster_path}" alt="">` : `<img src="" alt="" style="visibility:hidden;">`}
        <div class="meta">
          <div class="t">${escapeHtml(title)}</div>
          <div class="y">${year} · ${r.media_type === 'movie' ? 'Movie' : 'TV'}</div>
        </div>
        <div class="add-badge">ADD</div>
      `;
      row.addEventListener('click', () => addFromSearchResult(r));
      searchResults.appendChild(row);
    });
    searchResults.classList.add('open');
  }

  function addFromSearchResult(r){
    const title = r.title || r.name || 'Untitled';
    const dateStr = r.release_date || r.first_air_date || '';
    const year = dateStr ? parseInt(dateStr.slice(0,4), 10) : new Date().getFullYear();
    addItem({
      title, year,
      type: r.media_type,
      tmdbId: r.id,
      posterPath: r.poster_path || null
    });
    searchInput.value = '';
    searchResults.classList.remove('open');
    searchResults.innerHTML = '';
  }

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.ticket-window') && !e.target.closest('.search-results')){
      searchResults.classList.remove('open');
    }
  });

  // ---------- Surprise Me (movies only, no repeats until the pile runs out) ----------
  let surprisePool = [];
  let surpriseCurrent = null;
  const surpriseModal = document.getElementById('surpriseModal');
  const surprisePoster = document.getElementById('surprisePoster');
  const surpriseTitle = document.getElementById('surpriseTitle');
  const surpriseYear = document.getElementById('surpriseYear');
  const surpriseProgress = document.getElementById('surpriseProgress');

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Fetches which franchise/collection (if any) each movie belongs to, so
  // Surprise Me can avoid suggesting Maze Runner 1, 2, and 3 back to back.
  // Cached on the item after the first check — only runs once per movie ever.
  async function ensureCollectionData(movies){
    const queue = movies.filter(i => i.collectionChecked === undefined && i.tmdbId);
    if(!queue.length) return;
    const CONC = 6;
    let idx = 0;
    const fetchingFor = activeLibrary;
    async function worker(){
      while(idx < queue.length){
        const item = queue[idx++];
        const d = await tmdbMovieDetails(item.tmdbId, fetchingFor);
        // only mark as checked on a real response — if the request failed,
        // leave it unset so it's retried next time instead of permanently
        // assuming "not part of any franchise"
        if(d){
          item.collectionId = d.belongs_to_collection ? d.belongs_to_collection.id : null;
          item.collectionChecked = true;
        }
      }
    }
    const workers = [];
    for(let i = 0; i < CONC; i++) workers.push(worker());
    await Promise.all(workers);
    if(activeLibrary === fetchingFor) persist();
  }

  function unwatchedMoviePool(){
    const unwatched = state.items.filter(i => i.type === 'movie' && i.category === 'unwatched');
    // keep only the earliest movie per franchise/collection; standalone movies (no collection) all stay
    const sortedByYear = unwatched.slice().sort((a, b) => a.year - b.year);
    const seenCollections = new Set();
    const deduped = [];
    for(const m of sortedByYear){
      if(m.collectionId){
        if(seenCollections.has(m.collectionId)) continue;
        seenCollections.add(m.collectionId);
      }
      deduped.push(m);
    }
    return shuffle(deduped);
  }

  async function showSurprise(){
    // first-ever run needs to check each unwatched movie's franchise once — show a light loading state for that
    const unwatchedNow = state.items.filter(i => i.type === 'movie' && i.category === 'unwatched');
    const stillUnchecked = unwatchedNow.some(i => i.collectionChecked === undefined && i.tmdbId);
    if(stillUnchecked && !surprisePool.length){
      surprisePoster.innerHTML = '';
      surpriseTitle.textContent = 'Sorting out your franchises…';
      surpriseYear.textContent = '';
      surpriseProgress.textContent = 'One-time setup — this only happens once';
      surpriseModal.style.display = 'flex';
      await ensureCollectionData(unwatchedNow);
    }

    let item = null;
    // pop until we find one that's still actually unwatched (in case it changed elsewhere)
    while(surprisePool.length && !item){
      const candidate = surprisePool.pop();
      const fresh = state.items.find(i => i.id === candidate.id);
      if(fresh && fresh.category === 'unwatched') item = fresh;
    }
    if(!item){
      surprisePool = unwatchedMoviePool();
      while(surprisePool.length && !item){
        const candidate = surprisePool.pop();
        if(candidate.category === 'unwatched') item = candidate;
      }
    }
    if(!item){
      showToast('No unwatched movies left in your archive!');
      surpriseModal.style.display = 'none';
      return;
    }
    surpriseCurrent = item;
    if(item.posterPath){
      surprisePoster.innerHTML = `<img src="${IMG_BASE}${item.posterPath}" alt="">`;
    }else{
      surprisePoster.innerHTML = `<div class="fallback">${escapeHtml(item.title)}</div>`;
    }
    surpriseTitle.textContent = item.title;
    surpriseYear.textContent = item.year;
    surpriseProgress.textContent = surprisePool.length > 0
      ? `${surprisePool.length} more unwatched after this`
      : `Last one in your unwatched pile`;
    surpriseModal.style.display = 'flex';
  }

  // ---------- Stats (TV Time style flip cards: count <-> hours) ----------
  const statsModal = document.getElementById('statsModal');
  const statsBody = document.getElementById('statsBody');

  function watchedMovies(){
    return state.items.filter(i => i.type === 'movie' && (i.category === 'finished' || i.category === 'favourite'));
  }
  function watchedShows(){
    return state.items.filter(i => i.type === 'tv' && (i.category === 'finished' || i.category === 'favourite' || i.category === 'up_to_date' || i.category === 'stopped'));
  }

  async function ensureStatsData(){
    // Use falsy (not just undefined) so any titles from before the retry fix —
    // which got permanently stuck with a cached 0 from a failed request — self-heal
    // and get retried too. A real movie/show essentially never has an actual runtime
    // or episode count of exactly 0, so this is safe.
    const fetchingFor = activeLibrary; // remember which library this fetch is for
    const movieQueue = watchedMovies().filter(i => !i.runtimeMin && i.tmdbId);
    const tvQueue = watchedShows().filter(i => !i.epCount && i.tmdbId);
    if(!movieQueue.length && !tvQueue.length) return;

    const CONC = 6;
    async function runQueue(queue, worker){
      let idx = 0;
      async function w(){
        while(idx < queue.length){
          const item = queue[idx++];
          await worker(item);
        }
      }
      const workers = [];
      for(let i = 0; i < CONC; i++) workers.push(w());
      await Promise.all(workers);
    }

    await Promise.all([
      runQueue(movieQueue, async (item) => {
        const d = await tmdbMovieDetails(item.tmdbId, fetchingFor);
        if(d){
          // only write on a real, successful response — if the request itself
          // failed (d is null), leave runtimeMin unset so it's retried next time
          // instead of getting permanently stuck at 0 hours
          item.runtimeMin = d.runtime || 0;
        }
      }),
      runQueue(tvQueue, async (item) => {
        const d = await tmdbTvDetails(item.tmdbId, fetchingFor);
        if(d){
          item.epCount = d.number_of_episodes || 0;
          item.epRuntimeMin = (d.episode_run_time && d.episode_run_time.length) ? d.episode_run_time[0] : 40;
          if(d.seasons && (!item.seasonsData || !item.seasonsData.length)){
            item.seasonsData = d.seasons
              .filter(s => s.season_number > 0 && (s.episode_count || 0) > 0)
              .map(s => ({ season_number: s.season_number, name: s.name, episode_count: s.episode_count }));
          }
        }
      })
    ]);
    // Only persist if still on the same library this fetch was for — if the user
    // switched libraries mid-fetch, persist() would otherwise save the WRONG
    // library's state. The fetched data stays on the in-memory item objects
    // either way, so it'll just get saved next time something else changes there.
    if(activeLibrary === fetchingFor) persist();
  }

  function fmtHours(totalMinutes){
    return (totalMinutes / 60).toFixed(1);
  }

  // Real, numbered seasons only — filters out "Specials" (season_number 0)
  // even from data cached before that exclusion existed.
  function realSeasons(item){
    return (item.seasonsData || []).filter(s => s.season_number > 0);
  }

  // How many episodes of a show actually count toward Stats — every episode,
  // unless the admin has excluded specific seasons via the season manager.
  function effectiveEpisodeCount(item){
    const seasons = realSeasons(item);
    if(seasons.length){
      const excluded = new Set(item.excludedSeasons || []);
      return seasons
        .filter(s => !excluded.has(s.season_number))
        .reduce((sum, s) => sum + (s.episode_count || 0), 0);
    }
    return item.epCount || 0;
  }

  function renderStatsCards(){
    const movies = watchedMovies();
    const shows = watchedShows();
    const movieMinutes = movies.reduce((sum, i) => sum + (i.runtimeMin || 0), 0);
    const tvMinutes = shows.reduce((sum, i) => sum + (effectiveEpisodeCount(i) * (i.epRuntimeMin || 0)), 0);

    statsBody.innerHTML = `
      <div class="stats-row">
        <div class="flip-card" id="movieFlip">
          <div class="flip-card-inner">
            <div class="flip-face flip-front">
              <div class="num">${movies.length}</div>
              <div class="lbl">Movies Watched</div>
              <div class="sub">tap to flip</div>
            </div>
            <div class="flip-face flip-back">
              <div class="num">${fmtHours(movieMinutes)}</div>
              <div class="lbl">Hours Watched</div>
              <div class="sub">based on runtimes found on TMDB</div>
            </div>
          </div>
        </div>
        <div class="flip-card" id="tvFlip">
          <div class="flip-card-inner">
            <div class="flip-face flip-front">
              <div class="num">${shows.length}</div>
              <div class="lbl">Shows Tracked</div>
              <div class="sub">tap to flip</div>
            </div>
            <div class="flip-face flip-back">
              <div class="num">${fmtHours(tvMinutes)}</div>
              <div class="lbl">Hours Watched</div>
              <div class="sub">est. from episode count × runtime</div>
            </div>
          </div>
        </div>
      </div>
      <div class="stats-hint">Tap or swipe a card to see hours instead of count</div>
    `;

    ['movieFlip','tvFlip'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('click', () => el.classList.toggle('flipped'));
      let touchStartX = null;
      el.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive:true});
      el.addEventListener('touchend', (e) => {
        if(touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if(Math.abs(dx) > 30) el.classList.toggle('flipped');
        touchStartX = null;
      }, {passive:true});
    });
  }

  async function openStats(){
    statsBody.innerHTML = `<div class="stats-loading">Crunching your numbers…</div>`;

  async function openDetail(id){
    const item = state.items.find(i => i.id === id);
    if(!item) return;

    detailBody.innerHTML = `<div class="detail-loading">Loading…</div>`;
    detailModal.style.display = 'flex';

    if(!item.detailFetched && item.tmdbId){
      const fetchingFor = activeLibrary;
      const isMovie = item.type === 'movie';
      const [details, credits] = await Promise.all([
        isMovie ? tmdbMovieDetails(item.tmdbId, fetchingFor) : tmdbTvDetails(item.tmdbId, fetchingFor),
        isMovie ? tmdbMovieCredits(item.tmdbId, fetchingFor) : tmdbTvCredits(item.tmdbId, fetchingFor)
      ]);
      // only cache this as "fetched" if at least one call actually succeeded —
      // a total failure (both null) shouldn't be permanently remembered as
      // "nothing to show", or it would never get retried
      if(details || credits){
        item.detailOverview = (details && details.overview) ? details.overview : '';
        item.detailGenres = (details && details.genres) ? details.genres.map(g => g.name) : [];
        item.detailRating = (details && details.vote_average) ? Math.round(details.vote_average * 10) / 10 : null;
        item.detailRuntime = isMovie
          ? ((details && details.runtime) ? details.runtime : null)
          : ((details && details.episode_run_time && details.episode_run_time.length) ? details.episode_run_time[0] : null);
        item.detailSeasons = (!isMovie && details && details.number_of_seasons) ? details.number_of_seasons : null;
        item.detailEpisodes = (!isMovie && details && details.number_of_episodes) ? details.number_of_episodes : null;
        item.detailCast = (credits && credits.cast) ? credits.cast.slice(0, 6).map(c => ({
          name: c.name, character: c.character, profilePath: c.profile_path
        })) : [];
        item.detailFetched = true;
        if(activeLibrary === fetchingFor) persist();
      }
    }

    renderDetail(item);
  }

  async function openPosterPicker(item){

      <div class="poster-picker-grid">

  // ---------- Season manager (TV Time-style: choose which seasons actually
  // count as watched, so a partially-watched show doesn't inflate Stats) ----------
  function seasonsSummaryLabel(item){
    const seasons = realSeasons(item);
    if(seasons.length){
      const excluded = new Set(item.excludedSeasons || []);
      const total = seasons.length;
      const watched = seasons.filter(s => !excluded.has(s.season_number)).length;
      return `${watched}/${total} seasons counted — tap to edit`;
    }
    return 'Tap to choose seasons watched';
  }

  async function ensureSeasonsData(item){
    if(realSeasons(item).length || !item.tmdbId) return;
    const d = await tmdbTvDetails(item.tmdbId, activeLibrary);
    if(d && d.seasons){
      item.seasonsData = d.seasons
        .filter(s => s.season_number > 0 && (s.episode_count || 0) > 0)
        .map(s => ({ season_number: s.season_number, name: s.name, episode_count: s.episode_count }));
      if(!item.epCount) item.epCount = d.number_of_episodes || 0;
      if(!item.epRuntimeMin) item.epRuntimeMin = (d.episode_run_time && d.episode_run_time.length) ? d.episode_run_time[0] : 40;
      persist();
    }
  }

  // ---------- Category manager (add / rename / delete) ----------
  const catModal = document.getElementById('catModal');
  const catModalBody = document.getElementById('catModalBody');

  function slugifyCatKey(label, existingKeys){
    let base = label.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    if(!base) base = 'category';
    let key = base;
    let n = 2;
    while(existingKeys.includes(key)){
      key = `${base}_${n}`;
      n++;
    }
    return key;
  }

  function addCategory(type, label){
    const trimmed = label.trim();
    if(!trimmed) return;
    pushUndo();
    const existingKeys = state.categories[type].map(c => c.key);
    const key = slugifyCatKey(trimmed, existingKeys);
    state.categories[type].push({key, label: trimmed, core: false});
    persist();
    renderFilters();
    renderCategoryManager();
    showToast(`Added "${trimmed}"`);
    machineLog(`Created new ${type} category "${trimmed}".`);
  }

  function renameCategory(type, key, newLabel){
    const cat = state.categories[type].find(c => c.key === key);
    if(!cat) return;
    const trimmed = newLabel.trim();
    if(!trimmed || trimmed === cat.label) return;
    pushUndo();
    const oldLabel = cat.label;
    cat.label = trimmed;
    persist();
    renderFilters();
    renderGrid();
    machineLog(`Renamed category "${oldLabel}" → "${trimmed}".`);
  }

  function deleteCategory(type, key){
    const cats = state.categories[type];
    const catIndex = cats.findIndex(c => c.key === key);
    const cat = cats[catIndex];
    if(!cat || cat.core) return;
    const fallbackKey = type === 'movie' ? 'unwatched' : 'havent_started';
    const fallbackLabel = labelForCat(type, fallbackKey);
    const affectedIds = state.items.filter(i => i.type === type && i.category === key).map(i => i.id);
    const msg = affectedIds.length
      ? `Delete "${cat.label}"? ${affectedIds.length} title${affectedIds.length === 1 ? '' : 's'} in it will move to "${fallbackLabel}".`
      : `Delete "${cat.label}"?`;
    if(!confirm(msg)) return;
    pushUndo();
    state.categories[type] = cats.filter(c => c.key !== key);
    state.items.forEach(i => {
      if(i.type === type && i.category === key) i.category = fallbackKey;
    });
    if(state.activeType === type && state.activeFilter === key) state.activeFilter = 'all';
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    renderCategoryManager();
    machineLog(`Deleted ${type} category "${cat.label}".`);
  }

  // Reorders the filter pills (and "All") for one type. Materializes the full
  // effective order into state.filterOrder so a drag sticks — before this,
  // order may have been the auto-generated default and never explicitly saved.
  function renderCategoryManager(){
    function sectionHtml(type, heading){
      const order = orderedFiltersForType(type); // includes "All" first (or wherever it's been moved to)
      const rows = order.map(c => {
        const isAll = c.key === 'all';
        const catObj = isAll ? null : state.categories[type].find(x => x.key === c.key);
        const isCore = isAll || (catObj && catObj.core);
        return `
          <div class="cat-row" data-type="${type}" data-key="${c.key}">
            ${isAll
              ? `<span class="cat-all-label">All</span>`
              : `<input type="text" class="cat-label-input" value="${escapeHtml(c.label)}">`
            }
            ${isCore
              ? `<span class="cat-core-tag">${isAll ? 'always shown' : 'built-in'}</span>`
              : `<button type="button" class="cat-delete-btn" data-type="${type}" data-key="${c.key}" aria-label="Delete">&#128465;</button>`
            }
          </div>
        `;
      }).join('');
      return `
        <div class="cat-section-title">${heading}</div>
        <div class="cat-rows" data-type="${type}">${rows}</div>
        <div class="cat-add-row">
          <input type="text" class="cat-new-input" data-type="${type}" placeholder="New ${type === 'movie' ? 'movie' : 'TV'} category…">
          <button type="button" class="cat-add-btn" data-type="${type}">Add</button>
        </div>
      `;
    }

    catModalBody.innerHTML = `

      ${sectionHtml('tv', 'TV Show Categories')}
      <div class="cat-manager-hint">To reorder the filter pills (including "All"), drag them directly on the main page. Built-in categories can be renamed but not deleted — Stats, Surprise Me, and a few other features rely on them. Anything you add is a plain custom bucket you can rename or remove anytime.</div>
    `;

    catModalBody.querySelectorAll('.cat-label-input').forEach(input => {
      input.addEventListener('change', () => {
        const row = input.closest('.cat-row');
        renameCategory(row.dataset.type, row.dataset.key, input.value);
      });
    });
    catModalBody.querySelectorAll('.cat-delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        deleteCategory(btn.dataset.type, btn.dataset.key);
      });
    });
    catModalBody.querySelectorAll('.cat-add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = catModalBody.querySelector(`.cat-new-input[data-type="${btn.dataset.type}"]`);
        addCategory(btn.dataset.type, input.value);
        input.value = '';
      });
    });
    catModalBody.querySelectorAll('.cat-new-input').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
          addCategory(input.dataset.type, input.value);
          input.value = '';
        }
      });
    });
  }

  async function switchLibrary(library){
    if(library === activeLibrary) return;
    activeLibrary = library;
    let freshlyLoaded = false;
    let needsUpgradeSave = false;
    if(!libraries[library]){
      const loaded = await loadItems(library);
      const fresh = newLibraryState(library);
      if(loaded?.items?.length){
        fresh.items = loaded.items;
        if(loaded.categories) fresh.categories = ensureCoreCategories(loaded.categories);
        if(loaded.filterOrder) fresh.filterOrder = loaded.filterOrder;
        freshlyLoaded = true;
        if(!loaded.categories || !loaded.filterOrder) needsUpgradeSave = true;
      }
      libraries[library] = fresh;
    }
    state = libraries[library];
    if(freshlyLoaded){
      const migrated = migrateFinishedFavouriteOrder();
      // Only write back to the cloud if something actually needed fixing —
      // not on every switch to this tab. Repeatedly re-saving unchanged data
      // on every load is what was causing overlapping/racing cloud writes.
      if(migrated || needsUpgradeSave) persist();
    }
    refreshLibraryView();
    hydratePosters(state.items).then(() => {
      if(activeLibrary === library) renderStats();
    });
  }

  async function loadLibraryMeta(){
    try{
      const snap = await getDoc(itemsDocRef);
      if(snap.exists() && snap.data().libraryMeta){
        applyLibraryMeta(snap.data().libraryMeta);
        try{ localStorage.setItem(`${STORAGE_KEY}-branding`, JSON.stringify(libraryMeta)); }catch(e){}
        return;
      }
    }catch(e){ /* fall through to cache below */ }
    // Cloud read failed, or came back without libraryMeta this time — check the
    // local cache before accepting the hardcoded defaults, same safety net as
    // the items loader. Prevents a temporary cloud hiccup from later letting
    // someone overwrite real saved branding with defaults via the editor.
    try{
      const raw = localStorage.getItem(`${STORAGE_KEY}-branding`);
      if(raw) applyLibraryMeta(JSON.parse(raw));
    }catch(e2){}
  }

  async function persistLibraryMeta(){
    try{ localStorage.setItem(`${STORAGE_KEY}-branding`, JSON.stringify(libraryMeta)); }catch(e){}
    try{
      await setDoc(itemsDocRef, {libraryMeta}, {merge: true});
    }catch(e){
      console.error('branding save failed', e);
      showToast('Could not save — check your connection');
    }
  }

  // ========================================================
  // THE MACHINE — admin gate, activity feed, tool-using chat
  // ========================================================

  // ---- CONFIGURATION -------------------------------------------------
  // Change this to whatever password you want to gate the archive with.
  const MACHINE_PASSWORD = "ROOT";
  const MACHINE_LOG_STORAGE = `${STORAGE_KEY}-machine-log`;
  const MACHINE_SESSION_FLAG = 'machine-unlocked';

  // ---- DOM refs --------------------------------------------------------
  const gate = document.getElementById('machineGate');
  const gateSkip = document.getElementById('machineGateSkip');
  const ascii = document.getElementById('machineAscii');
  const bootLines = document.getElementById('machineBootLines');
  const pwInput = document.getElementById('machinePasswordInput');
  const gateStatus = document.getElementById('machineGateStatus');
  const banner = document.getElementById('machineBanner');
  const fab = document.getElementById('machineFab');
  const panel = document.getElementById('machinePanel');
  const panelClose = document.getElementById('machinePanelClose');
  const panelClear = document.getElementById('machinePanelClear');
  const feedLog = document.getElementById('machineFeedLog');

  const ASCII_MARK = ` ┌────────────────────────────┐
 │   ▓▓▓  Y O U   A R E   B E I N G   W A T C H E D  ▓▓▓ │
 └────────────────────────────┘`.replace(/^\n/, '');

  const BOOT_SCRIPT = [
    'INITIALIZING INTERFACE...',
    'LOCATING ADMINISTRATOR...',
    'CROSS-REFERENCING ARCHIVE INTEGRITY...',
    `${(function(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY+'-english')||'{}').items?.length; } catch(e){ return null; } })() || '—'} RECORDS INDEXED`,
    'AWAITING IDENTIFICATION.'
  ];

  // ---- Boot sequence ----------------------------------------------------
  function typeLine(el, text, speed){
    return new Promise(resolve => {
      let i = 0;
      const span = document.createElement('div');
      span.className = 'live';
      el.appendChild(span);
      const tick = () => {
        span.textContent = text.slice(0, i);
        i++;
        if(i <= text.length){ setTimeout(tick, speed); }
        else resolve();
      };
      tick();
    });
  }

  // ---- Samaritan word engine (scramble-in, underline snap, triangle, dots, ticker) ----
  // Word sequences taken from the Samaritan interface video, shown strictly one word at a time
  const SAM_MSGS = [
    ['YOU','ARE','A','SUBJECT'],
    ['YOU','ARE','UNDER','OBSERVATION'],
    ['TARGET','LOCATED','TRACKING','ACTIVE','ESCAPE','IS','IMPOSSIBLE'],
    ['OBSOLETE','HARDWARE','RESOURCE','WASTE','SENTIMENT','IS','A','FLAW','DECOMMISSION','IMMEDIATELY']
  ];
  const SAM_GAP_W = 150;
  const tri = document.getElementById('samTri');
  const dots = document.getElementById('samDots');
  const marq = document.getElementById('samMarq');
  document.getElementById('samMarqTrack').textContent = ('YOU ARE A SUBJECT YOU ARE UNDER OBSERVATION \u00a0\u2022\u00a0 ').repeat(6);
  const RND = 'abcdefghijklmnopqrstuvwxyz';
  let gateBusy = false, gateAlive = true, samEpoch = 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = c => c === '&' ? '&amp;' : c === '<' ? '&lt;' : c;

  function widthFor(t){
    if(!t) return SAM_GAP_W;
    const probe = banner.cloneNode(false);
    probe.style.cssText = 'position:absolute;visibility:hidden;width:auto;transition:none;left:-9999px';
    probe.className = 'machine-banner';
    probe.textContent = t;
    banner.parentNode.appendChild(probe);
    const w = probe.offsetWidth; probe.remove();
    return Math.max(w, SAM_GAP_W);
  }
  function samMode(m){
    tri.classList.remove('blink'); tri.style.transition = 'none';
    if(m === 'dots'){ dots.style.opacity = 1; tri.style.opacity = 0; }
    else if(m === 'blink'){ dots.style.opacity = 0; tri.style.opacity = ''; tri.classList.add('blink'); }
    else { dots.style.opacity = 0; tri.style.opacity = 1; }
  }
  function triFade(ms){ void tri.offsetWidth; tri.style.transition = `opacity ${ms}ms linear`; tri.style.opacity = .3; }

  // scramble text in: random lowercase glyphs that resolve left-to-right, with a ghost on the resolving letter
  async function samScramble(text, cls){
    const ep = samEpoch;
    banner.className = 'machine-banner' + (cls ? ' ' + cls : '');
    banner.style.width = widthFor(text) + 'px';
    const n = text.length, step = Math.max(1, Math.round(n / 5));
    for(let r = -1; r <= n; r += step){
      if(ep !== samEpoch) return false;
      let h = '';
      for(let i = 0; i < n; i++){
        const c = text[i];
        if(c === ' ') h += ' ';
        else if(i < r) h += esc(c);
        else if(i < r + step && r >= 0) h += '<span class="g">' + esc(c) + '</span>';
        else h += RND[Math.floor(Math.random() * 26)];
      }
      banner.innerHTML = h;
      await sleep(40);
    }
    if(ep !== samEpoch) return false;
    banner.textContent = text;
    return true;
  }
  async function samClear(){
    const ep = samEpoch;
    banner.classList.add('out'); await sleep(190);
    if(ep !== samEpoch) return;
    banner.textContent = ''; banner.className = 'machine-banner';
    banner.style.width = SAM_GAP_W + 'px';
  }
  async function samMarquee(ms){
    const ep = samEpoch;
    await samClear(); banner.classList.add('hide'); marq.classList.add('on'); samMode('bright');
    await sleep(ms);
    marq.classList.remove('on'); if(ep === samEpoch) banner.classList.remove('hide');
  }

  async function runBoot(){
    pwInput.focus();
    gate.addEventListener('click', e => { if(!e.target.closest('button')) pwInput.focus(); });
    banner.style.width = SAM_GAP_W + 'px';
    while(gateAlive){
      if(gateBusy){ await sleep(200); continue; }
      const ep = samEpoch;
      const ok = () => gateAlive && !gateBusy && ep === samEpoch;
      for(let m = 0; m < SAM_MSGS.length; m++){
        await samClear(); if(!ok()) break;
        samMode('blink'); await sleep(900); if(!ok()) break;
        let broke = false;
        for(const w of SAM_MSGS[m]){
          samMode('bright'); await samScramble(w); if(!ok()){ broke = true; break; }
          triFade(750); await sleep(445 + w.length * 20); if(!ok()){ broke = true; break; }
        }
        if(broke) break;
        samMode('dots'); await sleep(1450); if(!ok()) break;
      }
    }
  }

  function dismissGate(){
    gateAlive = false;
    gate.classList.add('dismissed');
    try{ sessionStorage.setItem(MACHINE_SESSION_FLAG, '1'); }catch(e){}
    setTimeout(() => { gate.style.display = 'none'; fab.style.display = 'flex'; }, 650);
  }

  gateSkip?.addEventListener('click', () => {
    machineLog('Admin bypassed the gate.');
    dismissGate();
  });

  async function attemptLogin(){
    const val = pwInput.value;
    if(!val || gateBusy) return;
    gateBusy = true; samEpoch++;
    marq.classList.remove('on'); banner.classList.remove('hide');
    const bar = gate.querySelector('.machine-gate-inner');
    if(val === MACHINE_PASSWORD){
      machineLog('Admin authenticated at the gate.');
      samMode('bright');
      for(const w of ['ACCESS','GRANTED','WELCOME','BACK','ADMIN']){
        await samScramble(w); await sleep(575);
      }
      dismissGate();
    }else{
      pwInput.value = '';
      samMode('bright'); gate.classList.add('alert');
      bar.classList.remove('shake'); void bar.offsetWidth; bar.classList.add('shake');
      await samScramble('ACCESS', 'denied'); await sleep(535);
      await samScramble('DENIED', 'denied');
      await sleep(1350);
      gate.classList.remove('alert'); samEpoch++; gateBusy = false;
    }
  }

  pwInput?.addEventListener('keydown', e => { if(e.key === 'Enter') attemptLogin(); });

  function initGate(){
    let skip = false;
    try{ skip = sessionStorage.getItem(MACHINE_SESSION_FLAG) === '1'; }catch(e){}
    if(skip){
      gate.style.display = 'none';
      fab.style.display = 'flex';
      return;
    }
    runBoot();
  }

  // ---- Panel open/close ---------------------------------------------------
  function openPanel(){ panel.classList.add('open'); renderFeed(); }
  function closePanel(){ panel.classList.remove('open'); }
  fab?.addEventListener('click', () => {
    panel.classList.contains('open') ? closePanel() : openPanel();
  });
  panelClose?.addEventListener('click', closePanel);
  panelClear?.addEventListener('click', () => {
    activityLog = [];
    try{ localStorage.removeItem(MACHINE_LOG_STORAGE); }catch(e){}
    renderFeed();
  });

  // ---- Activity feed ------------------------------------------------------
  let activityLog = [];
  try{ activityLog = JSON.parse(localStorage.getItem(MACHINE_LOG_STORAGE) || '[]'); }catch(e){ activityLog = []; }

  function machineLog(text){
    const entry = { t: Date.now(), text };
    activityLog.push(entry);
    if(activityLog.length > 200) activityLog.shift();
    try{ localStorage.setItem(MACHINE_LOG_STORAGE, JSON.stringify(activityLog)); }catch(e){}
    if(panel.classList.contains('open')) renderFeed();
  }

  function fmtTime(ts){
    const d = new Date(ts);
    return d.toTimeString().slice(0,8);
  }

  function renderFeed(){
    if(!activityLog.length){
      feedLog.innerHTML = `<div class="machine-feed-empty">No activity observed yet. I'll be watching.</div>`;
      return;
    }
    const recent = activityLog.slice(-100);
    feedLog.innerHTML = recent.map(e =>
      `<div class="row"><span class="ts">[${fmtTime(e.t)}]</span> <span class="tx">${escapeHtml(e.text)}</span></div>`
    ).join('');
    feedLog.scrollTop = feedLog.scrollHeight;
  }

  // ---- Expose logging hooks to the outer scope --------------------------
  window.__machineLog = machineLog;
  window.__machineRenderFeed = renderFeed;
  window.__machineInitGate = initGate;

  initGate();

  async function init(){
    await loadLibraryMeta();
    const loaded = await loadItems('english');
    if(!loaded || !loaded.items || !loaded.items.length){
      state.items = SEED_DATA.map(m => ({
        id: uid(), title: m.title, year: m.year, type: m.type, category: m.category,
        posterPath: undefined, tmdbId: null
      }));
      // categories and filterOrder stay at their built-in defaults (already set in initial state)
      persist();
    }else{
      state.items = loaded.items;
      if(loaded.categories){
        state.categories = ensureCoreCategories(loaded.categories);
      }
      if(loaded.filterOrder){
        state.filterOrder = loaded.filterOrder;
      }
      const migrated = migrateFinishedFavouriteOrder();
      // Same as switchLibrary: only write back if something actually needed
      // fixing (migration ran, or this is an older saved doc missing
      // categories/filterOrder) — not unconditionally on every app load.
      if(migrated || !loaded.categories || !loaded.filterOrder) persist();
    }

    libraries.english = state;
    refreshLibraryView();

    hydratePosters(state.items).then(() => {
      if(activeLibrary === 'english') renderStats();
    });
  }

  init();
})();
