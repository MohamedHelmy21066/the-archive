<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>try{var gp=function(v){var m=/^([01])(?::(\d+))?$/.exec(v||'');return m?{o:m[1]==='1',t:+(m[2]||0)}:null;};var ga=gp(localStorage.getItem('archive-gate-off'));var gc=document.cookie.match(/(?:^|; )archive_gate_off=([^;]*)/);var gb=gc?gp(decodeURIComponent(gc[1])):null;var gn=(ga&&gb)?(gb.t>ga.t?gb:ga):(ga||gb);if(gn&&gn.o)document.documentElement.classList.add('no-gate');}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Archive">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141c;
    --bg-raise:#181b26;
    --card:#1d2130;
    --card-hover:#242938;
    --gold:#d4a73d;
    --gold-dim:#8a712f;
    --brick:#c2452d;
    --ink:#ede7da;
    --ink-dim:#9296a6;
    --ink-faint:#5c6070;
    --line:#2a2f42;
    --radius:6px;
    --shadow: 0 12px 28px -12px rgba(0,0,0,0.65);
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Source Sans 3', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* keep the scrollbar space reserved so the page never shifts sideways between short and long categories */
  html{ scrollbar-gutter:stable; }
  @supports not (scrollbar-gutter:stable){ html{ overflow-y:scroll; } }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--gold); color:#12141c;}

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  /* ========================================================
     THE MACHINE — admin gate, floating access point, panel
     ======================================================== */
  :root{
    --m-bg: #040806;
    --m-panel: #060f0a;
    --m-green: #6fffb0;
    --m-green-bright: #b8ffd9;
    --m-green-dim: #275a3f;
    --m-amber: #e8c15a;
    --m-line: #16362578;
    --m-font: 'IBM Plex Mono', monospace;
  }

  /* ===== SAMARITAN GATE ===== */
  .machine-gate{
    position:fixed; inset:0; z-index:9000; overflow:hidden;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.045) 0px, rgba(0,0,0,0.045) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% 45%, #f4f6f4 0%, #e4e7e4 45%, #c9cdca 100%);
    color:#0a0a0a; font-family:'Montserrat','Questrial','Helvetica Neue',Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; transition:opacity .6s ease; cursor:text;
  }
  .machine-gate.dismissed{ opacity:0; pointer-events:none; }
  .sam-icon{ position:absolute; top:22px; width:22px; height:22px; color:#8a8d8b; }
  .sam-icon.left{ left:24px; } .sam-icon.right{ right:24px; }
  .machine-gate-skip{
    position:absolute; top:16px; right:18px; z-index:2;
    background:none; border:none; color:#8a8d8b; cursor:pointer;
    font-size:26px; line-height:1; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; transition:color .2s;
  }
  .machine-gate-skip:hover{ color:#0a0a0a; }
  .sam-stage{ display:flex; flex-direction:column; align-items:center; gap:22px; }
  .machine-banner{
    display:inline-block; box-sizing:border-box; width:150px; text-align:center;
    transition:width .15s ease, color .18s ease, border-color .18s ease;
    font-weight:500; font-size:clamp(20px,2.7vw,34px); letter-spacing:.15em; text-indent:.15em;
    white-space:nowrap; max-width:94vw;
    padding:0 6px 8px; border-bottom:3px solid #0a0a0a;
    text-shadow:0 0 1px rgba(0,0,0,.4);
    box-shadow:0 18px 26px -18px rgba(0,0,0,.28);
    min-height:1.3em; line-height:1.3;
  }
  .machine-banner.out{ color:transparent; text-shadow:none; }
  .machine-banner.hide{ visibility:hidden; }
  .machine-banner .g{ opacity:.4; }
  .machine-banner.denied{ color:#d90f0f; border-color:#d90f0f; }
  .sam-stage{ position:relative; }
  .sam-slot{ position:relative; width:30px; height:26px; }
  .sam-tri{
    position:absolute; left:2px; top:0; width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent; border-bottom:25px solid #e10d0d;
  }
  .sam-tri.blink{ animation:sam-blink .8s ease-in-out infinite; }
  @keyframes sam-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.28; } }
  .machine-gate.alert .sam-tri{ animation:sam-alert .3s steps(1) infinite; }
  @keyframes sam-alert{ 50%{ opacity:.15; } }
  .sam-dots{ position:absolute; left:50%; top:5px; transform:translateX(-50%); display:flex; gap:7px; opacity:0; }
  .sam-dots i{ width:4px; height:4px; border-radius:50%; background:#222; animation:sam-dot 1s ease-in-out infinite; }
  .sam-dots i:nth-child(2){ animation-delay:.5s; }
  @keyframes sam-dot{ 0%,100%{ opacity:.2; } 50%{ opacity:1; } }
  .sam-marq{
    position:absolute; left:50%; top:0; width:100vw; transform:translateX(-50%); display:none; overflow:hidden;
    border-bottom:3px solid #0a0a0a; padding:0 0 8px; line-height:1.3;
    font-weight:500; font-size:clamp(20px,2.7vw,34px); letter-spacing:.15em; white-space:nowrap;
    box-shadow:0 18px 26px -18px rgba(0,0,0,.28);
  }
  .sam-marq.on{ display:block; }
  .sam-marq span{ display:inline-block; animation:sam-scroll 14s linear infinite; }
  @keyframes sam-scroll{ to{ transform:translateX(-50%); } }
  .machine-gate-inner{
    position:absolute; left:50%; bottom:28px; transform:translateX(-50%);
    width:min(92vw,420px); height:34px; box-sizing:border-box;
    display:flex; align-items:center; gap:10px; padding:0 10px;
    border:1.5px solid #6c6f6d; border-radius:6px; background:rgba(238,240,238,.7);
  }
  .machine-gate-inner svg{ width:16px; height:16px; flex:none; color:#555; }
  .machine-gate-inner svg.dim{ color:#a43a3a; }
  .machine-password-input{
    flex:1; min-width:0; background:transparent; border:none; outline:none; text-align:center;
    font-family:inherit; font-weight:600; font-size:13px; letter-spacing:.14em; color:#0a0a0a; text-transform:uppercase;
  }
  .machine-password-input::placeholder{ color:#a9acaa; }
  .machine-gate-inner.shake{ animation:sam-shake .4s; }
  @keyframes sam-shake{ 20%,60%{ transform:translateX(calc(-50% - 7px)); } 40%,80%{ transform:translateX(calc(-50% + 7px)); } }
  .machine-status{ display:none; }
  .machine-ascii,.machine-boot-lines{ display:none; }

  .machine-fab{
    position:fixed; right:20px; bottom:20px; z-index:850;
    width:52px; height:52px; border-radius:50%;
    background:var(--m-panel); border:1px solid var(--m-green-dim);
    color:var(--m-green); font-family:var(--m-font); font-size:20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 0 0 0 rgba(111,255,176,0.35);
    animation:m-pulse 3.2s ease-in-out infinite;
  }
  .machine-fab:hover{ border-color:var(--m-green); }
  @keyframes m-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(111,255,176,0.25); }
    50%{ box-shadow:0 0 0 8px rgba(111,255,176,0); }
  }
  .machine-fab .dot{
    width:9px; height:9px; border-radius:50%; background:var(--m-green);
  }

  .machine-panel{
    position:fixed; right:16px; bottom:84px; z-index:900;
    width:min(380px, calc(100vw - 32px)); height:min(560px, calc(100vh - 120px));
    background:var(--m-panel); border:1px solid var(--m-green-dim);
    color:var(--m-green); font-family:var(--m-font);
    display:flex; flex-direction:column;
    transform:translateY(12px) scale(0.98); opacity:0; pointer-events:none;
    transition:transform .2s ease, opacity .2s ease;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
  }
  .machine-panel.open{ transform:none; opacity:1; pointer-events:auto; }
  .machine-panel-header{
    display:flex; align-items:center; gap:10px;
    padding:12px 12px 10px; border-bottom:1px solid var(--m-green-dim);
  }
  .machine-panel-title{ font-size:12px; letter-spacing:2px; color:var(--m-green-bright); flex:1; }
  .machine-panel-clear{
    background:none; border:1px solid var(--m-green-dim); color:var(--m-green-dim);
    font-family:var(--m-font); font-size:10px; letter-spacing:1px;
    padding:4px 8px; cursor:pointer;
  }
  .machine-panel-clear:hover{ color:var(--m-green); border-color:var(--m-green); }
  .machine-panel-close{
    background:none; border:none; color:var(--m-green-dim); font-size:18px;
    cursor:pointer; line-height:1; padding:2px 4px;
  }
  .machine-panel-close:hover{ color:var(--m-green); }
  .machine-panel-body{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .machine-view{ display:none; flex:1; min-height:0; flex-direction:column; }
  .machine-view.active{ display:flex; }

  .machine-feed-log{
    flex:1; overflow-y:auto; padding:10px 12px; font-size:11.5px; line-height:1.7;
    color:var(--m-green-dim);
  }
  .machine-feed-log .row{ opacity:0; animation:m-fadein .4s ease forwards; }
  .machine-feed-log .row .ts{ color:var(--m-green-dim); }
  .machine-feed-log .row .tx{ color:var(--m-green); }
  @keyframes m-fadein{ from{opacity:0; transform:translateY(-2px);} to{opacity:1; transform:none;} }
  .machine-feed-empty{ color:var(--m-green-dim); padding:14px 4px; font-size:12px; }

  @media (max-width:520px){
    .machine-panel{ right:10px; left:10px; width:auto; bottom:78px; height:min(70vh, 520px); }
    .machine-fab{ right:14px; bottom:14px; }
  }

  /* ---------- Sprocket strip (signature element) ---------- */
  .sprockets{
    height:14px;
    background-image: radial-gradient(circle, var(--bg) 3.5px, transparent 3.6px);
    background-size: 22px 14px;
    background-position: 8px center;
    background-color: var(--gold-dim);
    opacity:0.55;
  }

  /* ---------- Header / marquee ---------- */
  header.marquee{
    background: linear-gradient(180deg, var(--bg-raise), var(--bg));
    padding: 30px 28px 22px;
    border-bottom: 1px solid var(--line);
  }
  .marquee-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .marquee-title{
    font-family:var(--font-display);
    font-size:clamp(36px, 5vw, 56px);
    letter-spacing:0.03em;
    line-height:0.9;
    color:var(--ink);
    margin:0;
  }
  #archiveTitlePart2{ color:var(--gold); }
  .marquee-sub{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:6px;
  }
  .library-tabs{
    display:inline-flex;
    margin-top:14px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
    background:var(--bg);
  }
  .library-tab{
    border:0;
    border-radius:999px;
    padding:6px 13px;
    background:transparent;
    color:var(--ink-dim);
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .library-tab.active{ background:var(--brick); color:#fff7ec; }
  .edit-branding-btn{
    display:block; margin-top:10px; background:transparent; border:none;
    color:var(--ink-faint); font-family:var(--font-mono); font-size:10px;
    letter-spacing:0.04em; cursor:pointer; padding:2px 0;
  }
  .edit-branding-btn:hover{ color:var(--gold-dim); }
  .branding-modal-card{ max-width:420px; text-align:left; }
  .branding-field{ margin-bottom:14px; }
  .branding-field label{
    display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--gold-dim); margin-bottom:6px;
  }
  .branding-field input{
    width:100%; background:var(--card); border:1px solid var(--line); border-radius:4px;
    color:var(--ink); font-family:var(--font-body); font-size:13px; padding:8px 10px;
    box-sizing:border-box;
  }
  .branding-field input:focus{ outline:none; border-color:var(--gold-dim); }
  .branding-section-title{
    font-family:var(--font-display); font-size:16px; color:var(--gold);
    margin:18px 0 10px;
  }
  .branding-section-title:first-child{ margin-top:0; }
  .branding-save-btn{
    width:100%; margin-top:6px; background:var(--gold); color:var(--bg); border:none;
    border-radius:4px; padding:10px; font-family:var(--font-mono); font-size:12px;
    letter-spacing:0.05em; text-transform:uppercase; font-weight:600; cursor:pointer;
  }
  .branding-save-btn:hover{ opacity:0.9; }
  .stat-strip{
    display:flex;
    gap:22px;
    font-family:var(--font-mono);
  }
  .stat{
    text-align:right;
  }
  .stat-num{
    font-size:22px;
    color:var(--gold);
    line-height:1;
  }
  .stat-label{
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:4px;
  }

  /* ---------- Controls ---------- */
  .controls{
    max-width:1180px;
    margin:24px auto 0;
    padding:0 28px;
  }

  .type-tabs{
    display:inline-flex;
    background:var(--bg-raise);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
    margin-bottom:16px;
  }
  .type-tab{
    border:none;
    background:transparent;
    color:var(--ink-dim);
    font-family:var(--font-display);
    letter-spacing:0.04em;
    font-size:16px;
    padding:8px 22px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .type-tab.active{
    background:var(--gold);
    color:#181205;
  }

  /* ticket-window search */
  .ticket-window{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg-raise);
    border:1px dashed var(--gold-dim);
    border-radius:var(--radius);
    padding:12px 16px;
    margin-bottom:16px;
  }
  .ticket-window::before{
    content:"BOX OFFICE";
    position:absolute;
    top:-9px;
    left:14px;
    background:var(--bg);
    padding:0 8px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.14em;
    color:var(--gold-dim);
  }
  .ticket-window input{
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    padding:6px 4px;
  }
  .ticket-window input::placeholder{ color:var(--ink-faint); }
  .ticket-window input:focus{ outline:none; }
  .archive-search{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; margin-bottom:10px;
  }
  .archive-search .icon{ color:var(--gold-dim); font-size:14px; }
  .archive-search input{
    flex:1; background:transparent; border:none; color:var(--ink);
    font-family:var(--font-body); font-size:14px;
  }
  .archive-search input::placeholder{ color:var(--ink-faint); }
  .archive-search input:focus{ outline:none; }
  .archive-search .clear-btn{
    display:none; background:transparent; border:none; color:var(--ink-faint);
    font-size:16px; cursor:pointer; line-height:1; padding:0 2px;
  }
  .archive-search.has-text .clear-btn{ display:block; }

  .search-results{
    position:relative;
    margin:-10px 0 16px;
    background:var(--bg-raise);
    border:1px solid var(--line);
    border-radius:var(--radius);
    max-height:340px;
    overflow-y:auto;
    display:none;
  }
  .search-results.open{ display:block; }
  .search-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 14px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .search-row:last-child{ border-bottom:none; }
  .search-row:hover, .search-row.kbd-active{ background:var(--card-hover); }
  .search-row img{
    width:32px; height:48px; object-fit:cover; border-radius:3px; background:var(--card);
    flex-shrink:0;
  }
  .search-row .meta{ flex:1; min-width:0; }
  .search-row .meta .t{ font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .search-row .meta .y{ font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); }
  .search-row .add-badge{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em;
    color:var(--gold); border:1px solid var(--gold-dim); border-radius:4px; padding:3px 8px;
    flex-shrink:0;
  }
  .search-empty{ padding:16px; color:var(--ink-faint); font-size:13px; text-align:center; }

  .cat-chooser{ padding:10px 14px; }
  .cat-chooser-label{ font-size:12px; color:var(--ink-dim); margin-bottom:8px; }
  .cat-chooser-opts{ display:flex; flex-wrap:wrap; gap:6px; }
  .cat-chip{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--gold); background:transparent; border:1px solid var(--gold-dim); border-radius:999px;
    padding:6px 11px; cursor:pointer; transition:all 0.15s ease;
  }
  .cat-chip:hover{ background:var(--gold); color:var(--bg); border-color:var(--gold); }

  .filter-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .filter-pill{
    border:1px solid var(--line);
    background:var(--bg-raise);
    color:var(--ink-dim);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition: all 0.15s ease;
    white-space:nowrap;
  }
  .filter-pill:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .filter-pill.active{ background:var(--brick); border-color:var(--brick); color:#fff; }
  .filter-pill .count{ opacity:0.65; margin-left:4px; }
  .filter-pill{ touch-action:pan-y; user-select:none; }
  .filter-pill.pill-dragging{
    z-index:500; box-shadow:0 12px 26px rgba(0,0,0,0.45); cursor:grabbing;
    transition:none !important;
  }
  .pill-placeholder{
    background:transparent; border:2px dashed var(--gold-dim); box-shadow:none;
  }

  /* ---------- Grid ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:20px 28px 80px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap:16px 14px;
  }
  .grid.grouped{ display:block; }
  .cat-section{ margin-bottom:32px; }
  .cat-section-header{
    font-family:var(--font-display); font-size:20px; letter-spacing:0.02em; color:var(--gold);
    padding-bottom:9px; margin-bottom:14px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:8px;
  }
  .cat-section-count{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); font-weight:400;
  }
  .cat-section-grid{ margin-bottom:0; }
  .poster-card{
    position:relative;
    border-radius:var(--radius);
    aspect-ratio:2/3;
    cursor:pointer;
    transition: transform 0.18s ease;
  }
  .poster-card:hover{ transform:translateY(-3px); }
  /* smooth transitions when moving between tabs / categories */
  #grid{ transition:opacity .12s ease, transform .12s ease, filter .12s ease; }
  #grid.nav-out{ opacity:0; transform:translateY(8px); filter:blur(3px); }
  #grid.nav-in .poster-card{ animation:nav-card .45s cubic-bezier(.2,.7,.2,1) both; animation-delay:var(--d,0ms); }
  #grid.nav-in .cat-section-header{ animation:nav-fade .4s ease both; }
  @keyframes nav-card{ from{ opacity:0; transform:translateY(16px) scale(.97); } to{ opacity:1; transform:none; } }
  @keyframes nav-fade{ from{ opacity:0; transform:translateX(-8px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    #grid, #grid.nav-out{ transition:none; transform:none; filter:none; }
    #grid.nav-in .poster-card, #grid.nav-in .cat-section-header{ animation:none; }
  }
  /* TV Time-style status strip under the poster (English TV only):
     purple = finished & show ended, green = finished & still running, red = stopped */
  .tv-status-bar{ position:absolute; left:0; right:0; bottom:0; height:8px; z-index:6; pointer-events:none; }
  .tv-status-bar.purple{ background:#8a2be2; }
  .tv-status-bar.green{ background:#6cc22a; }
  .tv-status-bar.red{ background:#e0392b; }
  .poster-card.dragging{
    z-index:500; box-shadow:0 20px 40px rgba(0,0,0,0.5);
    transform:scale(1.06) rotate(-1.5deg); transition:none; cursor:grabbing;
  }
  .drag-placeholder{
    background:transparent; border:2px dashed var(--gold-dim); box-shadow:none;
  }
  /* Everything that needs rounded-corner clipping (art, caption gradient)
     lives in here — poster-card itself stays overflow:visible so the rank
     medal can hang off the corner instead of being cut off at the edge. */
  .poster-art{
    position:absolute; inset:0;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
  }
  .poster-card img{
    width:100%; height:100%; object-fit:cover; display:block;
    background:var(--card);
    -webkit-user-drag:none; user-drag:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  .poster-card{ touch-action:pan-y; }
  .poster-card .fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:10px;
    font-family:var(--font-display);
    font-size:15px;
    letter-spacing:0.02em;
    color:var(--ink-dim);
    background:linear-gradient(160deg, var(--card), var(--bg-raise));
  }
  .poster-card .skeleton{
    position:absolute; inset:0;
    background: linear-gradient(100deg, var(--card) 30%, var(--card-hover) 50%, var(--card) 70%);
    background-size:200% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
  }
  .poster-caption{
    position:absolute; left:0; right:0; bottom:0;
    padding:20px 8px 8px;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.88));
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .poster-card:hover .poster-caption, .poster-card:focus-within .poster-caption{ opacity:1; }
  .poster-caption .t{ font-size:12px; color:var(--ink); line-height:1.25; }
  .poster-caption .y{ font-size:10px; color:var(--gold); font-family:var(--font-mono); margin-top:2px; }

  .cat-select{
    margin-top:6px;
    width:100%;
    background:var(--bg-raise);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:4px;
    font-family:var(--font-mono);
    font-size:10px;
    padding:3px 4px;
    cursor:pointer;
  }
  .cat-select:hover{ border-color:var(--gold-dim); }
  .cat-select:focus{ outline:none; border-color:var(--gold); }

  .rank-select{
    margin-top:5px;
    width:100%;
    background:var(--bg-raise);
    color:var(--ink);
    border:1px solid var(--gold-dim);
    border-radius:4px;
    font-family:var(--font-mono);
    font-size:10px;
    padding:3px 4px;
    cursor:pointer;
  }
  .rank-select:hover{ border-color:var(--gold); }
  .rank-select:focus{ outline:none; border-color:var(--gold); }

  .fav-mark{
    position:absolute; top:6px; left:6px;
    color:var(--brick);
    font-size:14px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.8));
  }

  /* Top-10 favourite TV rank medal (English library only). Explicitly
     assigned per-title via the rank-select control — sits pinned to the
     top-right corner, tilted, and genuinely overlapping the poster's edge
     now that .poster-card allows overflow. Heart mark stays put at
     top-left regardless of whether a medal is present. */
  .rank-medal-wrap{
    position:absolute; top:-8px; right:-9px;
    width:26px;
    transform: rotate(18deg);
    transform-origin: top right;
    filter: drop-shadow(0 1.5px 2px rgba(0,0,0,0.7));
    z-index:3;
    pointer-events:none;
  }
  .rank-medal-wrap svg{ display:block; width:100%; height:auto; overflow:visible; }
  .rank-medal-gold{ --f1:#fdf0b0; --f2:#e0ab3a; --f3:#a8791f; --detail:#7a5211; --ring1:#fff3c4; --ring2:#a8791f; }
  .rank-medal-silver{ --f1:#ffffff; --f2:#cdd2d8; --f3:#969ba3; --detail:#4c5158; --ring1:#ffffff; --ring2:#8b9096; }
  .rank-medal-bronze{ --f1:#f0c497; --f2:#c07f42; --f3:#8a5423; --detail:#552d10; --ring1:#f6d3ac; --ring2:#8a5423; }
  .rank-medal-purple{ --f1:#ddd0fa; --f2:#8b74d1; --f3:#5c4a9e; --detail:#2e2354; --ring1:#e9defe; --ring2:#5c4a9e; }

  .remove-btn{
    position:absolute; top:4px; right:4px;
    width:22px; height:22px;
    border-radius:50%;
    background:rgba(10,10,14,0.75);
    color:var(--ink);
    border:none;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    opacity:0;
    transition:opacity 0.15s ease, background 0.15s ease;
  }
  .poster-card:hover .remove-btn, .poster-card:focus-within .remove-btn{ opacity:1; }
  .remove-btn:hover{ background:var(--brick); }

  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-faint);
  }
  .empty-state .big{
    font-family:var(--font-display);
    font-size:28px;
    color:var(--ink-dim);
    letter-spacing:0.03em;
    margin-bottom:8px;
  }

  .toast{
    position:fixed;
    bottom:22px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--bg-raise);
    border:1px solid var(--gold-dim);
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.04em;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index:50;
    box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{
    text-align:center;
    padding:26px 20px 40px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }

  @media (max-width:520px){
    header.marquee{ padding:22px 16px 18px; }
    .marquee-inner{ flex-direction:column; align-items:flex-start; }
    .stat-strip{ gap:16px; }
    .controls{ padding:0 16px; }
    main{ padding:16px 16px 60px; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap:12px 10px; }
  }

  /* ---------- Utility bar (Surprise Me / Stats) ---------- */
  .util-bar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .util-btn{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; cursor:pointer; transition:all 0.15s ease; display:flex; align-items:center; gap:6px;
  }
  .util-btn:hover{ border-color:var(--gold-dim); background:var(--card-hover); }
  .util-btn:disabled{ opacity:0.35; cursor:default; }
  .util-btn:disabled:hover{ border-color:var(--line); background:var(--card); }
  .util-btn.has-actions{ border-color:var(--gold-dim); color:var(--gold); }

  /* ---------- Modal overlay (shared) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,11,16,0.78); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-card{
    background:var(--bg-raise); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); max-width:360px; width:100%; padding:24px 22px; position:relative;
    text-align:center;
  }
  .modal-close{
    position:absolute; top:10px; right:12px; background:transparent; border:none;
    color:var(--ink-faint); font-size:22px; cursor:pointer; line-height:1;
  }
  .modal-close:hover{ color:var(--ink); }

  /* ---------- Surprise Me ---------- */
  .surprise-poster{
    width:150px; height:225px; margin:6px auto 14px; border-radius:4px; overflow:hidden;
    background:var(--card); display:flex; align-items:center; justify-content:center;
  }
  .surprise-poster img{ width:100%; height:100%; object-fit:cover; }
  .surprise-poster .fallback{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); padding:10px; }
  .surprise-title{ font-family:var(--font-display); font-size:26px; letter-spacing:0.02em; color:var(--ink); line-height:1.1; }
  .surprise-year{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); margin-top:4px; }
  .surprise-progress{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:14px; text-transform:uppercase; letter-spacing:0.05em; }
  .surprise-actions{ display:flex; gap:10px; margin-top:16px; justify-content:center; flex-wrap:wrap; }
  .surprise-action{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    border-radius:999px; padding:9px 16px; cursor:pointer; border:1px solid var(--line);
    background:transparent; color:var(--ink-dim); transition:all 0.15s ease;
  }
  .surprise-action:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .surprise-action.primary{ background:var(--gold); border-color:var(--gold); color:var(--bg); font-weight:600; }
  .surprise-action.primary:hover{ background:var(--gold); opacity:0.9; }

  /* ---------- Stats ---------- */
  .stats-modal-card{ max-width:640px; }
  .stats-loading{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); padding:40px 0; }
  .stats-row{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .flip-card{ width:230px; height:180px; perspective:1000px; cursor:pointer; }
  .flip-card-inner{
    position:relative; width:100%; height:100%; transition:transform 0.5s;
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-card-inner{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:12px;
  }
  .flip-face .num{ font-family:var(--font-display); font-size:44px; color:var(--gold); line-height:1; }
  .flip-face .lbl{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-dim); }
  .flip-face .sub{ font-family:var(--font-mono); font-size:9px; color:var(--ink-faint); margin-top:6px; }
  .flip-back{ transform:rotateY(180deg); }
  .stats-hint{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:16px; }

  /* ---------- Detail modal ---------- */
  .detail-modal-card{ max-width:640px; text-align:left; padding:0; overflow:hidden; max-height:88vh; overflow-y:auto; }
  .detail-modal-card .modal-close{ z-index:5; background:rgba(10,11,16,0.5); border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
  .detail-hero{ display:flex; gap:18px; padding:22px; background:var(--bg-raise); }
  .detail-poster{ position:relative; width:130px; min-width:130px; aspect-ratio:2/3; border-radius:4px; overflow:hidden; background:var(--card); }
  .detail-poster img{ width:100%; height:100%; object-fit:cover; display:block; }
  .detail-poster .fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); text-align:center; padding:8px; }
  .detail-poster-edit{
    position:absolute; bottom:5px; right:5px;
    width:24px; height:24px;
    border-radius:50%;
    background:rgba(10,11,16,0.75);
    border:1px solid var(--gold-dim);
    color:var(--ink);
    font-size:12px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-poster-edit:hover{ background:var(--gold); color:#181205; border-color:var(--gold); }

  /* ---------- Poster picker (English archive only) ---------- */
  .poster-picker{ padding:22px; }
  .poster-picker-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .poster-picker-title{ font-family:var(--font-display); font-size:20px; color:var(--ink); letter-spacing:0.02em; }
  .poster-picker-cancel{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .poster-picker-cancel:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .poster-picker-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap:12px;
  }
  .poster-picker-item{
    position:relative;
    aspect-ratio:2/3;
    border-radius:4px;
    overflow:hidden;
    background:var(--card);
    cursor:pointer;
    border:2px solid transparent;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .poster-picker-item:hover{ transform:translateY(-2px); border-color:var(--gold-dim); }
  .poster-picker-item.current{ border-color:var(--gold); }
  .poster-picker-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .poster-picker-item .current-tag{
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(212,167,61,0.92); color:#181205;
    font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; text-transform:uppercase;
    text-align:center; padding:3px 0;
  }
  .poster-picker-empty, .poster-picker-loading{
    padding:40px 20px; text-align:center; color:var(--ink-faint); font-family:var(--font-mono); font-size:12px;
  }
  .detail-headline{ display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .detail-title{ font-family:var(--font-display); font-size:28px; color:var(--ink); line-height:1.05; }
  .detail-title-row{ display:flex; align-items:baseline; gap:8px; }
  .detail-title-edit{
    background:transparent; border:none; color:var(--ink-faint); font-size:14px;
    cursor:pointer; padding:2px 4px; flex-shrink:0;
  }
  .detail-title-edit:hover{ color:var(--gold-dim); }
  .detail-meta{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); letter-spacing:0.03em; }
  .detail-rating{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:12px; color:var(--gold); margin-top:2px; }
  .detail-genres{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .detail-genre-chip{
    font-family:var(--font-mono); font-size:9px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--ink-dim); border:1px solid var(--line); border-radius:999px; padding:3px 9px;
  }
  .detail-body{ padding:20px 22px 24px; }
  .detail-section-lbl{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:6px; }
  .detail-overview{ font-family:var(--font-body); font-size:14px; line-height:1.55; color:var(--ink); margin-bottom:18px; }
  .detail-cast-row{ display:flex; gap:14px; overflow-x:auto; padding-bottom:4px; }
  .detail-cast-item{ min-width:74px; text-align:center; }
  .detail-cast-photo{
    width:66px; height:66px; border-radius:50%; overflow:hidden; margin:0 auto 6px;
    background:var(--card); display:flex; align-items:center; justify-content:center;
  }
  .detail-cast-photo img{ width:100%; height:100%; object-fit:cover; }
  .detail-cast-photo .initial{ font-family:var(--font-display); font-size:20px; color:var(--ink-faint); }
  .detail-cast-name{ font-family:var(--font-mono); font-size:9px; color:var(--ink-dim); line-height:1.3; }
  .detail-cast-char{ font-family:var(--font-mono); font-size:8px; color:var(--ink-faint); }
  .detail-loading{ padding:60px 20px; text-align:center; font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); }
  .detail-status-row{ margin-top:16px; }
  .detail-status-row select{
    background:var(--bg-raise); color:var(--ink); border:1px solid var(--line); border-radius:4px;
    font-family:var(--font-mono); font-size:11px; padding:6px 8px; cursor:pointer;
  }
  .detail-seasons-btn{
    background:var(--bg-raise); color:var(--ink); border:1px solid var(--line); border-radius:4px;
    font-family:var(--font-mono); font-size:11px; padding:6px 10px; cursor:pointer; text-align:left;
  }
  .detail-seasons-btn:hover{ border-color:var(--gold-dim); }

  /* ---------- Season manager (choose which seasons count toward Stats) ---------- */
  .season-manager{ padding:22px; }
  .season-manager-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; gap:12px; }
  .season-manager-title{ font-family:var(--font-display); font-size:19px; color:var(--ink); letter-spacing:0.02em; }
  .season-manager-cancel{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    padding:6px 12px; border-radius:999px; cursor:pointer; flex-shrink:0;
  }
  .season-manager-cancel:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .season-manager-note{
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-bottom:14px; line-height:1.5;
  }
  .season-manager-actions{ display:flex; gap:8px; margin-bottom:14px; }
  .season-manager-actions button{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase;
    padding:6px 10px; border-radius:4px; cursor:pointer;
  }
  .season-manager-actions button:hover{ border-color:var(--gold-dim); color:var(--ink); }
  .season-manager-list{ display:flex; flex-direction:column; gap:2px; max-height:340px; overflow-y:auto; }
  .season-row{
    display:flex; align-items:center; gap:10px; padding:9px 4px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .season-row:last-child{ border-bottom:none; }
  .season-row input{ flex-shrink:0; width:16px; height:16px; accent-color:var(--gold); cursor:pointer; }
  .season-name{ flex:1; font-family:var(--font-body); font-size:13.5px; color:var(--ink); }
  .season-eps{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); flex-shrink:0; }
  .season-manager-empty, .season-manager-loading{
    padding:40px 20px; text-align:center; color:var(--ink-faint); font-family:var(--font-mono); font-size:12px;
  }

  /* ---------- Category manager ---------- */
  .cat-modal-card{ max-width:460px; text-align:left; }
  .cat-modal-card .modal-close{ top:14px; right:14px; }
  .cat-section-title{
    font-family:var(--font-display); font-size:18px; color:var(--gold);
    margin:18px 0 10px; letter-spacing:0.02em;
  }
  .cat-section-title:first-child{ margin-top:4px; }
  .cat-row{
    display:flex; align-items:center; gap:8px; padding:7px 0;
    border-bottom:1px solid var(--line);
  }
  .cat-row input[type="text"]{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:4px;
    color:var(--ink); font-family:var(--font-body); font-size:13px; padding:7px 9px;
  }
  .cat-row input[type="text"]:focus{ outline:none; border-color:var(--gold-dim); }
  .cat-all-label{
    flex:1; font-family:var(--font-body); font-size:13px; color:var(--ink); padding:7px 9px;
  }
  .cat-core-tag{
    font-family:var(--font-mono); font-size:8px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-faint); border:1px solid var(--line); border-radius:999px; padding:3px 7px;
    white-space:nowrap;
  }
  .cat-delete-btn{
    background:transparent; border:none; color:var(--ink-faint); font-size:15px;
    cursor:pointer; padding:4px 6px; line-height:1;
  }
  .cat-delete-btn:hover{ color:var(--brick); }
  .cat-add-row{ display:flex; gap:8px; margin-top:10px; }
  .cat-add-row input[type="text"]{
    flex:1; background:var(--card); border:1px dashed var(--line); border-radius:4px;
    color:var(--ink); font-family:var(--font-body); font-size:13px; padding:8px 10px;
  }
  .cat-add-row input[type="text"]:focus{ outline:none; border-color:var(--gold-dim); }
  .cat-add-btn{
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    background:var(--gold); color:var(--bg); border:none; border-radius:4px; padding:0 14px;
    cursor:pointer; font-weight:600;
  }

  }

  /* =====================================================================
     TV TIME–STYLE SHELL: light theme, yellow accent, bottom tabs
     ===================================================================== */
  :root{
    --bg:#f4f4f4; --bg-raise:#ffffff; --card:#ffffff; --card-hover:#f1f1f1;
    --gold:#ffd500; --gold-dim:#b89600; --brick:#e60012;
    --ink:#0b0b0b; --ink-dim:#555; --ink-faint:#8c8c8c; --line:#e1e1e1;
    --radius:8px; --shadow:0 6px 16px -10px rgba(0,0,0,.4);
    --font-display:'Outfit',sans-serif; --font-body:'Outfit',sans-serif; --font-mono:'Outfit',sans-serif;
    --nav-h:74px;
  }
  html{ background:var(--bg); }
  body{ font-family:var(--font-body); padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom)); }
  .sprockets, footer, .controls .type-tabs{ display:none !important; }

  /* --- screens: only one is visible at a time --- */
  .view{ display:none; }
  body[data-screen="explore"] #viewExplore, body[data-screen="upcoming"] #viewUpcoming, body[data-screen="profile"] #viewProfile{ display:block; }
  body[data-screen="explore"] .controls, body[data-screen="upcoming"] .controls, body[data-screen="profile"] .controls,
  body[data-screen="explore"] main, body[data-screen="upcoming"] main, body[data-screen="profile"] main{ display:none; }

  /* --- top switch (WATCH LIST | UPCOMING) --- */
  .app-top{ display:none; position:sticky; top:0; z-index:40; background:#fff; border-bottom:1px solid #d9d9d9; padding-top:env(safe-area-inset-top); }
  body[data-screen="watch"] .app-top, body[data-screen="upcoming"] .app-top{ display:flex; }
  .top-tab{ flex:1; background:none; border:0; border-bottom:4px solid transparent; margin-bottom:-1px; padding:18px 8px 14px; font:700 19px var(--font-display); letter-spacing:.03em; text-transform:uppercase; color:#8a8a8a; cursor:pointer; transition:color .2s, border-color .2s; }
  .top-tab.active{ color:#000; border-bottom-color:#000; }
  body[data-view="movies"] .top-tab[data-sub="upcoming"]{ display:none; }

  /* --- bottom navigation --- */
  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; background:#fff; border-top:1px solid #ddd; padding-bottom:env(safe-area-inset-bottom); }
  .nav-btn{ flex:1; background:none; border:0; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:4px; color:#8a8a8a; font:500 13px var(--font-body); cursor:pointer; transition:color .15s; }
  .nav-btn svg{ width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .nav-btn.active{ color:#000; } .nav-btn.active svg{ stroke-width:2.3; }
  .nav-btn:active svg{ transform:scale(.92); }

  /* --- shared layout --- */
  .controls{ margin:10px auto 0; padding:0 12px; max-width:1200px; }
  main{ max-width:1200px; margin:0 auto; padding:4px 12px 24px; }
  .view{ max-width:1200px; margin:0 auto; }
  .filter-row{ gap:8px; margin:6px 0 10px; }
  .filter-pill{ border:0; background:#ececec; color:#000; border-radius:999px; padding:11px 16px; font:700 14px var(--font-display); letter-spacing:.03em; text-transform:uppercase; }
  .filter-pill:hover{ background:#e2e2e2; color:#000; }
  .filter-pill.active{ background:var(--gold); color:#000; }
  .filter-pill .count{ opacity:.55; margin-left:5px; font-weight:600; }
  .archive-search{ background:#fff; border:1px solid #e2e2e2; border-radius:999px; margin:4px 0 12px; }
  .archive-search .icon{ color:#777; }

  /* --- poster grid --- */
  .grid{ grid-template-columns:repeat(3,1fr); gap:8px; }
  .poster-card, .poster-art{ border-radius:6px; }
  .poster-art{ background:#dcdcdc; box-shadow:none; }
  .poster-caption .t{ color:#fff; font-weight:600; } .poster-caption .y{ color:var(--gold); }
  .cat-section{ margin-bottom:22px; }
  .cat-section-header{ font:700 22px var(--font-display); color:#000; border-bottom:0; padding-bottom:0; margin:6px 2px 10px; letter-spacing:0; }
  .cat-section-count{ color:#8c8c8c; font-weight:600; }
  .tv-status-bar{ height:10px; }
  .empty-state{ text-align:center; padding:70px 20px 40px; }
  .empty-state .big{ font:700 28px var(--font-display); color:#000; margin-bottom:6px; }
  .es-art{ width:150px; height:150px; margin:14px auto 18px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; }
  .es-art svg{ width:78px; height:78px; stroke:#000; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .es-sub{ font:400 20px var(--font-body); color:#222; margin-bottom:24px; }
  .yellow-btn{ background:var(--gold); color:#000; border:0; border-radius:999px; padding:16px 34px; font:700 17px var(--font-display); letter-spacing:.04em; text-transform:uppercase; cursor:pointer; }
  .yellow-btn:active{ transform:scale(.97); }
  @media (min-width:600px){ .grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px 12px; } }

  /* --- Explore --- */
  #viewExplore{ padding:14px 16px 30px; }
  #viewExplore .ticket-window{ background:none; border:0; border-bottom:2px solid #bdbdbd; border-radius:0; padding:8px 4px; display:flex; align-items:center; gap:12px; box-shadow:none; }
  #viewExplore .ticket-window::before, #viewExplore .ticket-window::after{ display:none; }
  #viewExplore .ticket-window .icon{ font-size:24px; color:#777; }
  #viewExplore .ticket-window input{ font:500 20px var(--font-body); color:#000; }
  #viewExplore .search-results{ margin:12px 0; background:transparent; border:0; max-height:none; overflow:visible; }
  .search-row{ background:#fff; border:0; border-radius:12px; margin-bottom:8px; padding:10px 12px; }
  .search-row:hover, .search-row.kbd-active{ background:#fff7c2; }
  .search-row img{ border-radius:6px; }
  .search-row .meta .t{ font-weight:600; font-size:16px; } .search-row .meta .y{ font-family:var(--font-body); font-size:13px; }
  .search-row .add-badge{ background:var(--gold); color:#000; border:0; border-radius:999px; font:700 12px var(--font-display); padding:7px 14px; letter-spacing:.05em; }
  .cat-chip{ color:#000; background:#f0f0f0; border:0; border-radius:999px; padding:9px 14px; font:600 12px var(--font-display); }
  .cat-chip:hover{ background:var(--gold); color:#000; }
  .explore-card{ display:flex; align-items:center; gap:14px; width:100%; margin-top:22px; text-align:left; background:var(--gold); border:0; border-radius:16px; padding:18px; font:700 18px var(--font-display); color:#000; cursor:pointer; }
  .explore-card small{ display:block; font:500 14px var(--font-body); margin-top:3px; color:#3a3000; }
  .explore-card .em{ font-size:32px; }
  .explore-hint{ margin-top:18px; color:#777; font:400 15px var(--font-body); }

  /* --- Upcoming --- */
  .up-group-h{ font:700 20px var(--font-display); text-transform:uppercase; letter-spacing:.02em; padding:18px 16px 8px; }
  .up-row{ display:flex; align-items:center; gap:12px; background:#fff; margin:0 12px 8px; padding:10px; border-radius:14px; cursor:pointer; }
  .up-row img, .up-row .nop{ width:56px; height:84px; flex:none; object-fit:cover; border-radius:6px; background:#e4e4e4; }
  .up-meta{ min-width:0; flex:1; } .up-meta .t{ font:700 17px var(--font-display); } .up-meta .e{ font:400 14px var(--font-body); color:#666; margin-top:2px; }
  .up-date{ text-align:right; font:700 15px var(--font-display); white-space:nowrap; }
  .up-date .chip{ display:inline-block; background:var(--gold); border-radius:999px; padding:3px 10px; font-size:12px; margin-top:5px; }
  .up-empty{ text-align:center; padding:70px 24px; color:#555; font:400 18px var(--font-body); }
  .up-empty b{ display:block; font:700 26px var(--font-display); color:#000; margin-bottom:8px; }

  /* --- Profile --- */
  #viewProfile{ background:#fff; min-height:100vh; padding-bottom:30px; }
  #viewProfile header.marquee{ display:block; background:linear-gradient(180deg,#4a4a4a,#111); border:0; padding:calc(54px + env(safe-area-inset-top)) 20px 22px; }
  #viewProfile .marquee-inner{ display:block; }
  #viewProfile .marquee-title{ color:#fff; font:700 36px var(--font-display); letter-spacing:.01em; line-height:1; }
  #archiveTitlePart2{ color:var(--gold); }
  #viewProfile .marquee-sub{ color:#c9c9c9; font:400 14px var(--font-body); text-transform:none; letter-spacing:0; }
  #viewProfile .library-tabs{ background:rgba(255,255,255,.14); border:0; margin-top:16px; }
  #viewProfile .library-tab{ color:#ddd; font:700 12px var(--font-display); padding:9px 16px; }
  #viewProfile .library-tab.active{ background:var(--gold); color:#000; }
  #viewProfile .edit-branding-btn{ color:#bdbdbd; font:500 13px var(--font-body); margin-top:12px; }
  .profile-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-bottom:1px solid #ddd; }
  .profile-stats .stat{ text-align:center; padding:14px 0 12px; border-right:1px solid #ddd; } .profile-stats .stat:last-child{ border-right:0; }
  .profile-stats .stat-num{ font:700 26px var(--font-display); color:#000; }
  .profile-stats .stat-label{ font:400 16px var(--font-body); letter-spacing:0; text-transform:none; color:#222; margin-top:2px; }
  .p-sec{ padding:24px 16px 4px; }
  .p-head{ display:flex; align-items:center; gap:10px; font:700 32px var(--font-display); margin-bottom:12px; cursor:pointer; }
  .p-head .chev{ margin-left:auto; display:flex; }
  .p-heart{ width:34px; height:34px; border-radius:50%; background:#e60012; display:flex; align-items:center; justify-content:center; flex:none; }
  .p-heart svg{ width:19px; height:19px; fill:#fff; }
  .p-card{ background:#f4f4f4; border-radius:14px; padding:18px 14px; }
  .p-nums{ display:grid; grid-template-columns:repeat(3,1fr); text-align:center; margin-bottom:16px; }
  .p-nums b{ display:block; font:700 30px var(--font-display); } .p-nums span{ font:400 15px var(--font-body); color:#555; }
  .outline-btn{ display:block; margin:0 auto; background:transparent; border:2px solid #000; border-radius:999px; padding:12px 26px; font:700 15px var(--font-display); letter-spacing:.05em; text-transform:uppercase; cursor:pointer; color:#000; }
  .list-grp{ font:600 14px var(--font-body); color:#777; text-transform:uppercase; letter-spacing:.08em; margin:4px 2px 8px; }
  .list-row{ display:flex; align-items:center; width:100%; background:#f4f4f4; border:0; border-radius:14px; padding:16px; margin-bottom:8px; font:600 18px var(--font-display); color:#000; cursor:pointer; text-align:left; }
  .list-row b{ margin-left:auto; margin-right:10px; font-weight:600; color:#666; }
  .p-rowscroll{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; scroll-snap-type:x proximity; }
  .p-rowscroll::-webkit-scrollbar{ display:none; }
  .mini{ position:relative; flex:0 0 112px; aspect-ratio:2/3; border-radius:6px; overflow:hidden; background:#e5e5e5; cursor:pointer; scroll-snap-align:start; }
  .mini .poster-art{ border-radius:6px; }
  .mini img{ width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none; }
  .mini .fallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:8px; font:600 13px var(--font-body); color:#555; }
  .p-empty{ color:#888; font:400 15px var(--font-body); padding:22px 0; text-align:center; }
  #profileTools{ padding:26px 16px 0; }
  #profileTools .util-bar{ margin-bottom:8px; }
  #profileTools .util-bar{ display:flex; flex-direction:column; gap:8px; }
  #profileTools #statsBtn{ display:none; }
  #profileTools .util-btn{ text-transform:none; letter-spacing:0; text-align:left; background:#f4f4f4; border:0; border-radius:14px; padding:16px; font:600 16px var(--font-display); color:#000; }
  #profileTools .util-btn:disabled{ opacity:.45; }



  /* --- Explore (discover) --- */
  .ex-toolbar{ display:flex; align-items:center; gap:10px; margin:16px 0 4px; flex-wrap:wrap; }
  .ex-seg{ display:inline-flex; background:#ececec; border-radius:999px; padding:4px; }
  .ex-seg button{ border:0; background:none; padding:10px 20px; border-radius:999px; font:700 14px var(--font-display); letter-spacing:.04em; text-transform:uppercase; cursor:pointer; color:#000; transition:background .15s; }
  .ex-seg button.on{ background:var(--gold); }
  .ex-surprise{ margin-left:auto; background:#000; color:#fff; border:0; border-radius:999px; padding:11px 16px; font:700 14px var(--font-display); letter-spacing:.03em; cursor:pointer; }
  #viewExplore.searching .ex-toolbar, #viewExplore.searching #exploreDiscover{ display:none; }
  .ex-hero{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:12px 0 2px; scrollbar-width:none; }
  .ex-hero::-webkit-scrollbar, .ex-scroll::-webkit-scrollbar{ display:none; }
  .ex-slide{ flex:0 0 100%; aspect-ratio:16/9; border-radius:16px; background:#dcdcdc center/cover; position:relative; overflow:hidden; scroll-snap-align:start; cursor:pointer; }
  .ex-slide::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.82)); }
  .ex-slide-in{ position:absolute; left:16px; right:16px; bottom:14px; z-index:2; color:#fff; }
  .ex-slide-in .t{ font:700 24px var(--font-display); line-height:1.1; text-shadow:0 1px 8px rgba(0,0,0,.5); }
  .ex-slide-in .m{ font:500 14px var(--font-body); opacity:.9; margin-top:4px; }
  .ex-pill{ position:absolute; right:14px; top:14px; z-index:2; background:var(--gold); color:#000; border-radius:999px; padding:7px 14px; font:700 12px var(--font-display); letter-spacing:.05em; text-transform:uppercase; }
  .ex-slide:not(.in-lib) .ex-pill::before{ content:"+ Add"; } .ex-slide.in-lib .ex-pill::before{ content:"✓ In your lists"; }
  .ex-sec{ margin-top:22px; }
  .ex-h{ font:700 24px var(--font-display); margin-bottom:10px; }
  .ex-scroll{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; scroll-snap-type:x proximity; }
  .ex-card{ flex:0 0 116px; aspect-ratio:2/3; border-radius:8px; overflow:hidden; position:relative; background:#e5e5e5; cursor:pointer; scroll-snap-align:start; }
  .ex-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ex-card .ex-in{ position:absolute; right:6px; bottom:6px; width:24px; height:24px; border-radius:50%; background:var(--gold); display:none; align-items:center; justify-content:center; font:700 13px var(--font-display); }
  .ex-card.in-lib .ex-in{ display:flex; }
  .ex-card.sk, .ex-slide.sk{ background:linear-gradient(90deg,#e6e6e6,#f3f3f3,#e6e6e6); background-size:200% 100%; animation:ex-sk 1.2s linear infinite; cursor:default; }
  @keyframes ex-sk{ to{ background-position:-200% 0; } }
  .ex-fail{ text-align:center; color:#777; padding:40px 10px; font:400 16px var(--font-body); }
  @media (min-width:700px){ .ex-card{ flex-basis:140px; } .ex-slide{ flex-basis:min(100%,680px); } }
  @media (min-width:900px){ #viewExplore{ max-width:1000px; } }

  /* --- bottom sheet (add to list / new category) --- */
  .sh-overlay{ position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; }
  .sh-overlay.open{ display:flex; }
  .sh-sheet{ background:#fff; width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:20px 18px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; animation:sh-up .22s ease-out; }
  @keyframes sh-up{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
  @media (min-width:700px){ .sh-overlay{ align-items:center; } .sh-sheet{ border-radius:22px; } }
  .sh-top{ display:flex; gap:14px; }

  .sh-title{ font:700 24px var(--font-display); line-height:1.15; }
  .sh-meta{ font:500 14px var(--font-body); color:#666; margin:4px 0 8px; }
  .sh-over{ font:400 14px/1.45 var(--font-body); color:#333; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; }
  .sh-lbl{ font:700 13px var(--font-display); letter-spacing:.08em; text-transform:uppercase; color:#777; margin:18px 0 8px; }
  .sh-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .sh-chip{ border:0; background:#f0f0f0; border-radius:999px; padding:11px 16px; font:700 14px var(--font-display); cursor:pointer; color:#000; }
  .sh-chip:hover, .sh-chip.on{ background:var(--gold); }

  .sh-input{ width:100%; border:0; border-bottom:2px solid #bbb; font:500 22px var(--font-body); padding:10px 2px; outline:none; margin-top:6px; background:none; }

  .sh-go{ width:100%; margin-top:22px; }
  .add-cat{ display:flex; align-items:center; justify-content:center; gap:8px; width:calc(100% - 32px); margin:22px 16px 0; padding:16px; border:2px dashed #b5b5b5; border-radius:14px; background:none; font:700 16px var(--font-display); color:#000; cursor:pointer; }
  .add-cat:hover{ border-color:#000; }
  .p-count{ font:600 16px var(--font-display); color:#999; margin-left:2px; }
  .p-unpin{ margin-left:auto; width:30px; height:30px; border-radius:50%; border:0; background:#eee; color:#555; font:700 18px/1 var(--font-body); cursor:pointer; flex:none; }
  .p-unpin:hover{ background:#e0e0e0; color:#000; }

  /* --- Profile stats: TV Shows and Movies shown separately --- */
  .profile-stats{ display:none; }
  .st-grid{ display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:14px; }
  @media (min-width:620px){ .st-grid{ grid-template-columns:1fr 1fr; } }

  .st-t{ display:flex; align-items:center; gap:8px; font:700 14px var(--font-display); letter-spacing:.08em; text-transform:uppercase; color:#555; }
  .st-t svg{ width:22px; height:22px; stroke:#000; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .st-big{ font:700 42px var(--font-display); line-height:1; margin-top:12px; }
  .st-big small{ font:600 16px var(--font-body); color:#666; margin-left:6px; }
  .st-sub{ font:400 14px var(--font-body); color:#666; margin-top:5px; }

  .st-mini b{ display:block; font:700 22px var(--font-display); } .st-mini span{ font:400 13px var(--font-body); color:#666; }


  /* --- Back button --- */
  .back-btn{ position:fixed; z-index:70; top:calc(env(safe-area-inset-top, 0px) + 9px); left:10px; width:40px; height:40px; border-radius:50%; border:0; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.2); display:none; align-items:center; justify-content:center; cursor:pointer; padding:0; }

  /* --- readability fixes for the older popups on the light theme --- */
  .flip-face .num, .detail-rating, .branding-section-title, .cat-section-title, .util-btn.has-actions{ color:#000; }
  .surprise-action.primary, .branding-save-btn, .cat-add-btn{ background:var(--gold); border-color:var(--gold); color:#000; }
  .detail-poster-edit:hover{ color:#000; }

<script type="module">
