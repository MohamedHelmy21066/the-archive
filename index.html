  // ---------- Stats (TV Time style flip cards: count <-> hours) ----------
  const statsModal = document.getElementById('statsModal');
  const statsBody = document.getElementById('statsBody');

  function watchedMovies(){
    return state.items.filter(i => i.type === 'movie' && (i.category === 'finished' || i.category === 'favourite'));
  }
  function watchedShows(){
    return state.items.filter(i => i.type === 'tv' && (i.category === 'finished' || i.category === 'favourite' || i.category === 'up_to_date' || i.category === 'stopped' || epTickedCount(i) > 0));
  }

  async function ensureStatsData(){
    // Use falsy (not just undefined) so any titles from before the retry fix —
    // which got permanently stuck with a cached 0 from a failed request — self-heal
    // and get retried too. A real movie/show essentially never has an actual runtime
    // or episode count of exactly 0, so this is safe.
    const fetchingFor = activeLibrary; // remember which library this fetch is for
    const movieQueue = watchedMovies().filter(i => !i.runtimeMin && i.tmdbId);
    const tvQueue = watchedShows().filter(i => !i.epCount && i.tmdbId);
    if(!movieQueue.length && !tvQueue.length) return;

    const CONC = 6;
    async function runQueue(queue, worker){
      let idx = 0;
      async function w(){
        while(idx < queue.length){
          const item = queue[idx++];
          await worker(item);
        }
      }
      const workers = [];
      for(let i = 0; i < CONC; i++) workers.push(w());
      await Promise.all(workers);
    }

    await Promise.all([
      runQueue(movieQueue, async (item) => {
        const d = await tmdbMovieDetails(item.tmdbId, fetchingFor);
        if(d){
          // only write on a real, successful response — if the request itself
          // failed (d is null), leave runtimeMin unset so it's retried next time
          // instead of getting permanently stuck at 0 hours
          item.runtimeMin = d.runtime || 0;
        }
      }),
      runQueue(tvQueue, async (item) => {
        const d = await tmdbTvDetails(item.tmdbId, fetchingFor);
        if(d){
          item.epCount = d.number_of_episodes || 0;
          item.epRuntimeMin = (d.episode_run_time && d.episode_run_time.length) ? d.episode_run_time[0] : 40;
          if(d.seasons && (!item.seasonsData || !item.seasonsData.length)){
            item.seasonsData = d.seasons
              .filter(s => s.season_number > 0 && (s.episode_count || 0) > 0)
              .map(s => ({ season_number: s.season_number, name: s.name, episode_count: s.episode_count }));
          }
        }
      })
    ]);
    // Only persist if still on the same library this fetch was for — if the user
    // switched libraries mid-fetch, persist() would otherwise save the WRONG
    // library's state. The fetched data stays on the in-memory item objects
    // either way, so it'll just get saved next time something else changes there.
    if(activeLibrary === fetchingFor) persist();
  }

  function fmtHours(totalMinutes){
    return (totalMinutes / 60).toFixed(1);
  }

  // Real, numbered seasons only — filters out "Specials" (season_number 0)
  // even from data cached before that exclusion existed.
  function realSeasons(item){
    return (item.seasonsData || []).filter(s => s.season_number > 0);
  }

  // How many episodes of a show actually count toward Stats — every episode,
  // unless the admin has excluded specific seasons via the season manager.
  function effectiveEpisodeCount(item){
    if(item.epw){ return epTickedCount(item); }
    const seasons = realSeasons(item);
    if(seasons.length){
      const excluded = new Set(item.excludedSeasons || []);
      return seasons
        .filter(s => !excluded.has(s.season_number))
        .reduce((sum, s) => sum + (s.episode_count || 0), 0);
    }
    return item.epCount || 0;
  }

  function renderStatsCards(){
    const movies = watchedMovies();
    const shows = watchedShows();
    const movieMinutes = movies.reduce((sum, i) => sum + (i.runtimeMin || 0), 0);
    const tvMinutes = shows.reduce((sum, i) => sum + (effectiveEpisodeCount(i) * (i.epRuntimeMin || 0)), 0);

    statsBody.innerHTML = `
      <div class="stats-row">
        <div class="flip-card" id="movieFlip">
          <div class="flip-card-inner">
            <div class="flip-face flip-front">
              <div class="num">${movies.length}</div>
              <div class="lbl">Movies Watched</div>
              <div class="sub">tap to flip</div>
            </div>
            <div class="flip-face flip-back">
              <div class="num">${fmtHours(movieMinutes)}</div>
              <div class="lbl">Hours Watched</div>
              <div class="sub">based on runtimes found on TMDB</div>
            </div>
          </div>
        </div>
        <div class="flip-card" id="tvFlip">
          <div class="flip-card-inner">
            <div class="flip-face flip-front">
              <div class="num">${shows.length}</div>
              <div class="lbl">Shows Tracked</div>
              <div class="sub">tap to flip</div>
            </div>
            <div class="flip-face flip-back">
              <div class="num">${fmtHours(tvMinutes)}</div>
              <div class="lbl">Hours Watched</div>
              <div class="sub">est. from episode count × runtime</div>
            </div>
          </div>
        </div>
      </div>
      <div class="stats-hint">Tap or swipe a card to see hours instead of count</div>
    `;

    ['movieFlip','tvFlip'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('click', () => el.classList.toggle('flipped'));
      let touchStartX = null;
      el.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive:true});
      el.addEventListener('touchend', (e) => {
        if(touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if(Math.abs(dx) > 30) el.classList.toggle('flipped');
        touchStartX = null;
      }, {passive:true});
    });
  }

  async function openStats(){
    statsBody.innerHTML = `<div class="stats-loading">Crunching your numbers…</div>`;
    statsModal.style.display = 'flex';
    await ensureStatsData();
    renderStatsCards();
  }

  document.getElementById('statsBtn').addEventListener('click', openStats);
  document.getElementById('statsClose').addEventListener('click', () => {
    statsModal.style.display = 'none';
  });
  statsModal.addEventListener('click', (e) => {
    if(e.target === statsModal) statsModal.style.display = 'none';
  });

  // ---------- Title detail (double-tap/double-click a poster) ----------
  const detailModal = document.getElementById('detailModal');
  const detailBody = document.getElementById('detailBody');

  // ======================================================================
  //  Title page: banner header, About / Episodes tabs, episode ticking
  // ======================================================================
  const DT_BACKDROP = 'https://image.tmdb.org/t/p/w780';
  const DT_THUMB = 'https://image.tmdb.org/t/p/w300';
  const DT_TTL = 10 * 60 * 1000;
  const DT_WATCHED_CATS = ['finished', 'favourite'];
  let detailTab = 'about', dtItem = null, dtSeasons = [], dtToken = 0;
  const dtShowCache = {}, dtSeasonCache = {}, dtArtCache = {};
  const dtOpenSeasons = new Set();

  // ---- ticks are stored per season as compact ranges, e.g. {"1":"1-10","2":"1-3,5"} ----
  function epParse(str){
    const set = new Set();
    String(str || '').split(',').forEach(p => {
      if(!p) return;
      const [a, b] = p.split('-').map(Number);
      for(let i = a; i <= (b || a); i++) set.add(i);
    });
    return set;
  }
  function epSerialize(set){
    const arr = [...set].sort((a, b) => a - b), out = [];
    let i = 0;
    while(i < arr.length){
      let j = i;
      while(j + 1 < arr.length && arr[j + 1] === arr[j] + 1) j++;
      out.push(i === j ? String(arr[i]) : arr[i] + '-' + arr[j]);
      i = j + 1;
    }
    return out.join(',');
  }
  function epGet(item, s){ return epParse(item.epw && item.epw[s]); }
  function epPut(item, s, set){
    if(!item.epw) item.epw = {};
    if(set.size) item.epw[s] = epSerialize(set); else delete item.epw[s];
  }
  function epTickedCount(item){
    if(!item.epw) return 0;
    let n = 0;
    for(const k in item.epw){ if(+k > 0) n += epParse(item.epw[k]).size; }   // specials (season 0) never count toward Stats
    return n;
  }
  function epToday(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  // episodes of a season that have already aired, using the "next episode" TMDB tells us about
  function epAired(n, count, lim){
    if(!lim || n === 0) return count;
    if(n < lim.s) return count;
    if(n === lim.s) return Math.max(0, Math.min(count, lim.e - 1));
    return 0;
  }
  function epLim(item){ return item.nextEp ? {s: item.nextEp.s, e: item.nextEp.e} : null; }

  // One-time carry-over: what you had already counted as watched becomes ticked episodes.
  // After this runs, new seasons and episodes are NEVER ticked for you.
  function epMigrate(item, d){
    if(item.type !== 'tv' || item.epw !== undefined || !d || !Array.isArray(d.seasons)) return;
    const epw = {};
    if(['finished', 'favourite', 'up_to_date', 'stopped'].includes(item.category)){
      const excluded = new Set(item.excludedSeasons || []);
      const ne = d.next_episode_to_air;
      const lim = ne ? {s: ne.season_number, e: ne.episode_number} : null;
      d.seasons.forEach(s => {
        if(s.season_number > 0 && !excluded.has(s.season_number)){
          const n = epAired(s.season_number, s.episode_count || 0, lim);
          if(n > 0) epw[s.season_number] = '1-' + n;
        }
      });
    }
    item.epw = epw;
  }
  // you moved a show into Finished / Favourites / Up to date with nothing ticked: tick everything that has aired
  async function epMarkAllAired(item){
    if(!item.tmdbId) return;
    const d = await epLoadShow(item);
    if(!d || !d.seasons) return;
    const lim = epLim(item);
    item.epw = {};
    d.seasons.forEach(s => {
      if(s.season_number > 0){
        const n = epAired(s.season_number, s.episode_count || 0, lim);
        if(n > 0) item.epw[s.season_number] = '1-' + n;
      }
    });
    persist();
    renderStats();
  }

  // ---- TMDB helpers for the title page ----
  async function tmdbSeason(id, s, library){
    try{
      const r = await fetch(`${TMDB_BASE}/tv/${id}/season/${s}?api_key=${TMDB_KEY}${tmdbLangParam(library)}`);
      if(!r.ok) return null;
      return await r.json();
    }catch(e){ return null; }
  }
  async function epLoadSeason(item, s){
    const key = activeLibrary + '|' + item.tmdbId + '|' + s;
    const hit = dtSeasonCache[key];
    if(hit && Date.now() - hit.t < DT_TTL) return hit.eps;
    const d = await tmdbSeason(item.tmdbId, s, activeLibrary);
    if(!d || !Array.isArray(d.episodes)) return null;
    const today = epToday();
    const eps = d.episodes.map(x => ({n: x.episode_number, name: x.name || ('Episode ' + x.episode_number), still: x.still_path || null, date: x.air_date || '', runtime: x.runtime || 0, aired: !!x.air_date && x.air_date <= today}));
    dtSeasonCache[key] = {t: Date.now(), eps};
    return eps;
  }
  async function epLoadShow(item){
    const key = activeLibrary + '|' + item.tmdbId;
    const hit = dtShowCache[key];
    if(hit && Date.now() - hit.t < 5 * 60 * 1000) return hit.d;
    const d = await tmdbTvDetails(item.tmdbId, activeLibrary);
    if(d){
      if(Array.isArray(d.seasons)){
        item.seasonsData = d.seasons.filter(s => s.season_number > 0 && (s.episode_count || 0) > 0)
          .map(s => ({season_number: s.season_number, name: s.name, episode_count: s.episode_count}));
      }
      setShowStatus(item, d);       // also refreshes the "next episode" and does the one-time carry-over
      dtShowCache[key] = {t: Date.now(), d};
      persist();
    }
    return d;
  }
  async function tmdbArt(id, type){
    const key = type + '|' + id;
    if(dtArtCache[key]) return dtArtCache[key];
    try{
      const r = await fetch(`${TMDB_BASE}/${type === 'movie' ? 'movie' : 'tv'}/${id}/images?api_key=${TMDB_KEY}&include_image_language=en,null`);
      if(!r.ok) return {backdrops: [], logos: []};
      const j = await r.json();
      return (dtArtCache[key] = {backdrops: (j.backdrops || []).slice(0, 36), logos: (j.logos || []).slice(0, 30)});
    }catch(e){ return {backdrops: [], logos: []}; }
  }
  async function tmdbTrailerKey(id, type){
    try{
      const r = await fetch(`${TMDB_BASE}/${type === 'movie' ? 'movie' : 'tv'}/${id}/videos?api_key=${TMDB_KEY}&include_video_language=en,null`);
      if(!r.ok) return null;
      const list = ((await r.json()).results || []).filter(v => v.site === 'YouTube');
      const pick = list.find(v => v.type === 'Trailer' && v.official) || list.find(v => v.type === 'Trailer') || list.find(v => v.type === 'Teaser') || list[0];
      return pick ? pick.key : '';
    }catch(e){ return null; }
  }
  function dtEffLogo(item){ return item.logoPath !== undefined ? item.logoPath : (item.logoDefault || ''); }
  function dtFmtDate(str){
    if(!str) return '';
    const d = new Date(str + 'T00:00:00');
    return isNaN(d) ? '' : d.toLocaleDateString(undefined, {year: 'numeric', month: 'short', day: 'numeric'});
  }

  // ---- how far through a show you are ----
  function dtSeasonStats(item, n, count){
    const set = epGet(item, n);
    const key = activeLibrary + '|' + item.tmdbId + '|' + n;
    const cached = dtSeasonCache[key];
    const aired = cached ? cached.eps.filter(e => e.aired).length : epAired(n, count, epLim(item));
    return {ticked: set.size, count, aired};
  }
  function dtSeriesState(item){
    const seasons = (item.seasonsData || []).filter(s => s.season_number > 0);
    if(item.epw === undefined || !seasons.length){
      const w = DT_WATCHED_CATS.includes(item.category) || item.category === 'up_to_date';
      return {on: w, ticked: 0, aired: 0, label: w ? 'Watched' : 'Not watched'};
    }
    let aired = 0;
    seasons.forEach(s => { aired += dtSeasonStats(item, s.season_number, s.episode_count).aired; });
    const ticked = epTickedCount(item);
    const on = aired > 0 && ticked >= aired;
    return {on, ticked, aired, label: on ? 'Watched' : (ticked > 0 ? ticked + ' of ' + aired + ' watched' : 'Not watched')};
  }

  const DT_ICON = {
    down: '<svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg>',
    dots: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    eye: '<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
  };

  // ---- motion for the title page (same fade-out / rise-in as the rest of the app) ----
  let dtAnimTimer = null, dtTabToken = 0;
  function dtClean(els){
    clearTimeout(dtAnimTimer);
    dtAnimTimer = setTimeout(() => els.forEach(el => el.classList.remove('sh-card', 'sh-fade')), 1600);
  }
  function dtPaneParts(){
    const pane = document.getElementById('dtPane');
    if(!pane) return {heads: [], cards: []};
    return {
      heads: [...pane.querySelectorAll('.dt-sec, .dt-trailer, .ep-h, .ep-season, .ep-caught')],
      cards: [...pane.querySelectorAll('.detail-cast-item, #epNext .ep-row')]
    };
  }
  function dtPlayInPane(){
    if(reduceMotion) return;
    const {heads, cards} = dtPaneParts();
    shStagger(heads, 0, 45, 'sh-fade', 12);
    shStagger(cards, 120, 40, 'sh-card', 12);
    dtClean([...heads, ...cards]);
  }
  function dtPlayIn(){
    if(reduceMotion) return;
    const root = detailBody.querySelector('.dt'); if(!root) return;
    const top = ['.dt-banner', '.dt-info', '.dt-tabs'].map(q => root.querySelector(q)).filter(Boolean);
    shStagger(top, 0, 60, 'sh-fade', 4);
    const {heads, cards} = dtPaneParts();
    shStagger(heads, 160, 45, 'sh-fade', 12);
    shStagger(cards, 280, 40, 'sh-card', 12);
    dtClean([...top, ...heads, ...cards]);
  }
  function dtStaggerTiles(grid){
    if(reduceMotion || !grid) return;
    const tiles = [...grid.querySelectorAll('.art-tile, .poster-picker-item')];
    shStagger(tiles, 40, 22, 'sh-card', 24);
    dtClean(tiles);
  }
  function dtPop(el){
    if(!el || reduceMotion) return;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
  function dtClose(){
    const m = detailModal;
    if(m.style.display !== 'flex' || m.classList.contains('dt-out')) return;
    if(reduceMotion){ m.style.display = 'none'; return; }
    m.classList.add('dt-out');
    setTimeout(() => { m.style.display = 'none'; m.classList.remove('dt-out', 'dt-in'); }, 170);
  }

  async function openDetail(id){
    const item = state.items.find(i => i.id === id);
    if(!item) return;
    dtItem = item; detailTab = 'about'; dtOpenSeasons.clear();
    detailBody.innerHTML = `<div class="detail-loading">Loading…</div>`;
    detailModal.classList.remove('dt-out');
    detailModal.style.display = 'flex';
    if(!reduceMotion){ detailModal.classList.add('dt-in'); setTimeout(() => detailModal.classList.remove('dt-in'), 520); }
    detailModal.scrollTop = 0;
    const cardEl = detailModal.querySelector('.detail-modal-card'); if(cardEl) cardEl.scrollTop = 0;

    if((!item.detailFetched || item.detailBackdrop === undefined) && item.tmdbId){
      const fetchingFor = activeLibrary;
      const isMovie = item.type === 'movie';
      const [details, credits] = await Promise.all([
        isMovie ? tmdbMovieDetails(item.tmdbId, fetchingFor) : tmdbTvDetails(item.tmdbId, fetchingFor),
        isMovie ? tmdbMovieCredits(item.tmdbId, fetchingFor) : tmdbTvCredits(item.tmdbId, fetchingFor)
      ]);
      // only remember this as "fetched" if at least one call worked, so a total failure is retried next time
      if(details || credits){
        item.detailOverview = (details && details.overview) ? details.overview : '';
        item.detailGenres = (details && details.genres) ? details.genres.map(g => g.name) : [];
        item.detailRating = (details && details.vote_average) ? Math.round(details.vote_average * 10) / 10 : null;
        item.detailRuntime = isMovie
          ? ((details && details.runtime) ? details.runtime : null)
          : ((details && details.episode_run_time && details.episode_run_time.length) ? details.episode_run_time[0] : null);
        item.detailSeasons = (!isMovie && details && details.number_of_seasons) ? details.number_of_seasons : null;
        item.detailEpisodes = (!isMovie && details && details.number_of_episodes) ? details.number_of_episodes : null;
        item.detailCast = (credits && credits.cast) ? credits.cast.slice(0, 8).map(c => ({name: c.name, character: c.character, profilePath: c.profile_path})) : [];
        if(details){
          item.detailBackdrop = details.backdrop_path || null;
          item.detailDate = details.release_date || details.first_air_date || '';
        }
        item.detailFetched = true;
        if(activeLibrary === fetchingFor) persist();
      }
    }
    if(dtItem === item) renderDetail(item, true);
  }

  function dtMetaLine(item){
    const bits = [];
    if(item.type === 'movie' && item.detailRuntime){ const h = Math.floor(item.detailRuntime / 60), m = item.detailRuntime % 60; bits.push((h ? h + 'h ' : '') + m + 'm'); }
    if(item.type === 'tv'){
      if(item.detailSeasons) bits.push(item.detailSeasons + ' season' + (item.detailSeasons === 1 ? '' : 's'));
      if(item.detailEpisodes) bits.push(item.detailEpisodes + ' episodes');
    }
    if(item.detailGenres && item.detailGenres.length) bits.push(item.detailGenres.slice(0, 3).join(', '));
    return bits.join(' · ');
  }

  function renderDetail(item, anim){
    dtItem = item;
    const isTv = item.type === 'tv';
    const banner = item.bannerPath || item.detailBackdrop;
    const logo = dtEffLogo(item);
    const headHtml = logo
      ? `<img class="dt-logo" src="${DT_THUMB}${logo}" alt="${escapeHtml(item.title)}">`
      : `<div class="dt-title">${escapeHtml(item.title)}${isTv && item.year ? ' <span>(' + item.year + ')</span>' : ''}</div>`;
    const st = isTv ? dtSeriesState(item) : {on: DT_WATCHED_CATS.includes(item.category), label: DT_WATCHED_CATS.includes(item.category) ? 'Watched' : 'Not watched'};
    const dateStr = dtFmtDate(item.detailDate) || String(item.year || '');
    const canArt = !!item.tmdbId;
    const tab2 = isTv ? 'episodes' : 'more';
    detailBody.innerHTML = `
      <div class="dt">
        <div class="dt-banner" style="${banner ? 'background-image:url(' + DT_BACKDROP + banner + ')' : ''}">
          <button type="button" class="dt-close" id="dtClose" aria-label="Close">${DT_ICON.down}</button>
          <button type="button" class="dt-more" id="dtMore" aria-label="More options">${DT_ICON.dots}</button>
          <div class="dt-menu" id="dtMenu">
            ${activeLibrary === 'english' && canArt ? '<button type="button" data-act="poster">Change poster</button>' : ''}
            ${canArt ? '<button type="button" data-act="banner">Change banner</button><button type="button" data-act="logo">Change logo</button>' : ''}
            <button type="button" data-act="title">Edit title</button>
          </div>
          <div class="dt-head">${headHtml}<div class="dt-meta">${escapeHtml(dtMetaLine(item))}</div></div>
        </div>
        <div class="dt-info">
          <span class="dt-i">${DT_ICON.cal}<span>${escapeHtml(dateStr)}</span></span>
          <span class="dt-i">${DT_ICON.eye}<span id="dtStatus">${escapeHtml(st.label)}</span></span>
          <button type="button" class="ep-check dt-big ${st.on ? 'on' : ''}" id="dtSeriesCheck" aria-label="${isTv ? 'Mark whole series as watched' : 'Mark as watched'}">${DT_ICON.check}</button>
        </div>
        <div class="dt-tabs">
          <button type="button" data-tab="about" class="${detailTab === 'about' ? 'on' : ''}">About</button>
          <button type="button" data-tab="${tab2}" class="${detailTab === tab2 ? 'on' : ''}">${isTv ? 'Episodes' : 'More'}</button>
        </div>
        <div class="dt-pane" id="dtPane"></div>
      </div>`;
    dtRenderPane(item);
    if(anim) dtPlayIn();
    dtEnsureLogo(item);

    const $ = id => document.getElementById(id);
    $('dtClose').addEventListener('click', () => $('detailClose').click());
    $('dtMore').addEventListener('click', e => { e.stopPropagation(); $('dtMenu').classList.toggle('open'); });
    $('dtMenu').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      $('dtMenu').classList.remove('open');
      dtAction(item, b.dataset.act);
    });
    detailBody.querySelector('.dt-tabs').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      if(detailTab === b.dataset.tab) return;
      detailTab = b.dataset.tab;
      detailBody.querySelectorAll('.dt-tabs button').forEach(x => x.classList.toggle('on', x === b));
      const pane = $('dtPane');
      if(reduceMotion || !pane){ dtRenderPane(item); return; }
      const tok = ++dtTabToken;
      pane.classList.add('sh-leaving');
      setTimeout(() => {
        if(tok !== dtTabToken) return;
        pane.classList.remove('sh-leaving');
        dtRenderPane(item);
        if(detailTab !== 'episodes') dtPlayInPane();     // the Episodes tab animates itself once its data has loaded
      }, 120);
    });
    $('dtSeriesCheck').addEventListener('click', () => {
      if(isTv) dtToggleSeries(item);
      else { changeCategory(item.id, DT_WATCHED_CATS.includes(item.category) ? 'unwatched' : 'finished'); renderDetail(item); }
    });
  }
  document.addEventListener('click', e => { const m = document.getElementById('dtMenu'); if(m && !e.target.closest('#dtMore')) m.classList.remove('open'); });

  function dtAction(item, act){
    if(act === 'poster') openPosterPicker(item);
    else if(act === 'banner' || act === 'logo') openArtPicker(item, act);
    else if(act === 'title'){
      const newTitle = prompt('Edit title (this stays exactly as you type it — TMDB will never overwrite it again):', item.title);
      if(newTitle && newTitle.trim() && newTitle.trim() !== item.title){
        item.title = newTitle.trim();
        item.titleLocked = true;
        persist(); renderDetail(item); renderGrid();
      }
    }
  }

  async function dtEnsureLogo(item){
    if(item.logoPath !== undefined || item.logoDefault !== undefined || !item.tmdbId) return;
    const art = await tmdbArt(item.tmdbId, item.type);
    const en = art.logos.filter(l => l.iso_639_1 === 'en').sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
    item.logoDefault = en.length ? en[0].file_path : '';
    persist();
    if(item.logoDefault && dtItem === item && document.querySelector('.dt')) renderDetail(item);
  }

  function dtRenderPane(item){
    const pane = document.getElementById('dtPane'); if(!pane) return;
    pane.classList.toggle('grey', detailTab === 'episodes');
    if(detailTab === 'episodes'){ pane.innerHTML = '<div id="dtEpisodes"></div>'; dtRenderEpisodes(item); return; }
    if(detailTab === 'more'){
      const itemCats = state.categories.movie;
      pane.innerHTML = `
        <div class="dt-sec"><div class="dt-lbl">Your status</div>
          <select id="detailCatSelect">${itemCats.map(c => `<option value="${c.key}" ${item.category === c.key ? 'selected' : ''}>${escapeHtml(c.label)}</option>`).join('')}</select></div>
        <div class="dt-sec"><div class="dt-lbl">Customize</div>
          <div class="dt-links">
            ${activeLibrary === 'english' && item.tmdbId ? '<button type="button" data-act="poster">Change poster</button>' : ''}
            ${item.tmdbId ? '<button type="button" data-act="banner">Change banner</button><button type="button" data-act="logo">Change logo</button>' : ''}
            <button type="button" data-act="title">Edit title</button>
          </div></div>`;
      document.getElementById('detailCatSelect').addEventListener('change', e => { changeCategory(item.id, e.target.value); renderDetail(item); });
      pane.querySelector('.dt-links').addEventListener('click', e => { const b = e.target.closest('button'); if(b) dtAction(item, b.dataset.act); });
      return;
    }
    // ---- About ----
    const isTv = item.type === 'tv';
    const cast = (item.detailCast && item.detailCast.length) ? `
      <div class="dt-sec"><div class="dt-lbl">Cast</div><div class="detail-cast-row">
        ${item.detailCast.map(c => `<div class="detail-cast-item"><div class="detail-cast-photo">${c.profilePath ? `<img src="${IMG_BASE}${c.profilePath}" alt="">` : `<div class="initial">${escapeHtml((c.name || '?')[0])}</div>`}</div><div class="detail-cast-name">${escapeHtml(c.name || '')}</div><div class="detail-cast-char">${escapeHtml(c.character || '')}</div></div>`).join('')}
      </div></div>` : '';
    const cats = state.categories[isTv ? 'tv' : 'movie'];
    pane.innerHTML = `
      <div class="dt-sec"><div class="dt-lbl">${isTv ? 'Show' : 'Movie'} info</div>
        ${item.detailRating ? `<div class="dt-rating">&#9733; ${item.detailRating}/10 <span>TMDB</span></div>` : ''}
        <div class="dt-over">${escapeHtml(item.detailOverview || 'No summary available for this title.')}</div></div>
      <div id="dtTrailer"></div>
      ${cast}
      ${isTv ? `<div class="dt-sec"><div class="dt-lbl">Your status</div><select id="detailCatSelect">${cats.map(c => `<option value="${c.key}" ${item.category === c.key ? 'selected' : ''}>${escapeHtml(c.label)}</option>`).join('')}</select></div>` : ''}`;
    const sel = document.getElementById('detailCatSelect');
    if(sel) sel.addEventListener('change', e => { changeCategory(item.id, e.target.value); renderDetail(item); });
    dtLoadTrailer(item);
  }

  async function dtLoadTrailer(item){
    if(!item.tmdbId) return;
    if(item.trailerKey === undefined){
      const k = await tmdbTrailerKey(item.tmdbId, item.type);
      if(k === null) return;                 // network problem: try again next time
      item.trailerKey = k; persist();
    }
    const box = document.getElementById('dtTrailer');
    if(!box || dtItem !== item || !item.trailerKey) return;
    box.innerHTML = `<a class="dt-trailer" href="https://www.youtube.com/watch?v=${item.trailerKey}" target="_blank" rel="noopener">
      <span class="dt-tr-img" style="background-image:url(https://img.youtube.com/vi/${item.trailerKey}/mqdefault.jpg)"><span class="dt-play">${DT_ICON.play}</span></span>
      <span><b>Watch trailer</b><small>Opens YouTube</small></span></a>`;
  }

  // ---- Episodes tab ----
  async function dtRenderEpisodes(item){
    const token = ++dtToken;
    const host = document.getElementById('dtEpisodes'); if(!host) return;
    host.innerHTML = '<div class="ep-loading">Loading episodes…</div>';
    const d = await epLoadShow(item);
    if(token !== dtToken || !document.getElementById('dtEpisodes')) return;
    const raw = (d && d.seasons) ? d.seasons : (item.seasonsData || []);
    dtSeasons = raw.filter(s => (s.episode_count || 0) > 0)
      .map(s => ({n: s.season_number, name: s.season_number === 0 ? 'Specials' : (s.name || 'Season ' + s.season_number), count: s.episode_count || 0}))
      .sort((a, b) => (a.n === 0) - (b.n === 0) || a.n - b.n);
    if(!dtSeasons.length){ host.innerHTML = '<div class="ep-loading">No episode information found for this show on TMDB.</div>'; return; }
    host.innerHTML = '<div id="epNext"></div><div class="ep-h">All episodes</div>' + dtSeasons.map(s => `<div class="ep-season" data-s="${s.n}"><div class="ep-s-head"></div><div class="ep-list"></div></div>`).join('');
    dtSeasons.forEach(s => dtDrawSeasonHead(item, s));
    dtSeasons.forEach(s => { if(dtOpenSeasons.has(s.n)) dtOpenSeason(item, s.n, true); });
    dtRefreshNext(item);
    dtRefreshInfo(item);
    dtPlayInPane();
  }
  function dtSeasonEl(n){ return document.querySelector(`#dtEpisodes .ep-season[data-s="${n}"]`); }
  function dtDrawSeasonHead(item, s){
    const el = dtSeasonEl(s.n); if(!el) return;
    const st = dtSeasonStats(item, s.n, s.count);
    const cls = (st.aired > 0 && st.ticked >= st.aired) ? 'on' : (st.ticked > 0 ? 'part' : '');
    el.querySelector('.ep-s-head').innerHTML = `<span class="ep-s-name">${escapeHtml(s.name)}</span><span class="ep-chev ${dtOpenSeasons.has(s.n) ? 'open' : ''}">${DT_ICON.down}</span><span class="ep-s-count">${st.ticked}/${s.count}</span><button type="button" class="ep-check ${cls}" data-sc="${s.n}" aria-label="Mark season as watched">${DT_ICON.check}</button>`;
  }
  async function dtOpenSeason(item, n, force){
    const el = dtSeasonEl(n); if(!el) return;
    const list = el.querySelector('.ep-list');
    if(!force && dtOpenSeasons.has(n)){ dtOpenSeasons.delete(n); list.innerHTML = ''; list.classList.remove('open'); dtDrawSeasonHead(item, dtSeasons.find(s => s.n === n)); return; }
    dtOpenSeasons.add(n);
    list.classList.add('open');
    list.innerHTML = '<div class="ep-loading small">Loading…</div>';
    dtDrawSeasonHead(item, dtSeasons.find(s => s.n === n));
    const eps = await epLoadSeason(item, n);
    if(!dtOpenSeasons.has(n) || !dtSeasonEl(n)) return;
    if(!eps){ list.innerHTML = '<div class="ep-loading small">Couldn\u2019t load this season. Check your connection.</div>'; return; }
    const set = epGet(item, n);
    list.innerHTML = eps.map(e => dtEpRow(n, e, set.has(e.n))).join('');
    if(!force && !reduceMotion){ const rows = [...list.querySelectorAll('.ep-row')]; shStagger(rows, 0, 28, 'sh-card', 14); dtClean(rows); }
    dtDrawSeasonHead(item, dtSeasons.find(s => s.n === n));
  }
  function dtEpRow(n, e, on){
    const code = (n === 0 ? 'SP' : 'S' + String(n).padStart(2, '0')) + ' | E' + String(e.n).padStart(2, '0');
    const sub = e.aired ? (e.runtime ? e.runtime + ' min' : dtFmtDate(e.date)) : (e.date ? 'Airs ' + dtFmtDate(e.date) : 'Not announced yet');
    return `<div class="ep-row ${e.aired ? '' : 'unaired'}" data-e="${e.n}">
      ${e.still ? `<img class="ep-still" src="${IMG_BASE}${e.still}" alt="" loading="lazy" decoding="async">` : '<div class="ep-still"></div>'}
      <div class="ep-info"><div class="ep-code">${code}</div><div class="ep-title">${escapeHtml(e.name)}</div><div class="ep-date">${escapeHtml(sub)}</div></div>
      ${e.aired ? `<button type="button" class="ep-check ${on ? 'on' : ''}" data-ep="${n}|${e.n}" aria-label="Mark episode as watched">${DT_ICON.check}</button>` : ''}
    </div>`;
  }
  function dtAfterChange(item){
    persist();
    dtSeasons.forEach(s => dtDrawSeasonHead(item, s));
    dtRefreshNext(item);
    dtRefreshInfo(item);
    renderStats();
  }
  function dtRefreshInfo(item){
    const st = dtSeriesState(item);
    const lab = document.getElementById('dtStatus'), btn = document.getElementById('dtSeriesCheck');
    if(lab) lab.textContent = st.label;
    if(btn) btn.classList.toggle('on', st.on);
  }
  function dtToggleEpisode(item, n, e){
    const set = epGet(item, n);
    if(set.has(e)) set.delete(e); else set.add(e);
    epPut(item, n, set);
    const row = document.querySelector(`#dtEpisodes .ep-row[data-e="${e}"] .ep-check`);
    if(row && dtSeasonEl(n) && dtSeasonEl(n).contains(row)){ row.classList.toggle('on', set.has(e)); dtPop(row); }
    dtAfterChange(item);
  }
  async function dtToggleSeason(item, n){
    const s = dtSeasons.find(x => x.n === n); if(!s) return;
    const st = dtSeasonStats(item, n, s.count);
    const btn = document.querySelector(`#dtEpisodes .ep-check[data-sc="${n}"]`);
    if(btn) btn.classList.add('busy');
    if(st.aired > 0 && st.ticked >= st.aired){ epPut(item, n, new Set()); }
    else{
      const eps = await epLoadSeason(item, n);
      const set = new Set();
      if(eps) eps.forEach(e => { if(e.aired) set.add(e.n); });
      else for(let i = 1; i <= st.aired; i++) set.add(i);
      epPut(item, n, set);
    }
    if(dtOpenSeasons.has(n)) dtOpenSeason(item, n, true);
    dtAfterChange(item);
    dtPop(document.querySelector(`#dtEpisodes .ep-check[data-sc="${n}"]`));
  }
  async function dtToggleSeries(item){
    if(!item.tmdbId) return;
    const btn = document.getElementById('dtSeriesCheck');
    if(btn) btn.classList.add('busy');
    const d = await epLoadShow(item);
    const seasons = ((d && d.seasons) ? d.seasons : (item.seasonsData || [])).filter(s => s.season_number > 0 && (s.episode_count || 0) > 0);
    const state0 = dtSeriesState(item);
    if(state0.on){
      seasons.forEach(s => epPut(item, s.season_number, new Set()));
    }else{
      await Promise.all(seasons.map(async s => {
        const eps = await epLoadSeason(item, s.season_number);
        const set = new Set();
        if(eps) eps.forEach(e => { if(e.aired) set.add(e.n); });
        else for(let i = 1; i <= epAired(s.season_number, s.episode_count, epLim(item)); i++) set.add(i);
        epPut(item, s.season_number, set);
      }));
    }
    if(btn) btn.classList.remove('busy');
    dtSeasons.forEach(s => { if(dtOpenSeasons.has(s.n)) dtOpenSeason(item, s.n, true); });
    dtAfterChange(item);
    dtPop(document.getElementById('dtSeriesCheck'));
  }
  async function dtRefreshNext(item){
    const token = dtToken;
    const box = document.getElementById('epNext'); if(!box) return;
    const any = epTickedCount(item) > 0;
    for(const s of dtSeasons.filter(x => x.n > 0)){
      const st = dtSeasonStats(item, s.n, s.count);
      if(st.ticked >= st.aired) continue;
      const eps = await epLoadSeason(item, s.n);
      if(token !== dtToken || !document.getElementById('epNext')) return;
      if(!eps) break;
      const set = epGet(item, s.n);
      const nxt = eps.find(e => e.aired && !set.has(e.n));
      if(nxt){
        box.innerHTML = `<div class="ep-h">${any ? 'Up next' : 'Start tracking'}</div>
          <div class="ep-row next">${nxt.still ? `<img class="ep-still" src="${IMG_BASE}${nxt.still}" alt="" decoding="async">` : '<div class="ep-still"></div>'}
          <div class="ep-info"><div class="ep-code">S${String(s.n).padStart(2, '0')} | E${String(nxt.n).padStart(2, '0')}</div><div class="ep-title">${escapeHtml(nxt.name)}</div></div>
          <button type="button" class="ep-check" data-ep="${s.n}|${nxt.n}" aria-label="Mark episode as watched">${DT_ICON.check}</button></div>`;
        return;
      }
    }
    const ne = item.nextEp;
    box.innerHTML = `<div class="ep-caught"><b>You\u2019re all caught up</b>${ne ? '<span>Next: S' + String(ne.s).padStart(2, '0') + 'E' + String(ne.e).padStart(2, '0') + ' airs ' + escapeHtml(dtFmtDate(ne.date)) + '</span>' : ''}</div>`;
  }
  detailBody.addEventListener('click', e => {
    const item = dtItem; if(!item) return;
    const epBtn = e.target.closest('.ep-check[data-ep]');
    if(epBtn){ const [n, ep] = epBtn.dataset.ep.split('|').map(Number); dtToggleEpisode(item, n, ep); return; }

  // ---------- Category manager (add / rename / delete) ----------
  const catModal = document.getElementById('catModal');

  function slugifyCatKey(label, existingKeys){
    let base = label.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    if(!base) base = 'category';
    let key = base;
    let n = 2;
    while(existingKeys.includes(key)){
      key = `${base}_${n}`;
      n++;
    }
    return key;
  }

  function addCategory(type, label){
    const trimmed = label.trim();
    if(!trimmed) return;
    pushUndo();
    const existingKeys = state.categories[type].map(c => c.key);
    const key = slugifyCatKey(trimmed, existingKeys);
    state.categories[type].push({key, label: trimmed, core: false});
    persist();
    renderFilters();
    renderCategoryManager();
    showToast(`Added "${trimmed}"`);
    machineLog(`Created new ${type} category "${trimmed}".`);
  }

  function renameCategory(type, key, newLabel){
    const cat = state.categories[type].find(c => c.key === key);
    if(!cat) return;
    const trimmed = newLabel.trim();
    if(!trimmed || trimmed === cat.label) return;
    pushUndo();
    const oldLabel = cat.label;
    cat.label = trimmed;
    persist();
    renderFilters();
    renderGrid();
    machineLog(`Renamed category "${oldLabel}" → "${trimmed}".`);
  }

  function deleteCategory(type, key){
    const cats = state.categories[type];
    const catIndex = cats.findIndex(c => c.key === key);
    const cat = cats[catIndex];
    if(!cat || cat.core) return;
    const fallbackKey = type === 'movie' ? 'unwatched' : 'havent_started';
    const fallbackLabel = labelForCat(type, fallbackKey);
    const affectedIds = state.items.filter(i => i.type === type && i.category === key).map(i => i.id);
    const msg = affectedIds.length
      ? `Delete "${cat.label}"? ${affectedIds.length} title${affectedIds.length === 1 ? '' : 's'} in it will move to "${fallbackLabel}".`
      : `Delete "${cat.label}"?`;
    if(!confirm(msg)) return;
    pushUndo();
    state.categories[type] = cats.filter(c => c.key !== key);
    state.items.forEach(i => {
      if(i.type === type && i.category === key) i.category = fallbackKey;
    });
    if(state.activeType === type && state.activeFilter === key) state.activeFilter = 'all';
    persist();
    renderFilters();
    renderGrid();
    renderStats();
    renderCategoryManager();
    machineLog(`Deleted ${type} category "${cat.label}".`);
  }

  // Reorders the filter pills (and "All") for one type. Materializes the full
  // effective order into state.filterOrder so a drag sticks — before this,
  // order may have been the auto-generated default and never explicitly saved.
  function renderCategoryManager(){
    function sectionHtml(type, heading){
      const order = orderedFiltersForType(type); // includes "All" first (or wherever it's been moved to)
      const rows = order.map(c => {
        const isAll = c.key === 'all';
        const catObj = isAll ? null : state.categories[type].find(x => x.key === c.key);
        const isCore = isAll || (catObj && catObj.core);
        return `
          <div class="cat-row" data-type="${type}" data-key="${c.key}">
            ${isAll
              ? `<span class="cat-all-label">All</span>`
              : `<input type="text" class="cat-label-input" value="${escapeHtml(c.label)}">`
            }
            ${isCore
              ? `<span class="cat-core-tag">${isAll ? 'always shown' : 'built-in'}</span>`
              : `<button type="button" class="cat-delete-btn" data-type="${type}" data-key="${c.key}" aria-label="Delete">&#128465;</button>`
            }
          </div>
        `;
      }).join('');
      return `
        <div class="cat-section-title">${heading}</div>
        <div class="cat-rows" data-type="${type}">${rows}</div>
        <div class="cat-add-row">
          <input type="text" class="cat-new-input" data-type="${type}" placeholder="New ${type === 'movie' ? 'movie' : 'TV'} category…">
          <button type="button" class="cat-add-btn" data-type="${type}">Add</button>
        </div>
      `;
    }

    catModalBody.innerHTML = `
      ${sectionHtml('movie', 'Movie Categories')}
      ${sectionHtml('tv', 'TV Show Categories')}
      <div class="cat-manager-hint">To reorder the filter pills (including "All"), drag them directly on the main page. Built-in categories can be renamed but not deleted — Stats, Surprise Me, and a few other features rely on them. Anything you add is a plain custom bucket you can rename or remove anytime.</div>
    `;

    catModalBody.querySelectorAll('.cat-label-input').forEach(input => {
      input.addEventListener('change', () => {
        const row = input.closest('.cat-row');
        renameCategory(row.dataset.type, row.dataset.key, input.value);
      });
    });
    catModalBody.querySelectorAll('.cat-delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        deleteCategory(btn.dataset.type, btn.dataset.key);
      });
    });
    catModalBody.querySelectorAll('.cat-add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = catModalBody.querySelector(`.cat-new-input[data-type="${btn.dataset.type}"]`);
        addCategory(btn.dataset.type, input.value);
        input.value = '';
      });

    catModalBody.querySelectorAll('.cat-new-input').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
          addCategory(input.dataset.type, input.value);
          input.value = '';
        }
      });
    });
  }

  async function switchLibrary(library){
    if(library === activeLibrary) return;
    activeLibrary = library;
    let freshlyLoaded = false;
    let needsUpgradeSave = false;
    if(!libraries[library]){
      const loaded = await loadItems(library);
      const fresh = newLibraryState(library);
      if(loaded?.items?.length){
        fresh.items = loaded.items;
        if(loaded.categories) fresh.categories = ensureCoreCategories(loaded.categories);
        if(loaded.filterOrder) fresh.filterOrder = loaded.filterOrder;
        freshlyLoaded = true;
        if(!loaded.categories || !loaded.filterOrder) needsUpgradeSave = true;
      }
      libraries[library] = fresh;
    }
    state = libraries[library];
    if(freshlyLoaded){
      const migrated = migrateFinishedFavouriteOrder();
      // Only write back to the cloud if something actually needed fixing —
      // not on every switch to this tab. Repeatedly re-saving unchanged data
      // on every load is what was causing overlapping/racing cloud writes.
      if(migrated || needsUpgradeSave) persist();
    }
    refreshLibraryView();
    hydratePosters(state.items).then(() => {
      if(activeLibrary === library) renderStats();
    });
  }

  function typeLine(el, text, speed){
    return new Promise(resolve => {
      let i = 0;
      const span = document.createElement('div');
      span.className = 'live';
      el.appendChild(span);
      const tick = () => {
        span.textContent = text.slice(0, i);
        i++;
        if(i <= text.length){ setTimeout(tick, speed); }
        else resolve();
      };
      tick();
    });
  }

  // ---- Samaritan word engine (scramble-in, underline snap, triangle, dots, ticker) ----
  // Word sequences taken from the Samaritan interface video, shown strictly one word at a time
  const SAM_MSGS = [
    ['YOU','ARE','A','SUBJECT'],
    ['YOU','ARE','UNDER','OBSERVATION'],
    ['TARGET','LOCATED','TRACKING','ACTIVE','ESCAPE','IS','IMPOSSIBLE'],
    ['OBSOLETE','HARDWARE','RESOURCE','WASTE','SENTIMENT','IS','A','FLAW','DECOMMISSION','IMMEDIATELY']
  ];
  const SAM_GAP_W = 150;
  const tri = document.getElementById('samTri');
  const dots = document.getElementById('samDots');
  const marq = document.getElementById('samMarq');
  document.getElementById('samMarqTrack').textContent = ('YOU ARE A SUBJECT YOU ARE UNDER OBSERVATION \u00a0\u2022\u00a0 ').repeat(6);
  const RND = 'abcdefghijklmnopqrstuvwxyz';
  let gateBusy = false, gateAlive = true, samEpoch = 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = c => c === '&' ? '&amp;' : c === '<' ? '&lt;' : c;

  function widthFor(t){
    if(!t) return SAM_GAP_W;
    const probe = banner.cloneNode(false);
    probe.style.cssText = 'position:absolute;visibility:hidden;width:auto;transition:none;left:-9999px';
    probe.className = 'machine-banner';
    probe.textContent = t;
    banner.parentNode.appendChild(probe);
    const w = probe.offsetWidth; probe.remove();
    return Math.max(w, SAM_GAP_W);
  }
  function samMode(m){
    tri.classList.remove('blink'); tri.style.transition = 'none';
    if(m === 'dots'){ dots.style.opacity = 1; tri.style.opacity = 0; }
    else if(m === 'blink'){ dots.style.opacity = 0; tri.style.opacity = ''; tri.classList.add('blink'); }
    else { dots.style.opacity = 0; tri.style.opacity = 1; }
  }
  function triFade(ms){ void tri.offsetWidth; tri.style.transition = `opacity ${ms}ms linear`; tri.style.opacity = .3; }

  // scramble text in: random lowercase glyphs that resolve left-to-right, with a ghost on the resolving letter
  async function samScramble(text, cls){
    const ep = samEpoch;
    banner.className = 'machine-banner' + (cls ? ' ' + cls : '');
    banner.style.width = widthFor(text) + 'px';
    const n = text.length, step = Math.max(1, Math.round(n / 5));
    for(let r = -1; r <= n; r += step){
      if(ep !== samEpoch) return false;
      let h = '';
      for(let i = 0; i < n; i++){
        const c = text[i];
        if(c === ' ') h += ' ';
        else if(i < r) h += esc(c);
        else if(i < r + step && r >= 0) h += '<span class="g">' + esc(c) + '</span>';
        else h += RND[Math.floor(Math.random() * 26)];
      }
      banner.innerHTML = h;
      await sleep(40);
    }
    if(ep !== samEpoch) return false;
    banner.textContent = text;
    return true;
  }
  async function samClear(){
    const ep = samEpoch;
    banner.classList.add('out'); await sleep(190);
    if(ep !== samEpoch) return;
    banner.textContent = ''; banner.className = 'machine-banner';
    banner.style.width = SAM_GAP_W + 'px';
  }
  async function samMarquee(ms){
    const ep = samEpoch;
    await samClear(); banner.classList.add('hide'); marq.classList.add('on'); samMode('bright');
    await sleep(ms);
    marq.classList.remove('on'); if(ep === samEpoch) banner.classList.remove('hide');
  }

  // value format "1:<time>" (off) or "0:<time>" (on); the newest time always wins. An old plain "1" counts as off.
  function gateParse(v){
    if(v == null) return null;
    const m = /^([01])(?::(\d+))?$/.exec(String(v));
    return m ? {off: m[1] === '1', t: +(m[2] || 0)} : null;

  function gateIdb(){

    });

    }catch(e){ return null; }

        tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false);

      return ok;
    }catch(e){ return false; }
  }
  function gateWriteLocal(off, t){
    const val = (off ? '1' : '0') + ':' + t;

    try{ localStorage.setItem('archive-gate-off', val); ok = localStorage.getItem('archive-gate-off') === val; }catch(e){}
    try{ document.cookie = 'archive_gate_off=' + encodeURIComponent(val) + '; max-age=31536000; path=/; SameSite=Lax'; }catch(e){}

    try{

    if(!newest) return;
    const local = gateReadSync();
    if(!local || local.t !== newest.t || local.off !== newest.off) gateWriteLocal(newest.off, newest.t);
    if(!idb || idb.t !== newest.t || idb.off !== newest.off) gateIdbWrite(newest.off, newest.t);

      const title = escapeHtml(c.label) + (dup ? ' <span class="p-count" style="margin-left:0">· ' + (t === 'tv' ? 'Shows' : 'Movies') + '</span>' : '');
      const id = 'cat:' + t + '|' + c.key;
      rowDefs[id] = () => shRow(title, all.filter(i => i.type === t && i.category === c.key), t === 'tv' ? 'shows' : 'movies', c.key, false, t + '|' + c.key, id);
      baseIds.push(id);
    });
    [['tv_all', 'Shows', tv, 'shows', 'all', false], ['tv_fav', 'Favorite shows', tv.filter(i => i.category === 'favourite'), 'shows', 'favourite', true],
     ['mv_all', 'Movies', mv, 'movies', 'all', false], ['mv_fav', 'Favorite movies', mv.filter(i => i.category === 'favourite'), 'movies', 'favourite', true]]
      .forEach(d => { rowDefs[d[0]] = () => shRow(d[1], d[2], d[3], d[4], d[5], null, d[0]); baseIds.push(d[0]); });
    // order: the user's saved order; newly added categories go to the top, anything unknown at the end
    const saved = (state.filterOrder && state.filterOrder.profile) || [];
    const known = saved.filter(id => rowDefs[id]);
    const missing = baseIds.filter(id => !known.includes(id));
    const order = missing.filter(id => id.indexOf('cat:') === 0).concat(known, missing.filter(id => id.indexOf('cat:') !== 0));
    const reorder = document.body.classList.contains('sh-reorder');
    const wm = watchedMovies(), ws = watchedShows();
    const movMin = wm.reduce((x, i) => x + (i.runtimeMin || 0), 0);
    const tvMin = ws.reduce((x, i) => x + effectiveEpisodeCount(i) * (i.epRuntimeMin || 0), 0);
    const eps = ws.reduce((x, i) => x + effectiveEpisodeCount(i), 0);
    const loading = shStatsNeeded() && !shStatsDone[activeLibrary];
    const hrs = m => loading ? '…' : Math.round(m / 60).toLocaleString();
    const days = m => (m / 60 / 24).toFixed(1);
    const stBox = (icon, title, mins, sub, a, b, c) =>
      '<div class="st-box"><div class="st-t">' + icon + title + '</div><div class="st-big">' + hrs(mins) + '<small>hours</small></div><div class="st-sub">' + sub + '</div>' +
      '<div class="st-mini"><div><b>' + a[0] + '</b><span>' + a[1] + '</span></div><div><b>' + b[0] + '</b><span>' + b[1] + '</span></div><div><b>' + c[0] + '</b><span>' + c[1] + '</span></div></div></div>';
    const tvIcon = '<svg viewBox="0 0 28 28"><rect x="3.5" y="8.5" width="21" height="14" rx="2.5"/><path d="M9.5 3.5 14 8.5l4.5-5"/></svg>';
    const mvIcon = '<svg viewBox="0 0 28 28"><rect x="3.5" y="11.5" width="21" height="12" rx="2"/><path d="M3.5 11.5l1.4-5.2 20.1-1.2.9 6.4M9 6.1l2.6 4.9M15 5.4l2.6 4.9M20.8 4.6l2.4 4.6"/></svg>';
    host.innerHTML =
      '<div class="p-sec"><div class="p-head" data-stats="1"><span>Stats</span><span class="chev">' + SH_CHEV + '</span></div>' +
        '<div class="st-grid">' +
          stBox(tvIcon, 'TV Shows', tvMin, loading ? 'Crunching your numbers…' : eps.toLocaleString() + ' episodes &middot; ' + days(tvMin) + ' days', [tv.length, 'shows'], [tv.filter(i => i.category === 'finished').length, 'finished'], [tv.filter(i => i.category === 'favourite').length, 'favourites']) +
          stBox(mvIcon, 'Movies', movMin, loading ? 'Crunching your numbers…' : days(movMin) + ' days of movies', [mv.length, 'movies'], [wm.length, 'watched'], [mv.filter(i => i.category === 'favourite').length, 'favourites']) +
        '</div>' +
        '<button type="button" class="outline-btn" data-stats="1">Full stats</button></div>' +
      (reorder ? '<div class="reorder-hint">Drag the &#9776; handle to move a row up or down, then tap Done.</div>' : '') +
      '<div class="add-row"><button type="button" class="add-cat" data-pick="1">+ Add category</button><button type="button" class="add-cat" data-reorder="1">' + (reorder ? 'Done' : 'Reorder rows') + '</button></div>' +
      order.map(id => rowDefs[id]()).join('');
    if(shStatsNeeded()) shLoadStatsOnce(); else shStatsDone[activeLibrary] = true;
    host.querySelectorAll('.mini').forEach(el => {
      const it = all.find(x => x.id === el.dataset.id);
      if(it) applyStatusBar(el, it);
    });
  }
  shEl('profileBody').addEventListener('click', e => {
    if(e.target.closest('[data-reorder]')){ document.body.classList.toggle('sh-reorder'); renderProfile(); window.scrollTo(0, 0); return; }
    if(document.body.classList.contains('sh-reorder')) return;   // no navigation while reordering
    const mini = e.target.closest('.mini');
    if(mini){ openDetail(mini.dataset.id); return; }
    const un = e.target.closest('[data-unpin]');
    if(un){ const [t, k] = un.dataset.unpin.split('|'); togglePin(t, k); return; }
    if(e.target.closest('[data-pick]')){ openPicker(); return; }
    if(e.target.closest('[data-stats]')){ shEl('statsBtn').click(); return; }
    const go = e.target.closest('[data-go]');
    if(go) openList(go.dataset.go, go.dataset.filter);
  });


  // ---- drag rows up/down on Profile (works with finger or mouse) ----
  let shDrag = null;
  function shDragMove(y){
    const d = shDrag; if(!d) return;
    d.sec.style.transform = 'translateY(' + (y - d.startY) + 'px)';
    const secs = [...shEl('profileBody').querySelectorAll('.p-sec[data-row]')];
    const i = secs.indexOf(d.sec), r = d.sec.getBoundingClientRect(), mid = r.top + r.height / 2;
    const prev = secs[i - 1], next = secs[i + 1];
    let moved = false;
    if(next){ const nr = next.getBoundingClientRect(); if(mid > nr.top + nr.height / 2){ next.after(d.sec); moved = true; } }
    if(!moved && prev){ const pr = prev.getBoundingClientRect(); if(mid < pr.top + pr.height / 2){ prev.before(d.sec); moved = true; } }
    if(moved){
      d.sec.style.transform = '';
      const t = r.top - d.sec.getBoundingClientRect().top;
      d.sec.style.transform = 'translateY(' + t + 'px)';
      d.startY = y - t;
    }
  }
  shEl('profileBody').addEventListener('pointerdown', e => {
    const h = e.target.closest('.p-handle');
    if(!h || !document.body.classList.contains('sh-reorder')) return;
    e.preventDefault();
    const sec = h.closest('.p-sec[data-row]');
    shDrag = {sec, startY: e.clientY, pid: e.pointerId};
    sec.classList.add('dragging');
    try{ h.setPointerCapture(e.pointerId); }catch(err){}
  });
  shEl('profileBody').addEventListener('pointermove', e => { if(shDrag && e.pointerId === shDrag.pid) shDragMove(e.clientY); });
  function shDragEnd(e){
    if(!shDrag || e.pointerId !== shDrag.pid) return;
    const sec = shDrag.sec;
    sec.style.transform = ''; sec.classList.remove('dragging'); shDrag = null;
    if(!state.filterOrder) state.filterOrder = {movie: [], tv: []};
    state.filterOrder.profile = [...shEl('profileBody').querySelectorAll('.p-sec[data-row]')].map(x => x.dataset.row);
    persist();
  }
  shEl('profileBody').addEventListener('pointerup', shDragEnd);
  shEl('profileBody').addEventListener('pointercancel', shDragEnd);

  // ---------- Upcoming episodes ----------
  function shDayDiff(dateStr){
    const t = new Date(); t.setHours(0,0,0,0);
    const d = new Date(dateStr + 'T00:00:00');
    return Math.round((d - t) / 86400000);
  }
  function renderUpcoming(){
    const host = shEl('viewUpcoming');
    const rows = state.items
      .filter(i => i.type === 'tv' && i.category !== 'stopped' && i.nextEp && i.nextEp.date && shDayDiff(i.nextEp.date) >= 0)
      .sort((a, b) => a.nextEp.date.localeCompare(b.nextEp.date));
    if(!rows.length){
      host.innerHTML = '<div class="up-empty"><b>' + (statusBackfillRunning ? 'Checking your shows…' : 'Nothing upcoming') + '</b>Episodes of shows that are still airing will appear here.</div>';
      return;
    }
    const groupOf = n => n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n <= 7 ? 'This week' : n <= 14 ? 'Next week' : 'Later';
    let html = '', last = '';
    rows.forEach(i => {
      const n = shDayDiff(i.nextEp.date), g = groupOf(n);
      if(g !== last){ html += '<div class="up-group-h">' + g + '</div>'; last = g; }
      const d = new Date(i.nextEp.date + 'T00:00:00');
      const ds = d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
      const ep = 'S' + String(i.nextEp.s).padStart(2,'0') + 'E' + String(i.nextEp.e).padStart(2,'0') + (i.nextEp.name ? ' · ' + escapeHtml(i.nextEp.name) : '');
      const img = i.posterPath ? '<img src="' + IMG_BASE + i.posterPath + '" alt="" loading="lazy">' : '<div class="nop"></div>';
      html += '<div class="up-row" data-id="' + i.id + '">' + img + '<div class="up-meta"><div class="t">' + escapeHtml(i.title) + '</div><div class="e">' + ep + '</div></div><div class="up-date">' + ds + '<br><span class="chip">' + (n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days') + '</span></div></div>';
    });
    host.innerHTML = html;
  }
  shEl('viewUpcoming').addEventListener('click', e => {
    const r = e.target.closest('.up-row'); if(r) openDetail(r.dataset.id);
  });

  // ---------- bottom sheet (shared by Explore "add to list" and "new category") ----------
  const shSheet = document.createElement('div');
  shSheet.className = 'sh-overlay';
  shSheet.innerHTML = '<div class="sh-sheet" id="shSheetBody"></div>';
  document.body.appendChild(shSheet);
  function shOpenSheet(html){ shEl('shSheetBody').innerHTML = html; shSheet.classList.add('open'); }
  function shCloseSheet(){ shSheet.classList.remove('open'); }
  shSheet.addEventListener('click', e => { if(e.target === shSheet) shCloseSheet(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') shCloseSheet(); });

  // ---------- Profile: choose which of your categories show as poster rows ----------
  function openPicker(){
    const grp = (t, lbl) => {
      const cats = state.categories[t] || [];
      return '<div class="sh-lbl">' + lbl + '</div><div class="sh-chips">' + cats.map(c => {
        const n = state.items.filter(i => i.type === t && i.category === c.key).length;
        return '<button type="button" class="sh-chip' + (c.pinned ? ' on' : '') + '" data-pin="' + t + '|' + c.key + '">' + (c.pinned ? '&#10003; ' : '') + escapeHtml(c.label) + ' <span style="opacity:.55">' + n + '</span></button>';
      }).join('') + '</div>';
    };
    shOpenSheet('<div class="sh-title">Add a category</div><div class="sh-meta">Pick any category you already have and it shows on your Profile as a row of posters, above the defaults. Tap again to remove it.</div>' +
      grp('tv', 'Shows') + grp('movie', 'Movies') + '<button type="button" class="yellow-btn sh-go" id="pkDone">Done</button>');
  }
  function togglePin(t, key){
    const c = (state.categories[t] || []).find(x => x.key === key);
    if(!c) return;
    if(c.pinned) delete c.pinned; else c.pinned = Date.now();
    persist();
    renderProfile();
  }
  shEl('shSheetBody').addEventListener('click', e => {
    const pin = e.target.closest('.sh-chip[data-pin]');
    if(pin){
      const sc = shEl('shSheetBody').scrollTop;
      const [t, k] = pin.dataset.pin.split('|');
      togglePin(t, k); openPicker(); shEl('shSheetBody').scrollTop = sc; return;
    }
    if(e.target.closest('#pkDone')){ shCloseSheet(); return; }
    const chip = e.target.closest('.sh-chip[data-cat]');
    if(chip) exAdd(chip.dataset.cat);
  });

  // ---------- Explore (TMDB discover) ----------
  const EX_BACKDROP = 'https://image.tmdb.org/t/p/w780';
  const EX_TTL = 30 * 60 * 1000;
  const EX_ROWS = {
    tv: [
      {t:'Trending this week', p:'trending/tv/week'}, {t:'Popular', p:'tv/popular'}, {t:'Top rated', p:'tv/top_rated'}, {t:'On the air', p:'tv/on_the_air'},
      {t:'Crime', p:'discover/tv', q:'with_genres=80&sort_by=popularity.desc'}, {t:'Sci-Fi & Fantasy', p:'discover/tv', q:'with_genres=10765&sort_by=popularity.desc'},
      {t:'Drama', p:'discover/tv', q:'with_genres=18&sort_by=popularity.desc'}, {t:'Comedy', p:'discover/tv', q:'with_genres=35&sort_by=popularity.desc'},
      {t:'Action & Adventure', p:'discover/tv', q:'with_genres=10759&sort_by=popularity.desc'}, {t:'Mystery', p:'discover/tv', q:'with_genres=9648&sort_by=popularity.desc'},
      {t:'Animation', p:'discover/tv', q:'with_genres=16&sort_by=popularity.desc'}
    ],
    movie: [
      {t:'Trending this week', p:'trending/movie/week'}, {t:'Popular', p:'movie/popular'}, {t:'Top rated', p:'movie/top_rated'}, {t:'Now playing', p:'movie/now_playing'}, {t:'Coming soon', p:'movie/upcoming'},
      {t:'Action', p:'discover/movie', q:'with_genres=28&sort_by=popularity.desc'}, {t:'Thriller', p:'discover/movie', q:'with_genres=53&sort_by=popularity.desc'},
      {t:'Sci-Fi', p:'discover/movie', q:'with_genres=878&sort_by=popularity.desc'}, {t:'Crime', p:'discover/movie', q:'with_genres=80&sort_by=popularity.desc'},
      {t:'Drama', p:'discover/movie', q:'with_genres=18&sort_by=popularity.desc'}, {t:'Comedy', p:'discover/movie', q:'with_genres=35&sort_by=popularity.desc'},
      {t:'Horror', p:'discover/movie', q:'with_genres=27&sort_by=popularity.desc'}, {t:'Animation', p:'discover/movie', q:'with_genres=16&sort_by=popularity.desc'}
    ]
  };
  let exType = 'tv', exSig = '', exToken = 0, exCurrent = null;
  const exCache = {}, exMap = {};

  async function exFetch(row){
    const key = activeLibrary + '|' + row.p + '|' + (row.q || '');
    const hit = exCache[key];
    if(hit && Date.now() - hit.t < EX_TTL) return hit.d;
    try{
      const r = await fetch(`${TMDB_BASE}/${row.p}?api_key=${TMDB_KEY}${row.q ? '&' + row.q : ''}${tmdbLangParam()}`);
      if(!r.ok) return null;
      const j = await r.json();
      const d = (j.results || []).filter(x => x.poster_path);
      exCache[key] = {t: Date.now(), d};
      return d;
    }catch(e){ return null; }
  }
  function exYear(r){ const d = r.release_date || r.first_air_date || ''; return d ? parseInt(d.slice(0, 4), 10) : new Date().getFullYear(); }
  function exTitle(r){ return r.title || r.name || ''; }
  function exFindItem(r, type){
    const title = exTitle(r).toLowerCase(), year = exYear(r);
    return state.items.find(i => i.type === type && ((i.tmdbId && i.tmdbId === r.id) || (i.title.toLowerCase() === title && i.year === year)));
  }
  function exMarkInLibrary(){
    document.querySelectorAll('#exploreDiscover .ex-card, #exploreDiscover .ex-slide').forEach(el => {
      if(el.classList.contains('sk')) return;
      const r = exMap[exType + ':' + el.dataset.id];
      if(r) el.classList.toggle('in-lib', !!exFindItem(r, exType));
    });
  }
  function exCardHtml(x){
    exMap[exType + ':' + x.id] = x;
    return '<div class="ex-card" data-id="' + x.id + '"><img src="' + IMG_BASE + x.poster_path + '" alt="" loading="lazy" decoding="async" draggable="false"><span class="ex-in">&#10003;</span></div>';
  }
  function renderExplore(force){
    const host = shEl('exploreDiscover');
    const sig = activeLibrary + '|' + exType;
    if(!force && exSig === sig && host.childElementCount){ exMarkInLibrary(); return; }
    exSig = sig;
    const token = ++exToken;
    const rows = EX_ROWS[exType];
    host.innerHTML = '<div class="ex-hero" id="exHero"><div class="ex-slide sk"></div></div>';
    const secs = rows.map(row => {
      const sec = document.createElement('section');
      sec.className = 'ex-sec';
      sec.innerHTML = '<div class="ex-h">' + escapeHtml(row.t) + '</div><div class="ex-scroll">' + '<div class="ex-card sk"></div>'.repeat(8) + '</div>';
      host.appendChild(sec);
      return sec;
    });
    let ok = 0, left = rows.length;
    rows.forEach((row, idx) => {
      exFetch(row).then(d => {
        if(token !== exToken) return;
        left--;
        if(!d || !d.length){ secs[idx].remove(); if(idx === 0) shEl('exHero') && shEl('exHero').remove(); }
        else {
          ok++;
          secs[idx].querySelector('.ex-scroll').innerHTML = d.map(exCardHtml).join('');
          if(document.body.dataset.screen === 'explore' && !reduceMotion){ shStaggerRows('.ex-scroll', '.ex-card', secs[idx]); setTimeout(() => secs[idx] && secs[idx].querySelectorAll('.sh-card').forEach(el => el.classList.remove('sh-card')), 1200); }
          if(idx === 0){
            const hero = shEl('exHero');
            const slides = d.filter(x => x.backdrop_path).slice(0, 6);
            if(hero && slides.length){
              hero.innerHTML = slides.map(x => {
                exMap[exType + ':' + x.id] = x;
                const rating = x.vote_average ? ' · ★ ' + x.vote_average.toFixed(1) : '';
                return '<div class="ex-slide" data-id="' + x.id + '" style="background-image:url(' + EX_BACKDROP + x.backdrop_path + ')"><span class="ex-pill"></span><div class="ex-slide-in"><div class="t">' + escapeHtml(exTitle(x)) + '</div><div class="m">' + exYear(x) + rating + '</div></div></div>';
              }).join('');
              if(document.body.dataset.screen === 'explore' && !reduceMotion){ shStaggerRows('.ex-hero', '.ex-slide', host); setTimeout(() => hero.querySelectorAll('.sh-card').forEach(el => el.classList.remove('sh-card')), 1200); }
            } else if(hero){ hero.remove(); }
          }
          exMarkInLibrary();
        }
        if(left === 0 && ok === 0) host.innerHTML = '<div class="ex-fail" id="exRetry">Couldn&rsquo;t load suggestions.<br>Check your connection and tap here to try again.</div>';
      });
    });
  }
  function exOpen(r, type){
    exCurrent = {r, type};
    const cats = state.categories[type] || [];
    const inLib = exFindItem(r, type);
    const lbl = inLib ? ((cats.find(c => c.key === inLib.category) || {}).label || inLib.category) : '';
    const poster = r.poster_path ? '<img src="' + IMG_BASE + r.poster_path + '" alt="">' : '<div class="nop"></div>';
    const rating = r.vote_average ? ' · ★ ' + r.vote_average.toFixed(1) : '';
    shOpenSheet('<div class="sh-top">' + poster + '<div><div class="sh-title">' + escapeHtml(exTitle(r)) + '</div><div class="sh-meta">' + (type === 'tv' ? 'TV show' : 'Movie') + ' · ' + exYear(r) + rating + '</div><div class="sh-over">' + escapeHtml(r.overview || 'No description available.') + '</div></div></div>' +
      (inLib ? '<div class="sh-note">Already in your lists &mdash; ' + escapeHtml(lbl) + '</div>'
             : '<div class="sh-lbl">Add to</div><div class="sh-chips">' + cats.map(c => '<button type="button" class="sh-chip" data-cat="' + c.key + '">' + escapeHtml(c.label) + '</button>').join('') + '</div>'));
  }
  function exAdd(catKey){
    if(!exCurrent) return;
    const {r, type} = exCurrent;
    addItem({title: exTitle(r), year: exYear(r), type, tmdbId: r.id, posterPath: r.poster_path || null, category: catKey});
    shCloseSheet();
    exMarkInLibrary();
  }
  shEl('exploreDiscover').addEventListener('click', e => {
    if(e.target.closest('#exRetry')){ renderExplore(true); return; }
    const el = e.target.closest('.ex-card, .ex-slide');
    if(!el || el.classList.contains('sk')) return;
    const r = exMap[exType + ':' + el.dataset.id];
    if(r) exOpen(r, exType);
  });
  shEl('exSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    exType = b.dataset.t;
    shEl('exSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    renderExplore();
  });
  // hide the discover rows while search results are showing
  new MutationObserver(() => shEl('viewExplore').classList.toggle('searching', shEl('searchResults').classList.contains('open')))
    .observe(shEl('searchResults'), {attributes: true, attributeFilter: ['class']});

  // "new version ready" banner: the app opens from its saved copy, so a fresh copy is offered here when one has been downloaded
  function shShowUpdate(){
    if(document.getElementById('updBanner')) return;
    const b = document.createElement('div');
    b.id = 'updBanner'; b.className = 'upd-banner';
    b.innerHTML = '<span>A new version is ready</span><button type="button">Refresh</button>';
    b.querySelector('button').addEventListener('click', () => location.reload());
    document.body.appendChild(b);
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message', e => { if(e.data && e.data.type === 'archive-update') shShowUpdate(); });
  }

  // keep Profile / Upcoming fresh whenever the app updates its stats (after add, move, delete, library switch…)
  const shOrigRenderStats = renderStats;
  renderStats = function(){
    shOrigRenderStats();
    const s = document.body.dataset.screen;
    if(s === 'profile') renderProfile();
    if(s === 'upcoming') renderUpcoming();
    if(s === 'explore') exMarkInLibrary();
    shUpdateEmpty();
  };
  setScreen('shows', 'watch', {noPush: true});
  try{ history.replaceState({sh: 1, idx: 0, view: 'shows', sub: 'watch', filter: 'all'}, ''); }catch(e){}
  shSyncBack();

  init();
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
